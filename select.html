<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AstroQ — Cấp Thẻ ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#eaf1ff; --ink-soft:#a9b8e8; --ink-faint:#7f8dc4;
  --glass:rgba(15,23,42,0.6); --glass-brd:rgba(56,189,248,.4); --glass-brd-strong:rgba(125,211,252,.7);
  --sun:#ffcf6b; --sun-warm:#ff9d3d; --accent:#5fd3ff; --accent-2:#8f7bff; --good:#63e6a8; --neon:#38bdf8;
  --shadow-soft:0 18px 50px -18px rgba(0,0,0,0.7);
  --font-display:"Space Grotesk",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif; --font-mono:"Share Tech Mono",monospace;
  --ease:cubic-bezier(.22,.61,.36,1); --jelly:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;} html,body{margin:0;min-height:100%;}
body{font-family:var(--font-body);color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse at 50% 16%, #101838 0%, #0a0e20 44%, #070913 100%);}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}

/* nền sao */
.nebula{position:fixed;inset:-10%;z-index:0;pointer-events:none;filter:blur(8px);
  background:radial-gradient(closest-side at 22% 28%, rgba(143,123,255,.28), transparent 70%),
            radial-gradient(closest-side at 78% 20%, rgba(56,189,248,.2), transparent 70%);}
.stars{position:fixed;inset:-60%;z-index:0;pointer-events:none;opacity:.8;background-repeat:repeat;background-size:520px 520px;
  background-image:radial-gradient(1.4px 1.4px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 20%,#dcecff,transparent),
    radial-gradient(1px 1px at 60% 70%,#cfe0ff,transparent),radial-gradient(1.2px 1.2px at 40% 85%,#fff,transparent);
  animation:drift 160s linear infinite, tw 5s ease-in-out infinite;}
@keyframes drift{from{transform:translate3d(0,0,0);}to{transform:translate3d(-240px,170px,0);}}
@keyframes tw{0%,100%{opacity:.4;}50%{opacity:.9;}}

header{position:relative;z-index:5;display:flex;align-items:center;gap:14px;padding:16px clamp(18px,4vw,40px);}
.brand{display:flex;align-items:center;gap:11px;}
.brand .mark{width:34px;height:34px;border-radius:11px;background:radial-gradient(circle at 32% 28%,#fff2cf,var(--sun) 45%,var(--sun-warm) 90%);box-shadow:0 0 20px rgba(255,175,80,.6);}
.brand b{font-family:var(--font-display);font-weight:700;font-size:18px;}
header .spacer{flex:1;}
.lang-switch{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:rgba(8,14,38,.6);border:1px solid var(--glass-brd);}
.lang-switch button{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:12px;padding:6px 11px;border-radius:999px;}
.lang-switch button.active{color:#04060f;background:linear-gradient(120deg,var(--sun),var(--sun-warm));}

main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:6px clamp(18px,4vw,40px) 60px;}
.head{text-align:center;margin-bottom:22px;}
.head .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);text-shadow:0 0 12px rgba(56,189,248,.6);}
.head h1{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,4vw,34px);margin:8px 0 0;}
.head p{color:var(--ink-soft);font-size:14px;margin:8px 0 0;}

.stage{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }

/* ===== THẺ ID (glassmorphism) ===== */
.idcard{position:relative;border-radius:24px;padding:22px 22px 26px;overflow:hidden;
  background:var(--glass);border:1px solid var(--glass-brd);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:var(--shadow-soft), 0 0 30px -6px rgba(56,189,248,.4), inset 0 0 34px -14px rgba(56,189,248,.6);}
.idcard::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(120,160,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.06) 1px,transparent 1px);
  background-size:20px 20px;-webkit-mask:linear-gradient(180deg,#000,transparent 80%);mask:linear-gradient(180deg,#000,transparent 80%);}
.idcard-strip{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase;}
.idcard-strip .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);}
.ava-frame{width:132px;height:132px;margin:16px auto 6px;border-radius:50%;overflow:hidden;position:relative;
  border:2px solid var(--glass-brd-strong);box-shadow:0 0 30px rgba(56,189,248,.55), inset 0 0 20px rgba(0,0,0,.5);
  background:radial-gradient(circle at 50% 40%, rgba(56,189,248,.25), rgba(10,16,40,.6));}
/* Zoom theo từng nhân vật (--z) để đồng bộ cỡ đầu, không lẹm vào đầu (mặc định 1 = không phóng) */
.ava-frame img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;transform:scale(var(--z,1));transform-origin:center;}
.ava-frame img.pop{animation:avaPop .42s var(--jelly);}
@keyframes avaPop{0%{transform:scale(calc(var(--z,1)*.55));opacity:.2;}100%{transform:scale(var(--z,1));opacity:1;}}
.idcard-name-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;color:var(--ink-faint);margin:14px 0 6px;text-transform:uppercase;}
#pilot-name{width:100%;border:1px solid var(--glass-brd);background:rgba(255,255,255,.06);color:var(--ink);border-radius:12px;
  padding:12px 13px;font-size:15px;font-family:var(--font-body);transition:border-color .2s,background .2s;}
#pilot-name:focus{outline:none;border-color:var(--accent);background:rgba(56,189,248,.08);}
.idcard-meta{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-faint);margin-top:12px;}
.start-btn{width:100%;margin-top:18px;border:none;cursor:pointer;padding:15px;border-radius:14px;
  font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.04em;color:#04060f;
  background:linear-gradient(120deg,var(--accent),var(--accent-2));
  box-shadow:0 0 24px -2px rgba(56,189,248,.7), 0 12px 26px -12px rgba(56,189,248,.8);
  transition:transform .25s var(--jelly),filter .2s;animation:btnGlow 2.4s ease-in-out infinite;}
@keyframes btnGlow{0%,100%{box-shadow:0 0 20px -4px rgba(56,189,248,.6), 0 12px 26px -12px rgba(56,189,248,.7);}50%{box-shadow:0 0 34px 0 rgba(56,189,248,.9), 0 12px 26px -12px rgba(56,189,248,.9);}}
.start-btn:hover{filter:brightness(1.08);transform:translateY(-2px);}
.start-btn:active{transform:scale(.95);}
.start-btn:disabled{opacity:.7;cursor:default;animation:none;}
/* dấu APPROVED */
.stamp{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-16deg) scale(1.8);opacity:0;pointer-events:none;
  font-family:var(--font-display);font-weight:800;font-size:32px;letter-spacing:.08em;color:var(--good);text-transform:uppercase;
  border:4px solid var(--good);border-radius:12px;padding:6px 16px;box-shadow:0 0 24px rgba(99,230,168,.6);text-shadow:0 0 12px rgba(99,230,168,.5);}
.stamp.show{animation:stampIn .5s var(--jelly) forwards;}
@keyframes stampIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(-16deg) scale(1.9);}60%{opacity:1;transform:translate(-50%,-50%) rotate(-16deg) scale(.9);}100%{opacity:1;transform:translate(-50%,-50%) rotate(-16deg) scale(1);}}

/* ===== PANEL CHỌN NHÂN VẬT ===== */
.selectpanel{display:flex;flex-direction:column;gap:16px;}
.selectpanel h2{font-family:var(--font-display);font-weight:700;font-size:18px;margin:0;display:flex;align-items:center;gap:10px;}
.selectpanel h2::before{content:"";width:16px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;}
.char{position:relative;cursor:pointer;border:1px solid var(--glass-brd);border-radius:16px;padding:12px 8px 8px;
  background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .25s var(--jelly),border-color .2s,box-shadow .25s;}
.char .char-glow{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:70%;height:34px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 100%, rgba(56,189,248,.5),transparent 70%);filter:blur(4px);opacity:.5;transition:opacity .2s;}
.char img{width:100%;height:74px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));animation:bounce 2.6s ease-in-out infinite;animation-delay:var(--d,0s);}
.char .char-nm{font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--ink-soft);}
.char:hover{transform:translateY(-4px);border-color:var(--glass-brd-strong);box-shadow:0 0 24px -6px rgba(56,189,248,.6);}
.char:hover .char-glow{opacity:.9;}
.char.active{border-color:var(--glass-brd-strong);box-shadow:0 0 30px -2px rgba(56,189,248,.75), inset 0 0 24px -12px rgba(56,189,248,.7);}
.char.active .char-nm{color:var(--ink);}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}

/* Thẻ nhân vật bí ẩn: bóng đen + dấu "?" phát sáng */
.char.mystery{cursor:not-allowed;}
.char.mystery .silhouette{position:relative;width:100%;height:74px;display:grid;place-items:center;}
.char.mystery .silhouette .q{font-family:var(--font-display);font-weight:800;font-size:40px;
  color:#bfe6ff;text-shadow:0 0 14px rgba(56,189,248,.95), 0 0 28px rgba(143,123,255,.7);
  animation:qpulse 1.8s ease-in-out infinite;}
@keyframes qpulse{0%,100%{opacity:.75;transform:scale(1);}50%{opacity:1;transform:scale(1.12);}}
.char.mystery .char-nm{letter-spacing:.22em;color:var(--ink-faint);}
.char.mystery:hover{border-color:var(--glass-brd-strong);box-shadow:0 0 24px -6px rgba(143,123,255,.6);transform:translateY(-4px);}
.char.mystery:hover .char-glow{opacity:.9;}

/* HUD info nhân vật (khung — nội dung stat sẽ cập nhật sau) */
.hud-info{position:relative;border-radius:18px;padding:18px;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s var(--jelly);
  background:var(--glass);border:1px solid var(--glass-brd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 0 26px -8px rgba(56,189,248,.4), inset 0 0 30px -16px rgba(56,189,248,.6);
  display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:center;}
.hud-info.show{opacity:1;transform:none;}
.hud-info .preview{display:grid;place-items:center;}
.hud-info .preview img{width:110px;height:120px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5)) drop-shadow(0 0 16px rgba(56,189,248,.5));animation:bounce 2.4s ease-in-out infinite;}
.hud-info .body{min-width:0;}
.hud-info .hud-name{font-family:var(--font-display);font-weight:700;font-size:20px;}
.hud-row{display:flex;gap:8px;font-size:12.5px;margin-top:6px;}
.hud-row .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;min-width:70px;}
.hud-row .v{color:var(--ink);font-weight:600;}
.stats{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.stat{display:flex;align-items:center;gap:8px;}
.stat .s-k{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--ink-faint);min-width:78px;text-transform:uppercase;}
.stat .s-bar{flex:1;height:7px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;box-shadow:inset 0 0 6px rgba(0,0,0,.5);}
.stat .s-bar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 10px rgba(56,189,248,.7);transition:width .6s var(--ease);}
@media (max-width:520px){ .hud-info{grid-template-columns:1fr;text-align:center;} .hud-row{justify-content:center;} .stat{justify-content:center;} }

.sel-toast{position:fixed;top:20px;left:50%;z-index:60;transform:translateX(-50%) translateY(-14px);padding:11px 18px;border-radius:999px;
  background:rgba(12,20,50,.85);border:1px solid var(--glass-brd-strong);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  color:var(--ink);font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;}
.sel-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;} }
</style>
</head>
<body>
<div class="nebula"></div>
<div class="stars"></div>

<header>
  <a class="brand" href="index.html"><span class="mark"></span><b>AstroQ</b></a>
  <span class="spacer"></span>
  <div class="lang-switch" role="group" aria-label="Language / Ngôn ngữ">
    <button type="button" data-lang="vi">VI</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>
  <div class="head">
    <div class="eyebrow" data-i18n="title">CẤP THẺ ID PHI HÀNH GIA</div>
    <p data-i18n="subtitle">Chọn nhân vật & đặt tên để bắt đầu</p>
  </div>

  <div class="stage">
    <!-- THẺ ID -->
    <section class="idcard">
      <div class="idcard-strip"><span data-i18n="pilot">PHI HÀNH GIA</span><span><span class="dot"></span> ID · AQ-2087</span></div>
      <div class="ava-frame"><img id="card-ava" src="ava/avam.png" alt="Avatar" /></div>
      <div class="idcard-name-label" data-i18n="name_label">TÊN PHI HÀNH GIA</div>
      <input id="pilot-name" type="text" maxlength="24" autocomplete="off" placeholder="Nhập tên của bạn…" />
      <div class="idcard-meta"><span data-i18n="clearance">QUYỀN: TÂN BINH</span><span>ASTROQ · 2087</span></div>
      <button id="start-journey" class="start-btn" type="button" data-i18n="start">BẮT ĐẦU HÀNH TRÌNH</button>
      <div class="stamp" id="stamp">APPROVED</div>
    </section>

    <!-- CHỌN NHÂN VẬT + HUD -->
    <section class="selectpanel">
      <h2 data-i18n="choose">CHỌN NHÂN VẬT</h2>
      <div class="roster" id="roster"></div>

      <div class="hud-info" id="hud-info">
        <div class="preview"><img id="hud-model" src="3d/m3d.png" alt="" /></div>
        <div class="body">
          <div class="hud-name" id="hud-name">—</div>
          <div class="hud-row"><span class="k" data-i18n="role">CHỨC VỤ</span><span class="v" id="hud-role">—</span></div>
          <div class="hud-row"><span class="k" data-i18n="trait">TÍNH CÁCH</span><span class="v" id="hud-trait">—</span></div>
          <div class="stats">
            <div class="stat"><span class="s-k" data-i18n="s_pow">NĂNG LƯỢNG</span><span class="s-bar"><i id="stat-pow"></i></span></div>
            <div class="stat"><span class="s-k" data-i18n="s_spd">TỐC ĐỘ</span><span class="s-bar"><i id="stat-spd"></i></span></div>
            <div class="stat"><span class="s-k" data-i18n="s_iq">TRÍ TUỆ</span><span class="s-bar"><i id="stat-iq"></i></span></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<div class="sel-toast" id="sel-toast" role="status" aria-live="polite"></div>

<script src="js/auth-flow.js"></script>
</body>
</html>
