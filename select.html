<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Trang app chưa mở cửa (dự kiến 08/2026) — noindex để Google không đưa vào
     kết quả tìm kiếm khi thông điệp chính thức vẫn là "sắp ra mắt".
     follow = vẫn cho bot đi theo link. XOÁ dòng robots này khi app mở cửa,
     đồng thời bỏ noindex ở landing-app.html và bổ sung URL vào sitemap.xml. -->
<meta name="robots" content="noindex,follow" />
<title>AstroQ — Cấp Thẻ ID</title>
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/cockpit.css" />
<link rel="stylesheet" href="css/user-menu.css" />
<link rel="stylesheet" href="css/select.css" />
</head>
<body>
<div class="nebula"></div>
<div class="stars"></div>

<header>
  <a class="brand" href="landing-app.html"><img class="brand-logo" src="img/astroq-logo.png" width="117" height="34" alt="astroQ" decoding="async"></a>
  <span class="spacer"></span>
  <!-- Bo chon ngon ngu dang MENU THA. Khung + hanh vi:
       css/user-menu.css + js/user-menu.js (dung chung voi dashboard).
       ⚠️ Danh sach ngon ngu do js/user-menu.js dung — hai o rong duoi day
          la CHO DE NO GHI VAO, dung go tay ten ngon ngu nao o day.
       ⚠️ `.lang-switch` GIU DUNG TEN: `AstroQ.initLang` gan su kien cho
          `.lang-switch button`, dat ten rieng la lap lai dung loi da lam
          `explorer.html` mat han nut doi ngon ngu trong nhieu thang. -->
  <div class="um lang-pick" data-menu>
    <button class="um-btn" type="button" data-menu-btn
            data-i18n-aria="a_lang" aria-label="Ngôn ngữ"
            data-i18n-title="a_lang" title="Ngôn ngữ">
      <span class="um-code" data-lang-code>VI</span>
      <span class="um-caret" aria-hidden="true"></span>
    </button>
    <div class="um-pop" data-menu-pop hidden>
      <p class="um-head" data-i18n="lang_head">Ngôn ngữ</p>
      <div class="lang-switch" role="group" data-i18n-aria="a_lang"
           aria-label="Language / Ngôn ngữ" data-lang-list></div>
      <div class="um-sep"></div>
      <p class="um-head" data-i18n="lang_soon_h">Đang dịch, sắp có</p>
      <div class="lang-soon" data-lang-soon-list></div>
    </div>
  </div>
</header>

<main>
  <div class="head">
    <div class="eyebrow" data-i18n="title">CẤP THẺ ID PHI HÀNH GIA</div>
    <p data-i18n="subtitle">Chọn nhân vật & đặt tên để bắt đầu</p>
  </div>

  <div class="stage">
    <!-- THẺ ID -->
    <section class="idcard">
      <div class="idcard-strip"><span data-i18n="pilot">PHI HÀNH GIA</span><span><span class="dot"></span> ID · AQ-2087</span></div>
      <div class="ava-frame"><img id="card-ava" src="ava/avam.png" alt="Avatar" /></div>
      <div class="idcard-name-label" data-i18n="name_label">TÊN PHI HÀNH GIA</div>
      <input id="pilot-name" type="text" maxlength="24" autocomplete="off" data-i18n-ph="name_ph" placeholder="Nhập tên của bạn…" />

      <!-- ĐỘ SÂU LỜI GIẢI THÍCH — hỏi TUỔI, lưu BẬC.
           ⚠️ Chỉ lưu "junior"/"senior", KHÔNG lưu tuổi (xem js/depth.js).
           ⚠️ Đổi lại bất cứ lúc nào ở profile.html — nên đây không phải một
              lựa chọn khoá cứng, và câu phụ nói rõ điều đó. -->
      <div class="idcard-name-label" id="age-label">BẠN BAO NHIÊU TUỔI?</div>
      <div class="agepick" id="agepick" role="group" aria-labelledby="age-label">
        <button type="button" class="age-btn" id="age-junior" data-band="junior">8–10</button>
        <button type="button" class="age-btn" id="age-senior" data-band="senior">11+</button>
      </div>
      <p class="age-note" id="age-note"></p>

      <div class="idcard-meta"><span data-i18n="clearance">QUYỀN: TÂN BINH</span><span>ASTROQ · 2087</span></div>
      <button id="start-journey" class="start-btn" type="button" data-i18n="start">BẮT ĐẦU HÀNH TRÌNH</button>
      <div class="stamp" id="stamp">APPROVED</div>
    </section>

    <!-- CHỌN NHÂN VẬT + HUD -->
    <section class="selectpanel">
      <h2 data-i18n="choose">CHỌN NHÂN VẬT</h2>
      <div class="roster" id="roster"></div>

      <div class="hud-info" id="hud-info">
        <div class="preview"><img id="hud-model" src="3d/m3d.png" alt="" /></div>
        <div class="body">
          <div class="hud-name" id="hud-name">—</div>
          <div class="hud-row"><span class="k" data-i18n="role">CHỨC VỤ</span><span class="v" id="hud-role">—</span></div>
          <div class="hud-row"><span class="k" data-i18n="trait">TÍNH CÁCH</span><span class="v" id="hud-trait">—</span></div>
          <div class="stats">
            <div class="stat"><span class="s-k" data-i18n="s_pow">NĂNG LƯỢNG</span><span class="s-bar"><i id="stat-pow"></i></span></div>
            <div class="stat"><span class="s-k" data-i18n="s_spd">TỐC ĐỘ</span><span class="s-bar"><i id="stat-spd"></i></span></div>
            <div class="stat"><span class="s-k" data-i18n="s_iq">TRÍ TUỆ</span><span class="s-bar"><i id="stat-iq"></i></span></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<div class="sel-toast" id="sel-toast" role="status" aria-live="polite"></div>

<script src="js/ui-common.js"></script>
<!-- ⚠️ `AstroQUserMenu.init()` phai chay TRUOC `AstroQ.initLang()`. -->
<script src="js/user-menu.js"></script>
<!-- Roster nhân vật dùng chung với profile.html — phải nạp TRƯỚC auth-flow.js -->
<script src="js/characters.js"></script>
<script src="js/depth.js"></script>
<script src="js/cosmetics.js"></script>
<script src="js/auth-flow.js"></script>
</body>
</html>
