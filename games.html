  /* ================= Số dư ================= */
  function paintBalance(){ $("bal").textContent = Economy.getAsteroids(); }

  /* ================= Hồ sơ huấn luyện =================
     Đọc cache do trang CÓ token ghi (dashboard/profile/achievements). Trang này
     cố ý không nạp SDK Firebase — xem ghi chú ở cuối file.
     ⚠️ `known:false` nghĩa là CHƯA BIẾT, không phải "chưa đạt gì". */
  var TRAIN = { known:false, passed:0, total:0, programs:[] };
  function loadTraining(){
    TRAIN = (window.AstroQProgress && AstroQProgress.training)
      ? AstroQProgress.training()
      : { known:false, passed:0, total:0, programs:[] };
  }
  /** Trạng thái của một chương trình; null nếu chưa biết gì. */
  function progOf(key){
    if(!TRAIN.known) return null;
    for(var i=0;i<TRAIN.programs.length;i++){
      if(TRAIN.programs[i].key===key) return TRAIN.programs[i];
    }
    return null;
  }
  function fill(s,a,b){ return String(s).replace("{a}",a).replace("{b}",b); }

  function paintRecord(){
    var box=$("record");
    /* Chưa đăng nhập lần nào thì ẩn hẳn khối — hiện một hồ sơ trống kèm câu
       giải thích cho người chưa từng có hồ sơ là thêm nhiễu, không thêm tin. */
    if(!TRAIN.known && !AstroQ.getUser()){ box.hidden=true; return; }
    box.hidden=false;
    if(!TRAIN.known){
      $("rec-n").textContent="—";
      $("rec-dots").innerHTML="";
      $("rec-note").textContent=t("cert_none");
      $("rec-note").hidden=false;
      return;
    }
    $("rec-n").textContent=fill(t("cert_n"), TRAIN.levels, TRAIN.maxLevels);
    $("rec-note").hidden=true;
    /* Mỗi chương trình một thanh, tô theo TỈ LỆ cấp đã đạt — nhìn một cái là
       thấy mình đang mạnh chỗ nào và còn chỗ nào chưa động tới. */
    $("rec-dots").innerHTML = TRAIN.programs.map(function(p){
      var mx=p.maxLevel||0, pct = mx ? Math.round((p.level||0)*100/mx) : 0;
      return '<span class="rd" title="'+
             AstroQ.esc(AstroQTraining.name(p.key,LANG)+" — "+fill(t("lv"), p.level||0, mx))+
             '"><i style="width:'+pct+'%"></i></span>';
    }).join("");
  }

  /* ================= Render thẻ trò chơi ================= */
  function render(){
    // Sắp xếp: game đã có (ready) trước, game sắp ra mắt (soon) sau
    var list = GAMES.slice().sort(function(a,b){ return (a.status==="ready"?0:1) - (b.status==="ready"?0:1); });
    $("games").innerHTML = list.map(function(g){
      var soon = g.status!=="ready";
      var code = g.code || "ARCADE-??";
      /* ⚠️ Thẻ khoá thì để HUY HIỆU nói trạng thái, không in thêm chữ ở ô phải:
         `.lk-pin` neo tuyệt đối đúng chỗ đó nên hai thứ chồng lên nhau (lỗi đè chữ
         sửa 19/08/2026). Dựng huy hiệu TRƯỚC rồi mới quyết — mất `js/locks.js` thì
         `badge` rỗng và chữ trạng thái vẫn in ra, tức hỏng theo hướng an toàn. */
      var lk = (soon && window.AstroQLocks) ? AstroQLocks.get("game:"+g.key) : null;
      var badge = lk
        ? '<span class="lk-badge '+lk.state+' lk-pin">'+
            AstroQ.esc(AstroQLocks.text(lk.state==="soon" ? "badge_soon" : "badge_pro"))+
          '</span>'
        : '';
      var status = soon
        ? (badge ? '' : '<span class="soon">'+t("soon")+'</span>')
        : '<span class="online">SYS.ONLINE</span>';
      var btn = soon
        /* Nhan nut khoa la mot cau hoi BAM DUOC — nut nay mo modal, nen nhan
           phai moi bam chu khong lap lai dung chu "Sap ra mat" ngay phia tren. */
        ? '<button class="play-btn locked" data-key="'+g.key+'">'+t("when")+'</button>'
        : '<button class="play-btn" data-key="'+g.key+'">'+t("play")+'</button>';
      /* ── Dòng KỸ NĂNG: chương trình này luyện được cái gì. Đây là thứ biến một
            thẻ game thành một thẻ khoá học. */
      var sk = AstroQTraining.skill(g.prog, LANG);
      var skill = sk ? '<p class="skill"><b>'+AstroQ.esc(t("skill_lb"))+':</b> '+
                       AstroQ.esc(sk)+'</p>' : '';

      /* ⚠️ ĐƯỜNG SANG BÀI ĐỌC ĐÃ BỎ 15/08/2026 (chủ dự án chốt: *"bỏ phần đọc
            thêm ở các trò chơi"*). Nó thêm từ 14/08 dưới dạng GỢI Ý không khoá,
            nhưng trên một thẻ game thì nó là dòng thứ tư cạnh tên · kỹ năng · cấp
            — thẻ đọc thành một bảng chữ, mà thứ trẻ vào đây để làm là BẤM CHƠI.
            ⚠️ Dữ liệu `read` và hàm `AstroQTraining.read()` cũng đã gỡ theo, không
               để lại: một trường không ai đọc là một lời khai sai (bài học `lv`
               của ngân hàng câu hỏi — khai ở 65 file, 0 chỗ đọc, ngủ 2 ngày).
            Kho bài đọc KHÔNG mất đường vào nào: nó vẫn là Góc Khám Phá trong
            Trạm Tri Thức, và `library.html?a=<id>` vẫn mở thẳng một bài. */

      /* ── CẤP HUẤN LUYỆN + mốc kế tiếp, chỉ khi ĐỌC ĐƯỢC hồ sơ.
            ⚠️⚠️ TRƯỚC 14/08/2026 chỗ này là một huy hiệu "✓ ĐÃ ĐẠT" — một dấu
               chấm hết bảo trẻ rằng ở đây hết việc. Chủ dự án bác đúng: khu này
               sinh ra để trẻ LUYỆN LẠI qua nhiều cấp. Nay nó luôn nói ra **mốc
               kế tiếp**, và ở cấp cao nhất thì mời phá kỷ lục của chính mình —
               không bao giờ có một câu nào đọc ra thành "xong rồi".
            ⚠️ Chưa biết thì KHÔNG vẽ gì — vẽ "Cấp 0" cho một đứa trẻ có thể đã
               lên cấp 3 là nói sai về tiến độ của nó.
            ⚠️ Mốc kế tiếp lấy khoá học ĐANG THẤP NHẤT (`next` gần nhất), vì cấp
               của chương trình chính là cấp thấp nhất trong các khoá — nói mốc
               của khoá đang cao là chỉ trẻ luyện sai chỗ. */
      var st2 = progOf(g.prog);
      var cert = "";
      if (st2) {
        var mx = st2.maxLevel || 0, lv = st2.level || 0;
        var atTop = mx > 0 && lv >= mx;
        cert = '<span class="cert lv'+(atTop ? " on" : "")+'">'+
                 AstroQ.esc(lv > 0 ? fill(t("lv"), lv, mx) : t("lv0"))+
               '</span>';
        // Thanh tiến độ tới mốc kế tiếp + câu nói còn bao nhiêu nữa
        var cs = (st2.courses || []).filter(function(c){ return c.next != null; });
        if (atTop || !cs.length) {
          cert += '<p class="nextgoal">'+AstroQ.esc(t("lv_max"))+'</p>';
        } else {
          cs.sort(function(a,b){ return a.level - b.level; });
          var c0 = cs[0];
          var pct = c0.next > 0 ? Math.max(0, Math.min(100, Math.round(c0.current*100/c0.next))) : 0;
          /* ⚠️ NÓI RA MỐC LÀ GÌ, đừng in hiệu số trần. Trước 21/08/2026 chỗ này
             in `next - current` nên thẻ đọc thành *"Còn 1 nữa lên Cấp 2"*, và chủ
             dự án bác đúng: *"ko biết là 1 trận, 4 trận hay điểm?"*. Con số của
             server không mang đơn vị; đơn vị là TÊN nên nó ở client
             (`AstroQTraining.goalText`) — đúng phân công server-giữ-mốc /
             client-giữ-tên. Phần "còn bao nhiêu nữa" thì thanh tiến độ nói bằng
             hình, và `title` nói bằng số cho ai rê chuột. */
          var goal = window.AstroQTraining
                   ? AstroQTraining.goalText(c0.game, c0.next, LANG)
                   : String(c0.next);
          cert += '<div class="lvbar" title="'+AstroQ.esc(c0.current+" / "+c0.next)+'">'+
                    '<i style="width:'+pct+'%"></i></div>'+
                  '<p class="nextgoal">'+
                    AstroQ.esc(fill(t("lv_next"), goal, c0.level + 1))+
                  '</p>';
        }
      }

      return '<article class="gcard '+g.cls+(soon?' soon':'')+(st2&&st2.maxLevel&&st2.level>=st2.maxLevel?' top':'')+'">'+
        '<div class="hud-line top"><span><span class="led'+(soon?' standby':'')+'"></span>'+code+'</span>'+status+'</div>'+
        badge+
        /* Bang mau theo TUNG game (`pal`), khong de tat ca roi ve tim mac dinh: sau
           the game cung mot mau doc ra don dieu voi tre — chu du an bat duoc dung
           chuyen do o dashboard 13/08/2026. Chua mo thi `sic--off` thang, vi luc do
           dieu can noi la "chua dung duoc", khong phai "khu nay mau gi". */
        /* ⚠️ ICON + NHÃN CHƯƠNG TRÌNH NẰM CÙNG MỘT HÀNG (15/08/2026). Trước đó
           nhãn nằm DƯỚI icon ở cỡ mono 10px, và chủ dự án bác đúng: *"chữ quá
           bé"*. Bên phải icon là một khoảng trống rộng bằng nửa thẻ — đưa nhãn
           vào đó thì nó được cỡ chữ gấp rưỡi mà thẻ KHÔNG cao thêm một pixel. */
        '<div class="gc-head">'+
          '<div class="ic">'+sic(g.icon, soon ? 'sic--off' : (g.pal||''))+'</div>'+
        /* NHÃN = TÊN CHƯƠNG TRÌNH HUẤN LUYỆN, không phải thể loại game.
           Trước 14/08/2026 chỗ này ghi "Giải đố" / "Đua tốc độ" / "Phản xạ" —
           ngôn ngữ của một sảnh game. Đổi sang tên chương trình là chính việc
           đổi vai của cả khu, và nó cũng GOM các game cùng kỹ năng lại với nhau
           mà không cần dựng tiêu đề nhóm (Phản xạ có 2 game).
           ⚠️ Tên lấy từ js/training.js — CHỖ DUY NHẤT giữ tên chương trình. */
          '<span class="tag prog">'+AstroQ.esc(AstroQTraining.icon(g.prog)+" "+
                                               AstroQTraining.name(g.prog, LANG))+'</span>'+
        '</div>'+
        cert+
        '<h3>'+L(g.name)+'</h3>'+
        '<p>'+L(g.desc)+'</p>'+
        skill+
        '<span class="cost"><img src="img/tt.png" alt="'+t("tt_name")+'" /><b>'+g.cost+'</b><span>'+t("per_run")+'</span></span>'+
        btn+
        '<div class="hud-line foot">'+
          '<span>DIFF: '+t("diff_"+g.diff).toUpperCase()+'</span><span>FEE: '+g.cost+'</span></div>'+
      '</article>';
    }).join("");
  }

  /* ================= Khởi chạy 1 trò chơi ================= */
  function launch(key, trigger){
    var g=null; for(var i=0;i<GAMES.length;i++){ if(GAMES[i].key===key) g=GAMES[i]; }
    if(!g) return;
    if(g.status!=="ready" || !g.file){
      /* Trò chưa dựng: mở MODAL nói rõ đang phát triển. ⚠️ Ba trò này khi ra mắt
         sẽ MIỄN PHÍ (docs/decisions/009 không xếp mini-game vào phần trả phí), nên
         modal của chúng KHÔNG có lời mời mua gì cả — xem `plan:null` ở js/locks.js. */
      if(window.AstroQLocks && AstroQLocks.open("game:"+key, trigger)) return;
      toast(t("soon_toast")); return;
    }
    // Phí Thiên thạch tím được trừ mỗi lượt bên trong game (kể cả khi chơi lại).
    if(Economy.getAsteroids() < g.cost){ openNeed(g.cost); return; }
    toast(t("start_toast"));
    setTimeout(function(){ window.location.href=g.file; }, 450);
  }

  /* ================= Modal "chưa đủ" ================= */
  function openNeed(cost){
    var tt = '<img class="tt-inline" src="img/tt.png" alt="tt"/>';
    var body = LANG==="en"
      ? 'You need <b>'+cost+' '+tt+'</b> to play but only have <b>'+Economy.getAsteroids()+' '+tt+'</b>.<br/>Visit the <b>Knowledge Station</b> and take a Quiz to earn more!'
      : 'Bạn cần <b>'+cost+' '+tt+'</b> để chơi nhưng chỉ có <b>'+Economy.getAsteroids()+' '+tt+'</b>.<br/>Hãy ghé <b>Trạm Tri Thức</b> làm Quiz để kiếm thêm nhé!';
    $("need-body").innerHTML = body;
    $("need").classList.add("show");
  }
  function closeNeed(){ $("need").classList.remove("show"); }

  /* ================= Toast ================= */
  var toast = AstroQ.makeToast("toast", 2600);

  /* ================= Ngôn ngữ ================= */
  function applyLang(lang){
    if(lang==="en"||lang==="vi") LANG=lang;
    document.documentElement.lang=LANG;
    document.title=t("title");
    AstroQ.applyTexts(t);
    AstroQ.markLangButtons(LANG);
    loadTraining();
    paintRecord();
    render();
    if($("need").classList.contains("show")) { /* giữ nguyên; sẽ cập nhật khi mở lại */ }
  }

  /* ================= Sự kiện ================= */
  $("games").addEventListener("click", function(e){
    var b=e.target.closest ? e.target.closest(".play-btn") : null;
    if(b) launch(b.getAttribute("data-key"), b);
  });
  $("back").addEventListener("click", function(){ window.location.href="dashboard.html"; });
  $("need-later").addEventListener("click", closeNeed);
  $("need-go").addEventListener("click", function(){ window.location.href="quiz.html"; });
  $("need").addEventListener("click", function(e){ if(e.target===$("need")) closeNeed(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeNeed(); });
  AstroQ.initLang(applyLang);

  /* ================= Khởi tạo ================= */
  /* Số dư đọc từ cache của economy.js. KHÔNG gọi server ở đây: trang này không
     nạp SDK Firebase (233 KB) nên không có phiên đăng nhập để gọi, và số thật đã
     được dashboard đồng bộ trước khi trẻ bấm vào Sảnh. */
  paintBalance();
  Economy.onAsteroidsChange(paintBalance);
  applyLang(LANG);

  /* Cache co the vua duoc ghi o tab khac (tre choi xong quay ve dashboard roi
     mo lai Sanh). Ve lai khi khoa do doi — dung khuon `storage` da dung cho
     astroq-lang o js/ui-common.js. */
  window.addEventListener('storage', function(e){
    if(e.key === 'astroq-training'){ loadTraining(); paintRecord(); render(); }
  });
})();
</script>
