<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Trang app chưa mở cửa (dự kiến 08/2026) — noindex để Google không đưa vào
     kết quả tìm kiếm khi thông điệp chính thức vẫn là "sắp ra mắt".
     follow = vẫn cho bot đi theo link. XOÁ dòng robots này khi app mở cửa,
     đồng thời bỏ noindex ở landing-app.html và bổ sung URL vào sitemap.xml. -->
<meta name="robots" content="noindex,follow" />
<title>AstroQ — Khu Huấn Luyện</title>

<link rel="stylesheet" href="css/fonts.css" />

<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/sticker-icons.css" />
<link rel="stylesheet" href="css/page-shell.css" />
<link rel="stylesheet" href="css/locks.css" />
<link rel="stylesheet" href="css/games.css" />
<script src="js/sticker-icons.js"></script>
<script src="js/ui-common.js"></script>
<script src="js/locks.js"></script>
</head>
<body>

<div class="nebula"></div>
<div class="starfield"></div>

<div class="wrap">
  <!-- ============ HEADER ============ -->
  <header class="hub-top">
    <button class="back-btn" id="back"><span>&lt;</span> <span data-i18n="back">Về Trung Tâm Điều Hướng</span></button>
    <span class="hub-tag">[ ARCADE_BAY ]</span>
    <div class="currency" data-i18n-title="tt_name" title="Thiên thạch tím">
      <span class="gem" id="gem"><img src="img/tt.png" data-i18n-alt="tt_name" alt="Thiên thạch tím" /></span>
      <span class="c-val" id="bal">0</span>
    </div>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="vi">VI</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <!-- ============ HERO ============ -->
  <section class="hero">
    <span class="eyebrow" data-i18n="eyebrow">Khu Huấn Luyện</span>
    <h1 data-i18n="title_h">Chọn một trò chơi để bắt đầu</h1>
    <p data-i18n="intro">Mỗi lượt chơi tiêu một ít Thiên thạch tím. Kiếm thêm ở Trạm Tri Thức nếu chưa đủ nhé!</p>
  </section>

  <!-- ============ GAME GRID (đổ từ JS) ============ -->
  <section class="games" id="games"></section>
</div>

<!-- MODAL: chưa đủ Thiên thạch tím -->
<div class="modal" id="need" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-ic">🪐</div>
    <h3 data-i18n="need_title">Chưa đủ Thiên thạch tím!</h3>
    <p id="need-body"></p>
    <div class="modal-actions">
      <button class="m-btn primary" id="need-go" data-i18n="need_go">Làm Quiz ngay</button>
      <button class="m-btn" id="need-later" data-i18n="need_later">Để sau</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="economy.js"></script>
<script>
(function(){
  "use strict";

  /* ================= i18n ================= */
  var I18N = {
    vi:{
      tt_name:"Thiên thạch tím",
      title:"AstroQ — Khu Huấn Luyện", back:"Về Trung Tâm Điều Hướng",
      eyebrow:"Khu Huấn Luyện", title_h:"Chọn một trò chơi để bắt đầu",
      intro:"Mỗi lượt chơi tiêu một ít Thiên thạch tím. Kiếm thêm ở Trạm Tri Thức nếu chưa đủ nhé!",
      per_run:"/ lượt", play:"Chơi ngay", soon:"Sắp ra mắt",
      diff_easy:"Dễ", diff_medium:"Vừa", diff_hard:"Khó",
      need_title:"Chưa đủ Thiên thạch tím!", need_go:"Làm Quiz ngay", need_later:"Để sau",
      when:"Xem trước",
      soon_toast:"🚧 Trò chơi này sắp ra mắt — luyện Quiz để tích Thiên thạch trước nhé!",
      start_toast:"🎮 Đang khởi động trò chơi…"
    },
    en:{
      tt_name:"Purple Meteor",
      title:"AstroQ — Training Simulator", back:"Back to Navigation Hub",
      eyebrow:"Training Simulator", title_h:"Pick a game to start",
      intro:"Each play costs a few Purple Meteors. Earn more at the Knowledge Station if you run low!",
      per_run:"/ play", play:"Play now", soon:"Coming soon",
      diff_easy:"Easy", diff_medium:"Medium", diff_hard:"Hard",
      need_title:"Not enough Purple Meteors!", need_go:"Do Quiz now", need_later:"Later",
      when:"Sneak peek",
      soon_toast:"🚧 This game is coming soon — practice quizzes to stock up on meteors!",
      start_toast:"🎮 Launching game…"
    }
  };
  var LANG = AstroQ.getLang();
  function t(k){ var d=I18N[LANG]||I18N.vi; return d[k]!=null?d[k]:k; }
  function L(o){ return LANG==="en" ? (o.en!=null?o.en:o.vi) : o.vi; }

  /* ================= Danh mục trò chơi (dữ liệu động) =================
     status: "ready" → tính phí + mở file; "soon" → hiện "Sắp ra mắt".
     Khi có game thật, đặt status:"ready" và file:"ten-game.html".
     `code` là số hiệu CỐ ĐỊNH ghi thẳng trong dữ liệu — trước đây nó sinh theo vị
     trí sau khi sort nên mỗi lần một game "soon" thành "ready" là số hiệu của cả
     dãy nhảy hết, trong khi số hiệu đã đi vào tài liệu và lời nói của người dùng
     ("ARCADE-04 = Ghép Chòm Sao"). Thêm game mới thì cấp số kế tiếp, không sửa số cũ. */
  var GAMES = [
    { key:"dodge", pal:"sic--cyan", code:"ARCADE-01", cls:"card--gravity", icon:"planet", cost:5, diff:"easy", status:"ready", file:"game-dodge.html",
      tag:{vi:"Bay ngang & né tránh", en:"Side-scroll & dodge"},
      name:{vi:"Né Thiên Thạch", en:"Asteroid Dodge"},
      desc:{vi:"Điều khiển Byte nhấp nháy bay ngang qua khe hẹp của vành đai thiên thạch và thu thập Thiên thạch tím trên đường bay!", en:"Blink Byte sideways through the narrow gaps of the asteroid belt and collect Purple Meteors along the way!"} },
    { key:"racer", pal:"sic--orange", code:"ARCADE-03", cls:"card--racer", icon:"comet", cost:5, diff:"medium", status:"ready", file:"game-racer.html",
      tag:{vi:"Đua tốc độ", en:"Racing"},
      name:{vi:"Đường Đua Sao Chổi", en:"Comet Racer"},
      desc:{vi:"Đổi làn để né thiên thạch, hứng thùng nhiên liệu và tinh thể tím — về đích 1.200 m trước khi cạn nhiên liệu!", en:"Switch lanes to dodge asteroids, grab fuel cans and purple crystals — finish the 1,200 m track before you run dry!"} },
    { key:"defender", pal:"sic--mag", code:"ARCADE-02", cls:"card--blaster", icon:"sat", cost:5, diff:"hard", status:"ready", file:"game-defender.html",
      tag:{vi:"Phòng thủ 360°", en:"360° defense"},
      name:{vi:"Phòng Thủ Không Gian", en:"Space Defender"},
      desc:{vi:"Xoay pháo Laser 360 độ bảo vệ Trạm Vũ Trụ nằm ở tâm khỏi đợt tấn công từ mọi hướng. Bắn thạch vàng mở Quiz sạc đạn!", en:"Spin your laser cannon a full 360° to shield the Space Station at the centre from attacks on every side. Shoot gold meteors to open a Quiz and recharge ammo!"} },
    { key:"match", pal:"sic--gold", code:"ARCADE-04", cls:"card--match", icon:"spark", cost:3, diff:"easy", status:"ready", file:"game-constellation.html",
      tag:{vi:"Giải đố", en:"Puzzle"},
      name:{vi:"Ghép Chòm Sao", en:"Constellation Match"},
      desc:{vi:"Nối các ngôi sao đúng thứ tự số để vẽ nên chòm sao thật trên trời — ghép xong sẽ mở ra một điều thú vị về nó!", en:"Link the stars in number order to draw a real constellation — finish it and unlock a fun fact about the night sky!"} },
    { key:"maze", pal:"sic--lime", code:"ARCADE-05", cls:"card--maze", icon:"maze", cost:4, diff:"medium", status:"ready", file:"game-maze.html",
      tag:{vi:"Giải đố", en:"Puzzle"},
      name:{vi:"Mê Cung Thiên Hà", en:"Galaxy Maze"},
      desc:{vi:"Dẫn phi hành gia qua mê cung sao: thu 5 tinh thể rồi tìm cổng sáng để ra. Mê cung mới mỗi lượt, và không có thua!", en:"Guide the astronaut through a star maze: collect 5 crystals, then find the glowing gate. A new maze every run — and no losing!"} },
    { key:"catch", pal:"sic--cyan", code:"ARCADE-06", cls:"card--catch", icon:"star", cost:3, diff:"easy", status:"ready", file:"game-catch.html",
      tag:{vi:"Phản xạ", en:"Reflex"},
      name:{vi:"Bắt Sao Băng", en:"Star Catcher"},
      desc:{vi:"Hứng sao băng vàng để lấy điểm, hứng sao tím để lấy Thiên thạch tím — và né sao chổi lửa. Bạn có 3 mạng!", en:"Catch gold shooting stars for points and purple ones for Purple Meteors — and dodge the fiery comets. You get 3 lives!"} }
  ];

  /* ================= Số dư ================= */
  function paintBalance(){ $("bal").textContent = Economy.getAsteroids(); }

  /* ================= Render thẻ trò chơi ================= */
  function render(){
    // Sắp xếp: game đã có (ready) trước, game sắp ra mắt (soon) sau
    var list = GAMES.slice().sort(function(a,b){ return (a.status==="ready"?0:1) - (b.status==="ready"?0:1); });
    $("games").innerHTML = list.map(function(g){
      var soon = g.status!=="ready";
      var code = g.code || "ARCADE-??";
      var status = soon ? '<span class="soon">'+t("soon")+'</span>' : '<span class="online">SYS.ONLINE</span>';
      var btn = soon
        /* Nhan nut khoa la mot cau hoi BAM DUOC — nut nay mo modal, nen nhan
           phai moi bam chu khong lap lai dung chu "Sap ra mat" ngay phia tren. */
        ? '<button class="play-btn locked" data-key="'+g.key+'">'+t("when")+'</button>'
        : '<button class="play-btn" data-key="'+g.key+'">'+t("play")+'</button>';
      /* Huy hieu khoa. Ba tro nay khi ra mat se MIEN PHI nen trang thai la
         `soon` (ho phach), khong bao gio la `pro`. */
      var lk = (soon && window.AstroQLocks) ? AstroQLocks.get("game:"+g.key) : null;
      var badge = lk
        ? '<span class="lk-badge '+lk.state+' lk-pin">'+
            AstroQ.esc(AstroQLocks.text(lk.state==="soon" ? "badge_soon" : "badge_pro"))+
          '</span>'
        : '';

      return '<article class="gcard '+g.cls+(soon?' soon':'')+'">'+
        '<div class="hud-line top"><span><span class="led"></span>'+code+'</span>'+status+'</div>'+
        badge+
        /* Bang mau theo TUNG game (`pal`), khong de tat ca roi ve tim mac dinh: sau
           the game cung mot mau doc ra don dieu voi tre — chu du an bat duoc dung
           chuyen do o dashboard 13/08/2026. Chua mo thi `sic--off` thang, vi luc do
           dieu can noi la "chua dung duoc", khong phai "khu nay mau gi". */
        '<div class="ic">'+sic(g.icon, soon ? 'sic--off' : (g.pal||''))+'</div>'+
        '<span class="tag">'+L(g.tag)+'</span>'+
        '<h3>'+L(g.name)+'</h3>'+
        '<p>'+L(g.desc)+'</p>'+
        '<span class="cost"><img src="img/tt.png" alt="'+t("tt_name")+'" /><b>'+g.cost+'</b><span>'+t("per_run")+'</span></span>'+
        btn+
        '<div class="hud-line foot">'+
          '<span>DIFF: '+t("diff_"+g.diff).toUpperCase()+'</span><span>FEE: '+g.cost+'</span></div>'+
      '</article>';
    }).join("");
  }

  /* ================= Khởi chạy 1 trò chơi ================= */
  function launch(key, trigger){
    var g=null; for(var i=0;i<GAMES.length;i++){ if(GAMES[i].key===key) g=GAMES[i]; }
    if(!g) return;
    if(g.status!=="ready" || !g.file){
      /* Trò chưa dựng: mở MODAL nói rõ đang phát triển. ⚠️ Ba trò này khi ra mắt
         sẽ MIỄN PHÍ (docs/decisions/009 không xếp mini-game vào phần trả phí), nên
         modal của chúng KHÔNG có lời mời mua gì cả — xem `plan:null` ở js/locks.js. */
      if(window.AstroQLocks && AstroQLocks.open("game:"+key, trigger)) return;
      toast(t("soon_toast")); return;
    }
    // Phí Thiên thạch tím được trừ mỗi lượt bên trong game (kể cả khi chơi lại).
    if(Economy.getAsteroids() < g.cost){ openNeed(g.cost); return; }
    toast(t("start_toast"));
    setTimeout(function(){ window.location.href=g.file; }, 450);
  }

  /* ================= Modal "chưa đủ" ================= */
  function openNeed(cost){
    var tt = '<img class="tt-inline" src="img/tt.png" alt="tt"/>';
    var body = LANG==="en"
      ? 'You need <b>'+cost+' '+tt+'</b> to play but only have <b>'+Economy.getAsteroids()+' '+tt+'</b>.<br/>Visit the <b>Knowledge Station</b> and take a Quiz to earn more!'
      : 'Bạn cần <b>'+cost+' '+tt+'</b> để chơi nhưng chỉ có <b>'+Economy.getAsteroids()+' '+tt+'</b>.<br/>Hãy ghé <b>Trạm Tri Thức</b> làm Quiz để kiếm thêm nhé!';
    $("need-body").innerHTML = body;
    $("need").classList.add("show");
  }
  function closeNeed(){ $("need").classList.remove("show"); }

  /* ================= Toast ================= */
  var toast = AstroQ.makeToast("toast", 2600);

  /* ================= Ngôn ngữ ================= */
  function applyLang(lang){
    if(lang==="en"||lang==="vi") LANG=lang;
    document.documentElement.lang=LANG;
    document.title=t("title");
    AstroQ.applyTexts(t);
    AstroQ.markLangButtons(LANG);
    render();
    if($("need").classList.contains("show")) { /* giữ nguyên; sẽ cập nhật khi mở lại */ }
  }

  /* ================= Sự kiện ================= */
  $("games").addEventListener("click", function(e){
    var b=e.target.closest ? e.target.closest(".play-btn") : null;
    if(b) launch(b.getAttribute("data-key"), b);
  });
  $("back").addEventListener("click", function(){ window.location.href="dashboard.html"; });
  $("need-later").addEventListener("click", closeNeed);
  $("need-go").addEventListener("click", function(){ window.location.href="quiz.html"; });
  $("need").addEventListener("click", function(e){ if(e.target===$("need")) closeNeed(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeNeed(); });
  AstroQ.initLang(applyLang);

  /* ================= Khởi tạo ================= */
  /* Số dư đọc từ cache của economy.js. KHÔNG gọi server ở đây: trang này không
     nạp SDK Firebase (233 KB) nên không có phiên đăng nhập để gọi, và số thật đã
     được dashboard đồng bộ trước khi trẻ bấm vào Sảnh. */
  paintBalance();
  Economy.onAsteroidsChange(paintBalance);
  applyLang(LANG);
})();
</script>
</body>
</html>
