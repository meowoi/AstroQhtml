
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Trang app chưa mở cửa (dự kiến 08/2026) — noindex để Google không đưa vào
     kết quả tìm kiếm khi thông điệp chính thức vẫn là "sắp ra mắt".
     follow = vẫn cho bot đi theo link. XOÁ dòng robots này khi app mở cửa,
     đồng thời bỏ noindex ở landing-app.html và bổ sung URL vào sitemap.xml. -->
<meta name="robots" content="noindex,follow" />
<title>AstroQ — Góc Khám Phá</title>

<link rel="stylesheet" href="css/fonts.css" />

<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/page-shell.css" />
<link rel="stylesheet" href="css/library.css" />
<script src="js/icons.js"></script>
<script src="js/ui-common.js"></script>
</head>
<body>
<div class="starfield"></div>

<div class="wrap">
  <!-- ============ TOPBAR ============ -->
  <!-- .hub-top = header dùng chung ở css/page-shell.css -->
  <header class="hub-top">
    <button class="back-btn" id="back"><span>&lt;</span> <span data-i18n="back">Về Trạm Tri Thức</span></button>
    <label class="search"><span id="ic-search"></span><input id="q" type="search" placeholder="Tìm bài viết…" data-i18n-ph="search_ph" /></label>
    <div class="srcfilter" id="srcfilter" role="group" data-i18n-aria="a_source" aria-label="Nguồn">
      <button data-src="all" class="active" data-i18n="src_all">Tất cả</button>
      <button data-src="NASA">NASA</button>
      <button data-src="ESA">ESA</button>
      <button data-src="AI & Tech" data-i18n="src_ai">AI &amp; Tech</button>
    </div>
    <div class="currency" data-i18n-title="tt_name" title="Thiên thạch tím"><span class="gem" id="gem"><img src="img/tt.png" alt="tt" /></span><span class="c-val" id="bal">0</span></div>
    <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="vi">VI</button><button type="button" data-lang="en">EN</button></div>
  </header>

  <!-- ============ 3-COLUMN LAYOUT ============ -->
  <div class="layout">
    <!-- LEFT SIDEBAR -->
    <aside class="side">
      <div class="side-card">
        <div class="side-title"><span id="ic-cat"></span>[ <span data-i18n="topics">CHỦ ĐỀ</span> ]</div>
        <div id="cats"></div>
      </div>
      <div class="side-card">
        <div class="side-title"><span id="ic-award"></span>[ <span data-i18n="progress">TIẾN ĐỘ</span> ]</div>
        <div class="stats">
          <div class="stat read"><span class="s-ic" id="ic-read"></span><span class="s-b"><span class="s-v" id="st-read">0</span><span class="s-l" data-i18n="st_read">Đã đọc (bài)</span></span></div>
          <div class="stat coll"><span class="s-ic" id="ic-total"></span><span class="s-b"><span class="s-v" id="st-coll">0</span><span class="s-l" data-i18n="st_coll">Tổng bài viết</span></span></div>
        </div>
      </div>
    </aside>

    <!-- CENTER FEED -->
    <main class="feed">
      <div id="hero-wrap"></div>
      <div class="feed-head"><span class="ft">[ DATA_FEED · <span data-i18n="articles">Bài viết</span> ]</span><span class="fc" id="feed-count"></span></div>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>

<!-- ============ READER MODAL ============ -->
<div class="modal" id="reader" role="dialog" aria-modal="true">
  <div class="reader">
    <button class="r-close" id="r-close" aria-label="Close">✕</button>
    <div class="r-hero" id="r-hero"><span class="em" id="r-em"></span><span class="badge r-badge" id="r-badge"></span></div>
    <div class="r-in">
      <h2 id="r-title"></h2>
      <div class="r-body" id="r-body"></div>
      <div class="mascot" id="r-mascot">
        <img id="r-mascot-img" src="img/b1.png" alt="" />
        <div class="m-body"><div class="m-who" id="r-mascot-who">BYTE</div><p id="r-mascot-text"></p></div>
      </div>
      <div class="credit"><span id="ic-ext"></span><span id="r-credit"></span><a id="r-link" target="_blank" rel="noopener"><span data-i18n="src_link">Nguồn</span> <span id="ic-ext2"></span></a></div>
      <div class="r-actions">
        <button class="r-claim" id="r-claim"></button>
        <button class="r-quiz" id="r-quiz">⚡ <span data-i18n="quiz_cta">LÀM QUIZ BÀI NÀY NẾU BẠN ĐÃ HIỂU</span> (+20 <img class="tt-inline" src="img/tt.png" alt="tt" />)</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Báo tiến độ lên server (Hồ sơ + Kho Thành Tích).
     CỐ Ý KHÔNG nạp js/firebase-auth.js ở đây: SDK Firebase nặng 233 KB. Không có
     phiên đăng nhập thì js/progress.js xếp việc vào hàng chờ trong localStorage,
     dashboard/profile sẽ tự gửi nốt. -->
<script src="js/articles-index.js"></script>
<script src="js/progress.js"></script>
<script src="economy.js"></script>
<script>
(function(){
  "use strict";
  var READ_SECS=5;   /* khoá `astroq-read` khai ở js/articles-index.js, không chép lại */

  /* ===== i18n ===== */
  var I18N={
    vi:{
      tt_name:"Thiên thạch tím",
      a_source:"Nguồn", title:"AstroQ — Góc Khám Phá", back:"Về Trạm Tri Thức", search_ph:"Tìm bài viết…",
      src_all:"Tất cả", src_ai:"AI & Tech", topics:"CHỦ ĐỀ", progress:"TIẾN ĐỘ",
      st_read:"Đã đọc (bài)", st_coll:"Tổng bài viết", articles:"Bài viết", all_topics:"Tất cả chủ đề",
      cat_astronomy:"Thiên văn", cat_ai:"AI", cat_quantum:"Lượng tử", cat_robot:"Robot", cat_it:"CNTT",
      featured:"Bài viết nổi bật", read_now:"Đọc Ngay", src_link:"Nguồn",
      reading:"Đang đọc…", claim:"Đánh dấu đã đọc", claimed:"✓ Đã đọc", read_badge:"Đã đọc",
      unread_badge:"Chưa đọc",
      quiz_cta:"LÀM QUIZ BÀI NÀY NẾU BẠN ĐÃ HIỂU", credit:"Nguồn dữ liệu",
      toast_claim:"Đã ghi vào hồ sơ · Kiến thức nạp đầy!", none:"Không tìm thấy bài viết phù hợp.",
      read_fail:"Không tải được nội dung bài này. Kiểm tra kết nối rồi thử lại nhé.",
      read_file:"Trang này đang được mở trực tiếp từ ổ đĩa (file://), và trình duyệt chặn việc tải nội dung bài theo cách đó — không phải do mạng. Hãy mở bằng một máy chủ: chạy <code>python -m http.server 8000</code> trong thư mục AstroQhtml rồi vào <code>http://localhost:8000/library.html</code>." },
    en:{
      tt_name:"Purple Meteor",
      a_source:"Source", title:"AstroQ — Discovery Corner", back:"Back to Knowledge Station", search_ph:"Search articles…",
      src_all:"All", src_ai:"AI & Tech", topics:"TOPICS", progress:"PROGRESS",
      st_read:"Read (articles)", st_coll:"Total articles", articles:"Articles", all_topics:"All topics",
      cat_astronomy:"Astronomy", cat_ai:"AI", cat_quantum:"Quantum", cat_robot:"Robots", cat_it:"IT",
      featured:"Featured articles", read_now:"Read Now", src_link:"Source",
      reading:"Reading…", claim:"Mark as read", claimed:"✓ Read", read_badge:"Read",
      unread_badge:"Unread",
      quiz_cta:"TAKE THE QUIZ IF YOU UNDERSTOOD IT", credit:"Data source",
      toast_claim:"Saved to your profile · Knowledge loaded!", none:"No matching articles found.",
      read_fail:"Could not load this article. Check your connection and try again.",
      read_file:"This page was opened straight from disk (file://), and the browser blocks loading article content that way — it is not a network problem. Serve it instead: run <code>python -m http.server 8000</code> in the AstroQhtml folder, then open <code>http://localhost:8000/library.html</code>." }
  };
  var LANG = AstroQ.getLang();
  function t(k){ var d=I18N[LANG]||I18N.vi; return d[k]!=null?d[k]:k; }
  function L(o){ return LANG==="en" ? (o.en!=null?o.en:o.vi) : o.vi; }


  var CAT_ICON={astronomy:"telescope", ai:"cpu", quantum:"atom", robot:"bot", it:"satellite"};

  /* ===== Dữ liệu bài viết (ảnh HD thật từ NASA + nội dung minh hoạ cho trẻ em) ===== */
  /* Bài đọc lấy từ `js/articles-index.js` — CHỖ DUY NHẤT khai báo, dùng chung với
     `learn.html`. Xem đầu file đó: hai mảng riêng trước đây gây HAI lỗi thật.
     Giữ tên `ARTICLES` để phần còn lại của trang không phải sửa một chữ nào. */
  var ARTICLES = AstroQArticles.all();

  /* ===== Đọc / thưởng / thống kê ===== */
  /* ⚠️ Ba hàm này ĐÃ CHUYỂN sang `js/articles-index.js`. Chúng phải giống hệt ở cả hai trang
     — không thì lỗi "đọc bên này bên kia không biết" quay lại. `isRead` ở đó còn hiểu
     cả id CŨ của bài đã gộp, nên lịch sử đọc của trẻ không bị mất. */
  var readSet = AstroQArticles.readSet, isRead = AstroQArticles.isRead,
      markRead = AstroQArticles.markRead;
  function libReadCount(){ var s=readSet(); return ARTICLES.filter(function(a){ return s.indexOf(a.id)>=0; }); }

  /* ===== Bài viết nổi bật: LUÔN ĐÚNG 4, chưa đọc lên trước =====
     ⚠️ Trước 04/08/2026 chỉ có MỘT bài nổi bật và nó ghim cứng bằng `hero:true`
     trên `lib-nebula` — nghĩa là trẻ đọc xong bài đó rồi thì mỗi lần mở trang vẫn
     thấy đúng nó chiếm chỗ đẹp nhất, còn 7 bài chưa đọc thì nằm dưới lưới.
     Nay: chọn 4 bài, ưu tiên bài CHƯA ĐỌC (giữ thứ tự khai báo), thiếu thì lấy
     thêm bài đã đọc cho đủ 4 — nên con số 4 không bao giờ hụt kể cả khi trẻ đã
     đọc hết. `FEATURED` tính MỘT LẦN lúc mở trang, cố ý: tính lại sau mỗi lần
     đánh dấu đã đọc thì bài vừa đọc biến khỏi khối nổi bật ngay dưới tay trẻ,
     và cả khối nhảy chỗ. Phiên đăng nhập sau mở lại trang là đã có thứ tự mới. */
  var FEAT_N = 4;
  var FEATURED = AstroQArticles.featured(FEAT_N);   /* luật chọn nằm ở js/articles-index.js */
  function isFeatured(id){
    for(var i=0;i<FEATURED.length;i++){ if(FEATURED[i].id===id) return true; }
    return false;
  }

  function paintBalance(){ $("bal").textContent=Economy.getAsteroids(); }
  /* ⚠️ Ô thứ hai TRƯỚC ĐÂY cộng tổng tt thưởng đọc bài. Đọc bài không thưởng nữa
     nên con số đó luôn là 0 — một ô thống kê luôn bằng 0 đọc ra thành "app hỏng".
     Đổi sang TỔNG SỐ BÀI để cặp số thành "đã đọc / tổng", có nghĩa với trẻ. */
  function paintStats(){ var read=libReadCount(); $("st-read").textContent=read.length;
    $("st-coll").textContent=ARTICLES.length; }

  /* ===== Filter state ===== */
  var fSearch="", fSrc="all", fCat="all";

  function imgboxHtml(a){
    var em='<span class="em">'+a.em+'</span>';
    var img = a.img ? '<img src="'+a.img+'" alt="" loading="lazy" onerror="this.style.display=\'none\'" />' : '';
    return '<div class="imgbox" style="--c1:'+a.c[0]+';--c2:'+a.c[1]+';--c3:'+a.c[2]+'">'+em+img+'</div>';
  }
  function badgeHtml(a){
    var cls = a.src==="NASA"?"nasa":(a.src==="ESA"?"esa":"ai");
    return '<span class="badge '+cls+'">🛰️ '+a.src+'</span>';
  }

  /* ===== Render khối nổi bật (1 thẻ lớn + 3 thẻ thường = 4) ===== */
  function renderFeatured(){
    var box=$("hero-wrap");
    /* Đang lọc / đang tìm thì ẨN khối nổi bật và cho lưới hiện MỌI kết quả khớp.
       Bản cũ luôn giữ bài `hero` ngoài lưới, nên tìm đúng tên bài đó lại ra
       "không tìm thấy bài viết phù hợp" — bài có thật mà máy bảo không có. */
    if(filterOn() || !FEATURED.length){ box.innerHTML=""; return; }
    var a=FEATURED[0], rest=FEATURED.slice(1);
    /* ⚠️ Đoạn mở đầu của THẺ LỚN là thứ DUY NHẤT ở lưới cần tới thân bài, nên nó tải
       riêng đúng một file (`load`), không phải cả kho. Cố ý KHÔNG nhét một trường
       `sum` vào mục lục: `sum` là bản sao thứ hai của đoạn mở đầu, sẽ lệch đúng vào
       ngày ai đó sửa thân bài mà quên chạy lại bộ sinh — và nó làm mục lục phình
       thêm ~17 KB thô cho một thứ chỉ MỘT thẻ dùng.
       ⚠️ Thẻ hiện NGAY, đoạn chữ điền sau; chưa về thì để trống chứ không hiện chữ
          giữ chỗ giả. */
    box.innerHTML =
      '<article class="feat" data-id="'+a.id+'">'+imgboxHtml(a)+
        '<div class="feat-body">'+badgeHtml(a)+
          '<div class="feat-eyebrow">'+t("featured")+'</div>'+
          '<h1>'+L(a.title)+'</h1>'+
          '<p id="feat-lead"></p>'+
          '<button class="read-btn">'+lic("book")+' '+t("read_now")+'</button>'+
        '</div>'+
      '</article>'+
      (rest.length ? '<div class="feat-row">'+rest.map(cardHtml).join("")+'</div>' : "");
    AstroQArticles.load(a.id).then(function(full){
      var p=$("feat-lead");
      if(!p || !full || !full.body) return;
      p.textContent = L({vi:full.body.vi[0], en:full.body.en[0]}).replace(/<[^>]+>/g,"");
    });
  }

  /* ===== Render grid ===== */
  /* ⚠️ TÌM KIẾM TOÀN VĂN VẪN GIỮ, nhưng thân bài nay tải trễ — nên `matches` dùng thân
     bài NẾU nó đã có trong bộ nhớ (`loaded`), còn không thì tìm theo tiêu đề. Cộng với
     `primeSearch()` gọi ngay khi trẻ CHẠM vào ô tìm (sớm hơn cú gõ đầu tiên), thực tế
     thân bài luôn về trước khi gõ xong.
     ⚠️ Cố ý KHÔNG chặn giao diện chờ `loadAll()`: ô tìm phải phản hồi ngay từ ký tự đầu.
        Thà một khoảnh khắc chỉ tìm theo tiêu đề rồi tự vẽ lại, hơn là ô tìm đứng im. */
  function matches(a){
    if(fSrc!=="all" && a.src!==fSrc) return false;
    if(fCat!=="all" && a.cat!==fCat) return false;
    if(fSearch){
      var full=AstroQArticles.loaded(a.id);
      var s=L(a.title);
      if(full && full.body) s+=" "+L({vi:full.body.vi.join(" "),en:full.body.en.join(" ")});
      if(s.toLowerCase().indexOf(fSearch)<0) return false;
    }
    return true;
  }
  var primed=false;
  function primeSearch(){
    if(primed) return; primed=true;
    AstroQArticles.loadAll().then(function(){ if(fSearch) render(); });
  }
  function filterOn(){ return !!fSearch || fSrc!=="all" || fCat!=="all"; }
  /* Thẻ dùng chung cho lưới VÀ cho 3 ô của khối nổi bật — một hàm, không chép hai
     bản: hai bản thì sớm muộn badge "đã đọc" ở hai nơi hiện khác nhau. */
  function cardHtml(a){
    var r=isRead(a.id)?'<span class="r done">'+lic("book")+' '+t("read_badge")+'</span>'
                      :'<span class="r">'+lic("book")+' '+t("unread_badge")+'</span>';
    return '<article class="card" data-id="'+a.id+'">'+imgboxHtml(a)+
      '<div class="cbody">'+badgeHtml(a)+'<h3>'+L(a.title)+'</h3>'+
        '<div class="foot">'+r+'<span class="cat-dot">'+t("cat_"+a.cat)+'</span></div>'+
      '</div></article>';
  }
  function render(){
    var hideFeat = filterOn();   // đang lọc → khối nổi bật ẩn, lưới hiện đủ
    var list=ARTICLES.filter(function(a){
      return (hideFeat || !isFeatured(a.id)) && matches(a);
    });
    var box=$("grid");
    if(!list.length){ box.innerHTML='<div class="empty">'+t("none")+'</div>'; $("feed-count").textContent="0"; return; }
    box.innerHTML=list.map(cardHtml).join("");
    $("feed-count").textContent=list.length;
  }

  /* ===== Sidebar categories ===== */
  function renderCats(){
    /* ⚠️ "it" (CNTT) thêm 11/08/2026. `cat` mới thì phải sửa BỐN chỗ cùng lúc: mảng
       này · CAT_ICON · khoá i18n `cat_it` ở CẢ vi và en · và rule `.cat--it` trong
       css/library.css. Thiếu một chỗ là chip hiện ra khoá thô hoặc không có màu. */
    var cats=["all","astronomy","ai","quantum","robot","it"];
    $("cats").innerHTML=cats.map(function(c){
      var ic = c==="all" ? "layers" : CAT_ICON[c];
      var nm = c==="all" ? t("all_topics") : t("cat_"+c);
      // ⚠️ CỐ Ý KHÔNG hiện số bài mỗi chủ đề (bỏ 09/08/2026). Kho bài còn mỏng
      //    (AI 1 bài, Robot 1 bài) nên con số đó nói với trẻ rằng "chỗ này gần như
      //    trống" ngay trước khi nó kịp bấm vào — đúng thứ ta không muốn nói lúc
      //    đang mời khám phá. Số bài KHỚP bộ lọc vẫn hiện ở `#feed-count` phía
      //    feed, tức thông tin không mất, chỉ thôi đứng ở chỗ mời gọi.
      return '<button class="cat cat--'+c+(fCat===c?' active':'')+'" data-cat="'+c+'">'+
        '<span class="c-ic">'+lic(ic)+'</span><span class="c-nm">'+nm+'</span></button>';
    }).join("");
  }

  /* ===== Reader ===== */
  /* ⚠️ `openId` đặt NGAY LẬP TỨC khi mở, còn `curArt` chỉ có khi thân bài đã về. Cần cả
     hai vì trẻ có thể đóng rồi mở bài khác trong lúc file đầu còn đang bay — không có
     `openId` thì thân bài của bài CŨ ghi vào trình đọc đang hiện bài MỚI. */
  var curArt=null, openId=null, rTimer=null, rLeft=0;
  /* ⚠️ KHÔNG ĐỒNG BỘ TỪ 09/08/2026 — thân bài nay nằm ở `js/article/<id>.js`, tải khi
     cần (lý do + số đo ở đầu `js/articles-index.js`).
     ⚠️ Mở ngay phần KHUNG (ảnh/nhãn/tiêu đề — toàn bộ nằm ở mục lục) rồi mới chờ thân
        bài, chứ KHÔNG chờ mạng xong mới hiện gì: bấm vào thẻ mà không có gì xảy ra
        trong nửa giây là trẻ tưởng bấm trượt — đúng lỗi `#loader` của explorer đã trả
        giá. Thân bài về sau thì điền vào.
     ⚠️ Tải hỏng thì NÓI THẬT (`read_fail`) chứ không để một trình đọc trống. */
  function openReader(id){
    var a=AstroQArticles.byId(id);
    if(!a) return;
    openId=id; curArt=null;
    var rh=$("r-hero"); rh.style.setProperty("--c1",a.c[0]); rh.style.setProperty("--c2",a.c[1]); rh.style.setProperty("--c3",a.c[2]);
    $("r-em").textContent=a.em;
    rh.querySelectorAll("img").forEach(function(x){x.remove();});
    if(a.img){ var im=document.createElement("img"); im.src=a.img; im.alt=""; im.onerror=function(){ this.remove(); }; rh.insertBefore(im, $("r-badge")); }
    $("r-badge").className="badge r-badge "+(a.src==="NASA"?"nasa":(a.src==="ESA"?"esa":"ai")); $("r-badge").textContent="🛰️ "+a.src;
    $("r-title").textContent=L(a.title);
    $("r-body").innerHTML="";
    $("reader").classList.add("show");
    AstroQArticles.load(id).then(function(full){ paintReader(id, full); });
  }
  /* Điền phần NẶNG khi thân bài về. Bỏ qua nếu trẻ đã đóng hoặc đã mở bài khác. */
  function paintReader(id, a){
    if(openId!==id || !$("reader").classList.contains("show")) return;
    /* ⚠️ NÓI ĐÚNG LÝ DO. Mở trang bằng `file://` thì trình duyệt chặn `import()` module
       (CORS, origin `null`) — mạng hoàn toàn không liên quan, nên câu "kiểm tra kết nối"
       là chỉ người đọc đi sửa một thứ không hỏng. Cùng nguyên tắc đã chốt cho ba lý do
       `sent:false` của email phụ huynh: gộp chúng thành một câu là nói sai 2/3 trường hợp. */
    if(!a){ $("r-body").innerHTML='<p class="empty">'+
              (AstroQArticles.needsServer()? t("read_file") : t("read_fail"))+"</p>";
      var m0=$("r-mascot"); if(m0) m0.hidden=true;
      $("r-credit").textContent=""; return; }
    curArt=a;
    $("r-body").innerHTML=L(a.body).map(function(p){return "<p>"+p+"</p>";}).join("");
    // mascot
    /* ⚠️ LỖI CÓ SẴN, SỬA 06/08/2026. Trước đây dòng này là `var who=a.term.who;`
       không có lớp bảo vệ nào — mà bài `jwst` (đang chạy thật từ đợt gộp 05/08)
       KHÔNG khai `term`. Hậu quả đo được: mở bài đó ở library.html thì `openReader`
       ném `Cannot read properties of undefined (reading 'who')` NGAY TRƯỚC dòng
       `classList.add("show")` — nên trình đọc **không bao giờ hiện ra**, trẻ bấm vào
       thẻ và không có gì xảy ra. Lỗi im lặng với người dùng, chỉ console mới thấy.
       Không bộ kiểm nào bắt được vì không bộ nào MỞ TỪNG BÀI.
       ⇒ Khối linh vật nay là PHẦN THÊM: bài nào có `term` thì hiện, không có thì ẩn. */
    var mas=$("r-mascot"), who=a.term&&a.term.who;
    if(a.term){
      if(mas) mas.hidden=false;
      $("r-mascot-img").src = who==="comet" ? "img/m1.png" : "img/b1.png";
      $("r-mascot-who").textContent = who==="comet" ? "COMET" : "BYTE";
      $("r-mascot-text").innerHTML = "<b>"+L(a.term.word)+":</b> "+L(a.term.text);
    } else if(mas){ mas.hidden=true; }
    // credit + link
    /* ⚠️ `credit` có thể là null (bài không ảnh — `jwst`, `lib-qubit`, và 5 bài Đợt 1).
       In thẳng ra thì dòng credit đọc là "Nguồn dữ liệu: null". Ghi công cho một bức
       ảnh không tồn tại còn tệ hơn không ghi gì. */
    /* ⚠️ Dấu " · " ngăn cách nay nằm TRONG chuỗi này chứ không phải text node trần
       trong markup. Để ngoài thì bài không có credit hiện ra " · Nguồn" — một dấu
       ngăn cách không ngăn cách gì. Text node trần thì không ẩn được bằng id. */
    $("r-credit").textContent = a.credit ? t("credit")+": "+a.credit+" · " : "";
    $("r-link").href=a.url;
    // claim
    var btn=$("r-claim"); clearInterval(rTimer);
    if(isRead(a.id)){ btn.className="r-claim done"; btn.disabled=true; btn.textContent=t("claimed"); }
    else{ btn.className="r-claim"; btn.disabled=true; rLeft=READ_SECS; btn.textContent=t("reading")+" ("+rLeft+"s)";
      rTimer=setInterval(function(){ rLeft--;
        if(rLeft<=0){ clearInterval(rTimer); btn.disabled=false; btn.textContent=t("claim"); }
        else btn.textContent=t("reading")+" ("+rLeft+"s)"; },1000); }
  }
  function closeReader(){ clearInterval(rTimer); openId=null; $("reader").classList.remove("show"); }
  function claim(){
    if(!curArt || isRead(curArt.id)) return;
    markRead(curArt.id);
    /* ĐỌC BÀI KHÔNG THƯỞNG THIÊN THẠCH TÍM (chốt 30/07/2026).
       ⚠️ ĐỪNG THÊM LẠI `Economy.addAsteroids(...)`. Ở đây nó còn sai nặng hơn
          `learn.html`: hai bài `lib-nebula` (15) và `lib-blackhole` (13) VƯỢT trần
          `Wallet.MaxPerLesson` cũ (12), nên ngay cả khi client có gửi số thưởng thì
          trẻ vẫn bị hụt so với con số nó vừa đọc trên nút. tt chỉ đến từ LÀM QUIZ
          ĐẠT (và thu trong mini-game); trần server giờ là 0.
       Vẫn ghi tiến độ — cùng khoá `astroq-read` với learn.html, server chống đếm
       trùng theo id bài. */
    if(window.AstroQProgress) AstroQProgress.lesson(curArt.id);
    toast(t("toast_claim"));
    var btn=$("r-claim"); btn.className="r-claim done"; btn.disabled=true; btn.textContent=t("claimed");
    renderFeatured(); render(); renderCats(); paintStats();
  }

  /* ===== Toast ===== */
  var toast = AstroQ.makeToast("toast", 2400);

  /* ===== Ngôn ngữ ===== */
  function applyLang(lang){
    if(lang==="en"||lang==="vi") LANG=lang;
    document.documentElement.lang=LANG; document.title=t("title");
    AstroQ.applyTexts(t);
    AstroQ.markLangButtons(LANG);
    $("ic-search").innerHTML=lic("search"); $("ic-cat").innerHTML=lic("layers"); $("ic-award").innerHTML=lic("award");
    $("ic-read").innerHTML=lic("book"); $("ic-total").innerHTML=lic("layers");
    $("ic-ext").innerHTML=lic("ext"); $("ic-ext2").innerHTML=lic("ext");
    renderFeatured(); render(); renderCats(); paintStats();
    if($("reader").classList.contains("show") && openId) openReader(openId);
  }

  /* ===== Sự kiện ===== */
  $("back").addEventListener("click", function(){ window.location.href="learn.html"; });
  /* ⚠️ MỖI CHỖ ĐỔI BỘ LỌC PHẢI GỌI CẢ `renderFeatured()`, không chỉ `render()`:
     khối nổi bật ẩn/hiện THEO bộ lọc, nên vẽ lại mỗi mình cái lưới thì lúc đang
     lọc trẻ vẫn thấy 4 thẻ nổi bật không liên quan nằm trên đầu kết quả — và tệ
     hơn, chúng lại trùng với chính mấy thẻ vừa hiện dưới lưới. */
  /* ⚠️ `focus` KÈM `pointerdown`: trên máy tính bảng thì `focus` tới muộn hơn hẳn cú
     chạm, mà đó chính là thiết bị chậm mạng nhất. Cả hai đều gọi `primeSearch` và
     nó có cờ chống gọi hai lần. */
  $("q").addEventListener("focus", primeSearch);
  $("q").addEventListener("pointerdown", primeSearch);
  $("q").addEventListener("input", function(e){ fSearch=(e.target.value||"").trim().toLowerCase();
    renderFeatured(); render(); });
  $("srcfilter").addEventListener("click", function(e){ var b=e.target.closest?e.target.closest("button"):null; if(!b) return;
    fSrc=b.getAttribute("data-src");
    $("srcfilter").querySelectorAll("button").forEach(function(x){ x.classList.toggle("active", x===b); });
    renderFeatured(); render(); });
  $("cats").addEventListener("click", function(e){ var b=e.target.closest?e.target.closest(".cat"):null; if(!b) return;
    fCat=b.getAttribute("data-cat"); renderCats(); renderFeatured(); render(); });
  /* Khối nổi bật chứa CẢ thẻ lớn `.feat` lẫn 3 thẻ `.card` — bắt cả hai, không
     thì 3 thẻ kia bấm không ăn (im lặng, trông như trang treo). */
  $("hero-wrap").addEventListener("click", function(e){ var h=e.target.closest?e.target.closest(".feat,.card"):null; if(h) openReader(h.getAttribute("data-id")); });
  $("grid").addEventListener("click", function(e){ var c=e.target.closest?e.target.closest(".card"):null; if(c) openReader(c.getAttribute("data-id")); });
  $("r-close").addEventListener("click", closeReader);
  $("r-claim").addEventListener("click", claim);
  $("r-quiz").addEventListener("click", function(){
    /* Gửi kèm `terms` của bài đang đọc → quiz.html rút đúng câu của bài đó.
       Bài không khai `terms` thì mở quiz thường, không chặn đường đi. */
    var t = curArt && curArt.terms && curArt.terms.length ? curArt.terms : null;
    window.location.href = t ? "quiz.html?terms="+encodeURIComponent(t.join(","))
                             : "quiz.html";
  });
  $("reader").addEventListener("click", function(e){ if(e.target===$("reader")) closeReader(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeReader(); });
  AstroQ.initLang(applyLang);

  /* ===== Khởi tạo ===== */
  paintBalance();
  Economy.onAsteroidsChange(paintBalance);
  applyLang(LANG);
})();
</script>
</body>
</html>
