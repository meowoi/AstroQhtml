
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Trang app chưa mở cửa (dự kiến 08/2026) — noindex để Google không đưa vào
     kết quả tìm kiếm khi thông điệp chính thức vẫn là "sắp ra mắt".
     follow = vẫn cho bot đi theo link. XOÁ dòng robots này khi app mở cửa,
     đồng thời bỏ noindex ở landing-app.html và bổ sung URL vào sitemap.xml. -->
<meta name="robots" content="noindex,follow" />
<title>AstroQ — Thư Viện Khám Phá</title>

<link rel="stylesheet" href="css/fonts.css" />

<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/page-shell.css" />
<link rel="stylesheet" href="css/library.css" />
<script src="js/icons.js"></script>
<script src="js/ui-common.js"></script>
</head>
<body>
<div class="starfield"></div>

<div class="wrap">
  <!-- ============ TOPBAR ============ -->
  <!-- .hub-top = header dùng chung ở css/page-shell.css -->
  <header class="hub-top">
    <button class="back-btn" id="back"><span>&lt;</span> <span data-i18n="back">Về Trạm Tri Thức</span></button>
    <label class="search"><span id="ic-search"></span><input id="q" type="search" placeholder="Tìm bài viết…" data-i18n-ph="search_ph" /></label>
    <div class="srcfilter" id="srcfilter" role="group" data-i18n-aria="a_source" aria-label="Nguồn">
      <button data-src="all" class="active" data-i18n="src_all">Tất cả</button>
      <button data-src="NASA">NASA</button>
      <button data-src="ESA">ESA</button>
      <button data-src="AI & Tech" data-i18n="src_ai">AI &amp; Tech</button>
    </div>
    <div class="currency" data-i18n-title="tt_name" title="Thiên thạch tím"><span class="gem" id="gem"><img src="img/tt.png" alt="tt" /></span><span class="c-val" id="bal">0</span></div>
    <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="vi">VI</button><button type="button" data-lang="en">EN</button></div>
  </header>

  <!-- ============ 3-COLUMN LAYOUT ============ -->
  <div class="layout">
    <!-- LEFT SIDEBAR -->
    <aside class="side">
      <div class="side-card">
        <div class="side-title"><span id="ic-cat"></span>[ <span data-i18n="topics">CHỦ ĐỀ</span> ]</div>
        <div id="cats"></div>
      </div>
      <div class="side-card">
        <div class="side-title"><span id="ic-award"></span>[ <span data-i18n="progress">TIẾN ĐỘ</span> ]</div>
        <div class="stats">
          <div class="stat read"><span class="s-ic" id="ic-read"></span><span class="s-b"><span class="s-v" id="st-read">0</span><span class="s-l" data-i18n="st_read">Đã đọc (bài)</span></span></div>
          <div class="stat coll"><span class="s-ic" id="ic-total"></span><span class="s-b"><span class="s-v" id="st-coll">0</span><span class="s-l" data-i18n="st_coll">Tổng bài viết</span></span></div>
        </div>
      </div>
    </aside>

    <!-- CENTER FEED -->
    <main class="feed">
      <div id="hero-wrap"></div>
      <div class="feed-head"><span class="ft">[ DATA_FEED · <span data-i18n="articles">Bài viết</span> ]</span><span class="fc" id="feed-count"></span></div>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>

<!-- ============ READER MODAL ============ -->
<div class="modal" id="reader" role="dialog" aria-modal="true">
  <div class="reader">
    <button class="r-close" id="r-close" aria-label="Close">✕</button>
    <div class="r-hero" id="r-hero"><span class="em" id="r-em"></span><span class="badge r-badge" id="r-badge"></span></div>
    <div class="r-in">
      <h2 id="r-title"></h2>
      <div class="r-body" id="r-body"></div>
      <div class="mascot" id="r-mascot">
        <img id="r-mascot-img" src="img/b1.png" alt="" />
        <div class="m-body"><div class="m-who" id="r-mascot-who">BYTE</div><p id="r-mascot-text"></p></div>
      </div>
      <div class="credit"><span id="ic-ext"></span><span id="r-credit"></span> · <a id="r-link" target="_blank" rel="noopener"><span data-i18n="src_link">Nguồn</span> <span id="ic-ext2"></span></a></div>
      <div class="r-actions">
        <button class="r-claim" id="r-claim"></button>
        <button class="r-quiz" id="r-quiz">⚡ <span data-i18n="quiz_cta">LÀM QUIZ BÀI NÀY NẾU BẠN ĐÃ HIỂU</span> (+20 <img class="tt-inline" src="img/tt.png" alt="tt" />)</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Báo tiến độ lên server (Hồ sơ + Kho Thành Tích).
     CỐ Ý KHÔNG nạp js/firebase-auth.js ở đây: SDK Firebase nặng 233 KB. Không có
     phiên đăng nhập thì js/progress.js xếp việc vào hàng chờ trong localStorage,
     dashboard/profile sẽ tự gửi nốt. -->
<script src="js/progress.js"></script>
<script src="economy.js"></script>
<script>
(function(){
  "use strict";
  var READ_KEY="astroq-read", READ_SECS=5;

  /* ===== i18n ===== */
  var I18N={
    vi:{
      tt_name:"Thiên thạch tím",
      a_source:"Nguồn", title:"AstroQ — Thư Viện Khám Phá", back:"Về Trạm Tri Thức", search_ph:"Tìm bài viết…",
      src_all:"Tất cả", src_ai:"AI & Tech", topics:"CHỦ ĐỀ", progress:"TIẾN ĐỘ",
      st_read:"Đã đọc (bài)", st_coll:"Tổng bài viết", articles:"Bài viết", all_topics:"Tất cả chủ đề",
      cat_astronomy:"Thiên văn", cat_ai:"AI", cat_quantum:"Lượng tử", cat_robot:"Robot",
      featured:"Bài viết nổi bật", read_now:"Đọc Ngay", src_link:"Nguồn",
      reading:"Đang đọc…", claim:"Đánh dấu đã đọc", claimed:"✓ Đã đọc", read_badge:"Đã đọc",
      unread_badge:"Chưa đọc",
      quiz_cta:"LÀM QUIZ BÀI NÀY NẾU BẠN ĐÃ HIỂU", credit:"Nguồn dữ liệu",
      toast_claim:"Đã ghi vào hồ sơ · Kiến thức nạp đầy!", none:"Không tìm thấy bài viết phù hợp." },
    en:{
      tt_name:"Purple Meteor",
      a_source:"Source", title:"AstroQ — Discovery Library", back:"Back to Knowledge Station", search_ph:"Search articles…",
      src_all:"All", src_ai:"AI & Tech", topics:"TOPICS", progress:"PROGRESS",
      st_read:"Read (articles)", st_coll:"Total articles", articles:"Articles", all_topics:"All topics",
      cat_astronomy:"Astronomy", cat_ai:"AI", cat_quantum:"Quantum", cat_robot:"Robots",
      featured:"Featured article", read_now:"Read Now", src_link:"Source",
      reading:"Reading…", claim:"Mark as read", claimed:"✓ Read", read_badge:"Read",
      unread_badge:"Unread",
      quiz_cta:"TAKE THE QUIZ IF YOU UNDERSTOOD IT", credit:"Data source",
      toast_claim:"Saved to your profile · Knowledge loaded!", none:"No matching articles found." }
  };
  var LANG = AstroQ.getLang();
  function t(k){ var d=I18N[LANG]||I18N.vi; return d[k]!=null?d[k]:k; }
  function L(o){ return LANG==="en" ? (o.en!=null?o.en:o.vi) : o.vi; }


  var CAT_ICON={astronomy:"telescope", ai:"cpu", quantum:"atom", robot:"bot"};

  /* ===== Dữ liệu bài viết (ảnh HD thật từ NASA + nội dung minh hoạ cho trẻ em) ===== */
  var IMG="https://images-assets.nasa.gov/image/";
  var ARTICLES=[
    { id:"lib-nebula", hero:true, src:"NASA", cat:"astronomy", em:"🌌", c:["#8ee0ff","#2f6fd0","#0e2a5e"],
      img:IMG+"PIA25433/PIA25433~large.jpg", credit:"NASA / JPL-Caltech", url:"https://science.nasa.gov/mission/webb/",
      title:{vi:"Tinh vân Đại Bàng — vườn ươm của các ngôi sao",en:"The Eagle Nebula — a nursery of stars"},
      body:{vi:["Trong vũ trụ có những đám mây khí và bụi khổng lồ gọi là <b>tinh vân</b>. Bên trong chúng, khí co lại và nóng dần lên cho tới khi bùng cháy thành những ngôi sao mới.",
                "Tinh vân Đại Bàng nổi tiếng với 'Những Cột Trụ Sáng Tạo' — các cột khí cao hàng nghìn tỉ km, nơi hàng loạt ngôi sao đang chào đời."],
            en:["Space has giant clouds of gas and dust called <b>nebulae</b>. Inside them, gas squeezes together and heats up until it lights up as new stars.",
                "The Eagle Nebula is famous for the 'Pillars of Creation' — towers of gas trillions of km tall where many stars are being born."]},
      term:{who:"comet", word:{vi:"Tinh vân",en:"Nebula"}, text:{vi:"<b>Tinh vân</b> là 'đám mây' khổng lồ bằng khí và bụi trong vũ trụ — chính là nơi các ngôi sao ra đời đó! 🐱",en:"A <b>nebula</b> is a giant 'cloud' of gas and dust in space — it's where stars are born! 🐱"}} },

    { id:"lib-andromeda", src:"NASA", cat:"astronomy", em:"🌀", c:["#c6d8ff","#5a78c8","#20305e"],
      img:IMG+"PIA04921/PIA04921~large.jpg", credit:"NASA / JPL-Caltech", url:"https://science.nasa.gov/",
      title:{vi:"Thiên hà Tiên Nữ — người hàng xóm khổng lồ",en:"The Andromeda Galaxy — our giant neighbour"},
      body:{vi:["<b>Thiên hà</b> là một tập hợp khổng lồ gồm hàng trăm tỉ ngôi sao. Trái Đất của chúng ta nằm trong thiên hà Dải Ngân Hà.",
                "Tiên Nữ (Andromeda) là thiên hà lớn gần chúng ta nhất, cách khoảng 2,5 triệu năm ánh sáng — và đang tiến lại gần Dải Ngân Hà!"],
            en:["A <b>galaxy</b> is a huge collection of hundreds of billions of stars. Our Earth lives in the Milky Way galaxy.",
                "Andromeda is the nearest big galaxy to us, about 2.5 million light-years away — and it's slowly heading toward the Milky Way!"]},
      term:{who:"byte", word:{vi:"Năm ánh sáng",en:"Light-year"}, text:{vi:"<b>Năm ánh sáng</b> là quãng đường ánh sáng đi trong 1 năm — cực kỳ xa nhé! 🤖",en:"A <b>light-year</b> is how far light travels in one year — incredibly far! 🤖"}} },

    { id:"lib-mars", src:"NASA", cat:"robot", em:"🔴", c:["#ffcaa8","#d1642f","#5e2410"],
      img:IMG+"PIA21496/PIA21496~medium.jpg", credit:"NASA / JPL-Caltech", url:"https://mars.nasa.gov/",
      title:{vi:"Robot Perseverance khám phá Sao Hỏa",en:"Perseverance rover exploring Mars"},
      body:{vi:["<b>Xe tự hành</b> (rover) là robot 6 bánh do NASA gửi lên Sao Hỏa. Nó tự lái, chụp ảnh và thu thập mẫu đá.",
                "Perseverance đang tìm dấu vết của sự sống cổ đại và thử tạo khí oxy từ bầu khí quyển Sao Hỏa để giúp con người sau này."],
            en:["A <b>rover</b> is a six-wheeled robot NASA sends to Mars. It drives itself, takes photos and collects rock samples.",
                "Perseverance is looking for signs of ancient life and even makes oxygen from Mars' air to help future explorers."]},
      term:{who:"byte", word:{vi:"Xe tự hành",en:"Rover"}, text:{vi:"<b>Rover</b> là robot biết tự lái trên hành tinh khác — giống anh em họ của tớ! 🤖",en:"A <b>rover</b> is a robot that drives itself on another planet — like my cousin! 🤖"}} },

    { id:"lib-blackhole", src:"NASA", cat:"quantum", em:"🕳️", c:["#ffe1a8","#f2a53c","#3a2410"],
      img:IMG+"PIA23122/PIA23122~medium.jpg", credit:"NASA / JPL-Caltech", url:"https://science.nasa.gov/universe/black-holes/",
      title:{vi:"Hố đen khổng lồ ở thiên hà M87",en:"The giant black hole in galaxy M87"},
      body:{vi:["<b>Hố đen</b> là nơi có lực hấp dẫn mạnh đến mức ngay cả ánh sáng cũng không thoát ra được.",
                "Ở trung tâm thiên hà M87 có một hố đen nặng gấp hàng tỉ lần Mặt Trời. Năm 2019, con người lần đầu chụp được 'bóng' của nó."],
            en:["A <b>black hole</b> is a place where gravity is so strong that not even light can escape.",
                "At the center of galaxy M87 sits a black hole billions of times heavier than the Sun. In 2019 humans first photographed its 'shadow'."]},
      term:{who:"comet", word:{vi:"Hấp dẫn",en:"Gravity"}, text:{vi:"<b>Hấp dẫn</b> là lực kéo mọi vật lại gần nhau — hố đen kéo mạnh đến mức giữ luôn cả ánh sáng! 🐱",en:"<b>Gravity</b> is the pull that draws things together — a black hole pulls so hard it even traps light! 🐱"}} },

    { id:"lib-exoplanet", src:"AI & Tech", cat:"ai", em:"🪐", c:["#e6c6ff","#a06be0","#3a1f6e"],
      img:IMG+"PIA22082/PIA22082~orig.jpg", credit:"NASA / JPL-Caltech", url:"https://science.nasa.gov/exoplanets/",
      title:{vi:"AI giúp tìm hành tinh ngoài Hệ Mặt Trời",en:"AI helps find planets beyond the Solar System"},
      body:{vi:["<b>Ngoại hành tinh</b> là những hành tinh quay quanh một ngôi sao khác, không phải Mặt Trời của chúng ta.",
                "Máy tính dùng <b>trí tuệ nhân tạo</b> để soi hàng triệu ngôi sao, nhận ra lúc ánh sáng chớp mờ đi — dấu hiệu có hành tinh đi ngang qua."],
            en:["<b>Exoplanets</b> are planets orbiting other stars, not our Sun.",
                "Computers use <b>artificial intelligence</b> to scan millions of stars and spot tiny dips in brightness — a sign a planet passed in front."]},
      term:{who:"byte", word:{vi:"Trí tuệ nhân tạo",en:"Artificial Intelligence"}, text:{vi:"<b>AI</b> giúp máy tính học từ ví dụ để tự nhận ra quy luật — như cách tớ học vậy! 🤖",en:"<b>AI</b> lets computers learn from examples to spot patterns by themselves — just like me! 🤖"}} },

    { id:"lib-saturn", src:"NASA", cat:"astronomy", em:"🪐", c:["#ffe6b0","#d9a441","#5e3f14"],
      img:IMG+"PIA22766/PIA22766~orig.jpg", credit:"NASA / JPL-Caltech", url:"https://science.nasa.gov/saturn/",
      title:{vi:"Tàu Cassini và vành đai Sao Thổ",en:"Cassini and Saturn's rings"},
      body:{vi:["Sao Thổ nổi tiếng với những <b>vành đai</b> tuyệt đẹp làm từ hàng tỉ mảnh băng và đá, từ nhỏ như hạt cát đến to như ngôi nhà.",
                "Tàu Cassini đã bay quanh Sao Thổ suốt 13 năm, gửi về vô số hình ảnh và khám phá về hành tinh này cùng các mặt trăng của nó."],
            en:["Saturn is famous for its beautiful <b>rings</b> made of billions of pieces of ice and rock, from grains of sand to house-sized chunks.",
                "The Cassini spacecraft orbited Saturn for 13 years, sending back countless images and discoveries about the planet and its moons."]},
      term:{who:"comet", word:{vi:"Vành đai",en:"Rings"}, text:{vi:"<b>Vành đai</b> Sao Thổ không phải một khối liền — nó là hàng tỉ viên băng bay quanh cùng nhau! 🐱",en:"Saturn's <b>rings</b> aren't solid — they're billions of ice chunks orbiting together! 🐱"}} },

    { id:"lib-gaia", src:"ESA", cat:"astronomy", em:"🛰️", c:["#b6f5cf","#3fd6a0","#12503a"],
      img:"", credit:"ESA / Gaia / DPAC", url:"https://www.esa.int/Science_Exploration/Space_Science/Gaia",
      title:{vi:"Tàu Gaia của ESA vẽ bản đồ 3D Ngân Hà",en:"ESA's Gaia maps the Milky Way in 3D"},
      body:{vi:["<b>ESA</b> là Cơ quan Vũ trụ châu Âu. Tàu Gaia của họ đo vị trí và chuyển động của gần 2 tỉ ngôi sao.",
                "Nhờ đó, các nhà khoa học dựng nên tấm <b>bản đồ sao</b> ba chiều chi tiết nhất về thiên hà của chúng ta."],
            en:["<b>ESA</b> is the European Space Agency. Its Gaia spacecraft measures the position and motion of nearly 2 billion stars.",
                "From this, scientists build the most detailed 3D <b>star map</b> of our galaxy ever made."]},
      term:{who:"byte", word:{vi:"Bản đồ sao",en:"Star map"}, text:{vi:"<b>Bản đồ sao</b> cho biết mỗi ngôi sao ở đâu và đi hướng nào — như bản đồ đường phố nhưng cho cả thiên hà! 🤖",en:"A <b>star map</b> shows where each star is and where it's heading — like a street map for the whole galaxy! 🤖"}} },

    { id:"lib-qubit", src:"AI & Tech", cat:"quantum", em:"⚛️", c:["#c6ffe6","#4ade80","#155e40"],
      img:"", credit:"MIT / IBM Research", url:"https://www.ibm.com/quantum",
      title:{vi:"Máy tính lượng tử là gì?",en:"What is a quantum computer?"},
      body:{vi:["Máy tính thường dùng các bit chỉ mang giá trị 0 hoặc 1. Máy tính lượng tử dùng <b>qubit</b>, có thể mang cả 0 và 1 cùng lúc.",
                "Nhờ vậy, máy tính lượng tử có thể thử rất nhiều lời giải một lúc, giúp giải những bài toán mà máy tính thường mất hàng nghìn năm."],
            en:["Normal computers use bits that are only 0 or 1. Quantum computers use <b>qubits</b>, which can be both 0 and 1 at the same time.",
                "This lets quantum computers try many answers at once, solving problems that would take normal computers thousands of years."]},
      term:{who:"byte", word:{vi:"Qubit",en:"Qubit"}, text:{vi:"<b>Qubit</b> giống một đồng xu đang xoay tít — vừa là mặt ngửa vừa là mặt sấp cho tới khi bạn nhìn! 🤖",en:"A <b>qubit</b> is like a spinning coin — both heads and tails until you look! 🤖"}} }
  ];

  /* ===== Đọc / thưởng / thống kê ===== */
  function readSet(){ try{ return JSON.parse(localStorage.getItem(READ_KEY)||"[]"); }catch(e){ return []; } }
  function isRead(id){ return readSet().indexOf(id)>=0; }
  function markRead(id){ var s=readSet(); if(s.indexOf(id)<0){ s.push(id); try{ localStorage.setItem(READ_KEY,JSON.stringify(s)); }catch(e){} } }
  function libReadCount(){ var s=readSet(); return ARTICLES.filter(function(a){ return s.indexOf(a.id)>=0; }); }

  function paintBalance(){ $("bal").textContent=Economy.getAsteroids(); }
  /* ⚠️ Ô thứ hai TRƯỚC ĐÂY cộng tổng tt thưởng đọc bài. Đọc bài không thưởng nữa
     nên con số đó luôn là 0 — một ô thống kê luôn bằng 0 đọc ra thành "app hỏng".
     Đổi sang TỔNG SỐ BÀI để cặp số thành "đã đọc / tổng", có nghĩa với trẻ. */
  function paintStats(){ var read=libReadCount(); $("st-read").textContent=read.length;
    $("st-coll").textContent=ARTICLES.length; }

  /* ===== Filter state ===== */
  var fSearch="", fSrc="all", fCat="all";

  function imgboxHtml(a){
    var em='<span class="em">'+a.em+'</span>';
    var img = a.img ? '<img src="'+a.img+'" alt="" loading="lazy" onerror="this.style.display=\'none\'" />' : '';
    return '<div class="imgbox" style="--c1:'+a.c[0]+';--c2:'+a.c[1]+';--c3:'+a.c[2]+'">'+em+img+'</div>';
  }
  function badgeHtml(a){
    var cls = a.src==="NASA"?"nasa":(a.src==="ESA"?"esa":"ai");
    return '<span class="badge '+cls+'">🛰️ '+a.src+'</span>';
  }

  /* ===== Render hero ===== */
  function renderHero(){
    var a=ARTICLES.filter(function(x){return x.hero;})[0]; if(!a) return;
    var read=isRead(a.id);
    $("hero-wrap").innerHTML =
      '<article class="feat" data-id="'+a.id+'">'+imgboxHtml(a)+
        '<div class="feat-body">'+badgeHtml(a)+
          '<div class="feat-eyebrow">'+t("featured")+'</div>'+
          '<h1>'+L(a.title)+'</h1>'+
          '<p>'+L({vi:a.body.vi[0].replace(/<[^>]+>/g,""),en:a.body.en[0].replace(/<[^>]+>/g,"")})+'</p>'+
          '<button class="read-btn">'+lic("book")+' '+t("read_now")+'</button>'+
        '</div>'+
      '</article>';
  }

  /* ===== Render grid ===== */
  function matches(a){
    if(fSrc!=="all" && a.src!==fSrc) return false;
    if(fCat!=="all" && a.cat!==fCat) return false;
    if(fSearch){ var s=(L(a.title)+" "+L({vi:a.body.vi.join(" "),en:a.body.en.join(" ")})).toLowerCase();
      if(s.indexOf(fSearch)<0) return false; }
    return true;
  }
  function render(){
    var list=ARTICLES.filter(function(a){ return !a.hero && matches(a); });
    var box=$("grid");
    if(!list.length){ box.innerHTML='<div class="empty">'+t("none")+'</div>'; $("feed-count").textContent="0"; return; }
    box.innerHTML=list.map(function(a){
      var read=isRead(a.id);
      var r=read?'<span class="r done">'+lic("book")+' '+t("read_badge")+'</span>'
                :'<span class="r">'+lic("book")+' '+t("unread_badge")+'</span>';
      return '<article class="card" data-id="'+a.id+'">'+imgboxHtml(a)+
        '<div class="cbody">'+badgeHtml(a)+'<h3>'+L(a.title)+'</h3>'+
          '<div class="foot">'+r+'<span class="cat-dot">'+t("cat_"+a.cat)+'</span></div>'+
        '</div></article>';
    }).join("");
    $("feed-count").textContent=list.length;
  }

  /* ===== Sidebar categories ===== */
  function renderCats(){
    var cats=["all","astronomy","ai","quantum","robot"];
    $("cats").innerHTML=cats.map(function(c){
      var n = c==="all" ? ARTICLES.length : ARTICLES.filter(function(a){return a.cat===c;}).length;
      var ic = c==="all" ? "layers" : CAT_ICON[c];
      var nm = c==="all" ? t("all_topics") : t("cat_"+c);
      return '<button class="cat cat--'+c+(fCat===c?' active':'')+'" data-cat="'+c+'">'+
        '<span class="c-ic">'+lic(ic)+'</span><span class="c-nm">'+nm+'</span><span class="c-n">'+n+'</span></button>';
    }).join("");
  }

  /* ===== Reader ===== */
  var curArt=null, rTimer=null, rLeft=0;
  function openReader(id){
    var a=null; for(var i=0;i<ARTICLES.length;i++){ if(ARTICLES[i].id===id) a=ARTICLES[i]; }
    if(!a) return; curArt=a;
    var rh=$("r-hero"); rh.style.setProperty("--c1",a.c[0]); rh.style.setProperty("--c2",a.c[1]); rh.style.setProperty("--c3",a.c[2]);
    $("r-em").textContent=a.em;
    rh.querySelectorAll("img").forEach(function(x){x.remove();});
    if(a.img){ var im=document.createElement("img"); im.src=a.img; im.alt=""; im.onerror=function(){ this.remove(); }; rh.insertBefore(im, $("r-badge")); }
    $("r-badge").className="badge r-badge "+(a.src==="NASA"?"nasa":(a.src==="ESA"?"esa":"ai")); $("r-badge").textContent="🛰️ "+a.src;
    $("r-title").textContent=L(a.title);
    $("r-body").innerHTML=L(a.body).map(function(p){return "<p>"+p+"</p>";}).join("");
    // mascot
    var who=a.term.who;
    $("r-mascot-img").src = who==="comet" ? "img/m1.png" : "img/b1.png";
    $("r-mascot-who").textContent = who==="comet" ? "COMET" : "BYTE";
    $("r-mascot-text").innerHTML = "<b>"+L(a.term.word)+":</b> "+L(a.term.text);
    // credit + link
    $("r-credit").textContent = t("credit")+": "+a.credit;
    $("r-link").href=a.url;
    // claim
    var btn=$("r-claim"); clearInterval(rTimer);
    if(isRead(a.id)){ btn.className="r-claim done"; btn.disabled=true; btn.textContent=t("claimed"); }
    else{ btn.className="r-claim"; btn.disabled=true; rLeft=READ_SECS; btn.textContent=t("reading")+" ("+rLeft+"s)";
      rTimer=setInterval(function(){ rLeft--;
        if(rLeft<=0){ clearInterval(rTimer); btn.disabled=false; btn.textContent=t("claim"); }
        else btn.textContent=t("reading")+" ("+rLeft+"s)"; },1000); }
    $("reader").classList.add("show");
  }
  function closeReader(){ clearInterval(rTimer); $("reader").classList.remove("show"); }
  function claim(){
    if(!curArt || isRead(curArt.id)) return;
    markRead(curArt.id);
    /* ĐỌC BÀI KHÔNG THƯỞNG THIÊN THẠCH TÍM (chốt 30/07/2026).
       ⚠️ ĐỪNG THÊM LẠI `Economy.addAsteroids(...)`. Ở đây nó còn sai nặng hơn
          `learn.html`: hai bài `lib-nebula` (15) và `lib-blackhole` (13) VƯỢT trần
          `Wallet.MaxPerLesson` cũ (12), nên ngay cả khi client có gửi số thưởng thì
          trẻ vẫn bị hụt so với con số nó vừa đọc trên nút. tt chỉ đến từ LÀM QUIZ
          ĐẠT (và thu trong mini-game); trần server giờ là 0.
       Vẫn ghi tiến độ — cùng khoá `astroq-read` với learn.html, server chống đếm
       trùng theo id bài. */
    if(window.AstroQProgress) AstroQProgress.lesson(curArt.id);
    toast(t("toast_claim"));
    var btn=$("r-claim"); btn.className="r-claim done"; btn.disabled=true; btn.textContent=t("claimed");
    renderHero(); render(); renderCats(); paintStats();
  }

  /* ===== Toast ===== */
  var toast = AstroQ.makeToast("toast", 2400);

  /* ===== Ngôn ngữ ===== */
  function applyLang(lang){
    if(lang==="en"||lang==="vi") LANG=lang;
    document.documentElement.lang=LANG; document.title=t("title");
    AstroQ.applyTexts(t);
    AstroQ.markLangButtons(LANG);
    $("ic-search").innerHTML=lic("search"); $("ic-cat").innerHTML=lic("layers"); $("ic-award").innerHTML=lic("award");
    $("ic-read").innerHTML=lic("book"); $("ic-total").innerHTML=lic("layers");
    $("ic-ext").innerHTML=lic("ext"); $("ic-ext2").innerHTML=lic("ext");
    renderHero(); render(); renderCats(); paintStats();
    if($("reader").classList.contains("show") && curArt) openReader(curArt.id);
  }

  /* ===== Sự kiện ===== */
  $("back").addEventListener("click", function(){ window.location.href="learn.html"; });
  $("q").addEventListener("input", function(e){ fSearch=(e.target.value||"").trim().toLowerCase(); render(); });
  $("srcfilter").addEventListener("click", function(e){ var b=e.target.closest?e.target.closest("button"):null; if(!b) return;
    fSrc=b.getAttribute("data-src");
    $("srcfilter").querySelectorAll("button").forEach(function(x){ x.classList.toggle("active", x===b); }); render(); });
  $("cats").addEventListener("click", function(e){ var b=e.target.closest?e.target.closest(".cat"):null; if(!b) return;
    fCat=b.getAttribute("data-cat"); renderCats(); render(); });
  $("hero-wrap").addEventListener("click", function(e){ var h=e.target.closest?e.target.closest(".feat"):null; if(h) openReader(h.getAttribute("data-id")); });
  $("grid").addEventListener("click", function(e){ var c=e.target.closest?e.target.closest(".card"):null; if(c) openReader(c.getAttribute("data-id")); });
  $("r-close").addEventListener("click", closeReader);
  $("r-claim").addEventListener("click", claim);
  $("r-quiz").addEventListener("click", function(){ window.location.href="quiz.html"; });
  $("reader").addEventListener("click", function(e){ if(e.target===$("reader")) closeReader(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeReader(); });
  AstroQ.initLang(applyLang);

  /* ===== Khởi tạo ===== */
  paintBalance();
  Economy.onAsteroidsChange(paintBalance);
  applyLang(LANG);
})();
</script>
</body>
</html>
