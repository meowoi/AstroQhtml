   Trái Đất không tải được. */
(function () {
  setTimeout(function () {
    if (window.__mission) return;
    var load = document.getElementById('load');
    if (!load || load.classList.contains('gone')) return;
    var sub = document.getElementById('load-sub');
    if (sub) {
      sub.dataset.fail = '1';
      sub.textContent = (localStorage.getItem('astroq-lang') === 'en')
        ? 'Could not load the scene. Check your connection and reload. '
          + 'Note: this page must be served over http, not opened as a file.'
        : 'Không nạp được cảnh. Kiểm tra kết nối mạng rồi tải lại trang nhé. '
          + 'Lưu ý: trang này phải mở qua http, không mở trực tiếp từ file.';
    }
    var ring = load.querySelector('.ring');
    if (ring) ring.style.display = 'none';
  }, 12000);
})();
</script>

let LANG = AstroQ.getLang();
const t = (k) => { const d = I18N[LANG] || I18N.vi; return d[k] != null ? d[k] : k; };

/* ⚠️ `STEP_IDS` khớp `Missions.All` ĐÚNG THỨ TỰ — xem khối cảnh báo ở đầu file. */
const STEP_IDS = ['eyes', 'bands', 'night', 'read', 'report'];

/* ═══════════════════ VỎ MÀN CHƠI ═══════════════════
   `ST.mount()` PHẢI chạy trước mọi `$('id')` của vỏ — nó là thứ dựng ra chúng. */
const ST = AstroQStage.create({
  mission: 'orbit',
  stepIds: STEP_IDS,
  lang: () => LANG,
  t
});
ST.mount();

const toast     = ST.toast;
const say       = ST.say;
const hideSay   = ST.hideSay;
const objective = ST.objective;
const showCard  = ST.showCard;
const dragDrop  = ST.dragDrop;
const buildAsk  = ST.buildAsk;
const sfx       = ST.sfx;
const nudge = (hintId, wrongKey, hintKey) =>
  ST.nudge(hintId, t(wrongKey), t(hintKey));

let RUN = null;
let world = null;
let busy = false;                     // đang chạy hiệu ứng → chặn bấm chồng

/* ───────────────────── Dữ liệu ─────────────────────
   ⚠️ BA VỆT QUÉT ĐẶT GẦN NHAU CÓ CHỦ ĐÍCH — 34° kinh độ, 44° vĩ độ.
      Bài học đã trả giá ở Nhiệm vụ 01: bề ngang nhìn thấy được trên điện thoại dọc
      390×844 chỉ khoảng **83°**, nên ba mục tiêu rải khắp địa cầu là trẻ KHÔNG BAO
      GIỜ thấy cái thứ ba, và không có gì đưa nó vào khung. Nhiệm vụ 01 phải dựng
      hẳn `focusMarker()` để chữa. Ở đây thì tránh hẳn nguyên nhân: bước này dạy về
      DỤNG CỤ, không dạy địa lý, nên ba vệt nằm đâu cũng được — cho chúng nằm gần
      nhau là bài toán "ngoài khung" không bao giờ phát sinh. */
const SWATHS = [
  { id: 'wide',  ic: '🛰️', lat: 46, lon: -4 },
  { id: 'above', ic: '☁️', lat: 22, lon: 14 },
  { id: 'pixel', ic: '🔲', lat: 2,  lon: 30 }
];

/* Bốn đốm sáng ban đêm — CÙNG một ràng buộc khung nhìn: 50° kinh độ, 51° vĩ độ.
   ⚠️ Đây là bốn LOẠI tín hiệu, không phải bốn sự kiện có thật ở đúng toạ độ đó, và
      lời Comet (`s3_say1`) NÓI RA điều đó. Gán một đám cháy cụ thể vào một toạ độ
      cụ thể là khẳng định một sự kiện mà không có nguồn nào chứng minh. */
const GLOWS = [
  { id: 'city',   ic: '🏙️', lat: 48, lon: 2   },
  { id: 'aurora', ic: '🌌', lat: 66, lon: 25  },
  { id: 'fire',   ic: '🔥', lat: 37, lon: -8  },
  { id: 'moon',   ic: '🌙', lat: 15, lon: -25 }
];

const TIPS = ['tip1', 'tip2', 'tip3', 'tip4', 'tip5'];
const TIP_IC = { tip1: '📏', tip2: '🧩', tip3: '🎨', tip4: '🧭', tip5: '🧠' };

/* Khung nhìn mở màn: phóng vừa đủ để cả ba vệt quét nằm trong khung ở mọi khổ máy. */
const FACE_OPEN = { lat: 25, lon: 12, dist: 3.4 };

/* ───────────────────── Lớp phủ cảnh ───────────────────── */
function setTint(kind) {
  const st = $('stage'), ov = $('tint');
  ['mo-false', 'mo-dark'].forEach(c => { st.classList.remove(c); ov.classList.remove(c); });
  ov.classList.toggle('on', !!kind);
  if (kind) { st.classList.add('mo-' + kind); ov.classList.add('mo-' + kind); }
}
function showSim(on) {
  $('sim').textContent = t('s2_sim');
  $('sim').classList.toggle('show', !!on);
}

/* ───────────────────── Chặng ① · Ba vệt quét ───────────────────── */
function buildScan() {
  $('scan-k').textContent = t('s1_k');
  $('scan-hint').textContent = t('s1_hint');
  $('scan-rows').innerHTML = SWATHS.map(s =>
    `<div class="mo-row" data-row="${s.id}">` +
    `<span class="ic" aria-hidden="true">${s.ic}</span>` +
    `<span class="tx">${esc(t('sw_' + s.id + '_t'))}</span>` +
    `<span class="tick" aria-hidden="true">✓</span></div>`).join('');
  world.addMarkers(SWATHS.map(s => ({
    id: s.id, lat: s.lat, lon: s.lon, cls: 'mo-swath',
    label: t('sw_' + s.id + '_n'),
    html: `<span class="ic" aria-hidden="true">${s.ic}</span>`
  })));
}

/* ───────────────────── Chặng ② · Băng sóng ───────────────────── */
function buildBand() {
  $('band-k').textContent = t('s2_k');
  $('band-hint').textContent = t('s2_hint');
  $('band-switch').innerHTML = ['true', 'false'].map(b =>
    `<button type="button" class="mo-bandbtn hit" data-band="${b}">` +
    `<span class="nm">${esc(t('s2_' + b + '_n'))}</span>` +
    `<span class="tx">${esc(t('s2_' + b + '_t'))}</span></button>`).join('');
  $('band-switch').querySelectorAll('.mo-bandbtn').forEach(b => {
    b.addEventListener('click', () => steps.bands.onBand(b.getAttribute('data-band')));
  });
  paintBand();
}
function paintBand() {
  $('band-switch').querySelectorAll('.mo-bandbtn').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-band') === steps.bands.band);
  });
}

/* ───────────────────── Chặng ③ · Đốm sáng ban đêm ───────────────────── */
function buildNight() {
  $('night-k').textContent = t('s3_k');
  $('night-hint').textContent = t('s3_hint');
  world.addMarkers(GLOWS.map(g => ({
    id: g.id, zone: g.id, lat: g.lat, lon: g.lon, cls: 'mo-glow',
    label: t('g_' + g.id),
    html: `<span class="ic" aria-hidden="true">${g.ic}</span>`
  })));
  $('night-tray').innerHTML = GLOWS.map(g =>
    `<button type="button" class="me-gem wide hit" data-want="${g.id}">` +
    `<span class="ic" aria-hidden="true">${g.ic}</span>` +
    `<span class="tx">${esc(t('g_' + g.id))}</span></button>`).join('');

  dragDrop({
    items: Array.from($('night-tray').querySelectorAll('.me-gem')),
    zones: Array.from(document.querySelectorAll('.mo-glow')),
    wide: true,
    onHit(el, z) {
      z.classList.add('ok');
      el.classList.add('used');
      steps.night.onPlace();
    },
    onMiss() { nudge('night-hint', 's3_wrong', 's3_hint'); }
  });
}

/* ───────────────────── Chặng ④ · Năm mẹo ───────────────────── */
function buildTips() {
  $('tips-k').textContent = t('s4_k');
  $('tips-rail').innerHTML = TIPS.map((id, i) =>
    `<button type="button" class="mo-tip hit" data-tip="${i}"` +
    ` aria-label="${esc(t(id + '_n'))}">` +
    `<span class="n">${i + 1}</span>` +
    `<span class="ic" aria-hidden="true">${TIP_IC[id]}</span></button>`).join('');
  $('tips-rail').querySelectorAll('.mo-tip').forEach(b => {
    b.addEventListener('click', () => steps.read.openTip(Number(b.getAttribute('data-tip'))));
  });
  paintTips();
}
/* ⚠️ CHẶNG NÀY LÀ MỘT TRÌNH TỰ, nên mẹo chưa tới bị chặn HẲN ở chính cái nút
   (`disabled`), không chặn bằng một câu `if`: chặn bằng `if` thì nút vẫn nhận tiêu
   điểm bàn phím và vẫn báo với trình đọc màn hình rằng nó bấm được. */
function paintTips() {
  const seen = steps.read.seen;
  $('tips-rail').querySelectorAll('.mo-tip').forEach((b, i) => {
    b.classList.toggle('ok', i < seen);
    b.classList.toggle('now', i === seen);
    b.disabled = i !== seen;
  });
  $('tips-say').innerHTML = seen > 0 ? t(TIPS[seen - 1] + '_p') : '';
}

/* ───────────────────── Chặng ⑤ · Báo cáo ───────────────────── */
function buildReport() {
  $('report-k').textContent = t('s5_k');
  $('report-hint').textContent = t('s5_hint');
  $('report-send').textContent = t('s5_send');
  $('report-lines').innerHTML = ['s5_l1', 's5_l2', 's5_l3'].map(k =>
    `<div class="mo-line"><span class="tick" aria-hidden="true">✓</span>` +
    `<span class="tx">${esc(t(k))}</span></div>`).join('');
}

/* ═══════════════════ SỔ ĐĂNG KÝ CHẶNG ═══════════════════

   ⚠️⚠️ MỌI `enter()` ĐỀU THEO ĐÚNG MỘT NHỊP: khoá `busy` → bảng mục tiêu → Comet nói
      → mở bảng điều khiển → nhả `busy`. **ĐỪNG MỞ BẢNG TRƯỚC KHI COMET NÓI XONG.**

      Bản đầu 15/08/2026 làm ngược (mở bảng rồi mới `await say(...)`), và bộ smoke bắt
      được ngay: một cú bấm vào bảng trong lúc câu thoại còn đang chờ sẽ gọi `say()`
      LẦN THỨ HAI, mà `say()` chỉ giữ MỘT `sayResolve` — lời gọi mới ghi đè lời cũ,
      nên promise của `enter()` **không bao giờ resolve** và chặng đứng lại vĩnh viễn.
      Trẻ nhìn thấy: bấm nút xong thì không có gì xảy ra nữa.

      Hai lớp chặn, cần CẢ HAI: `busy` chặn mọi cú bấm trong lúc hoạt cảnh chạy, còn
      việc mở bảng sau lời thoại thì bảo đảm **không có gì để bấm** ngay từ đầu — thứ
      không tồn tại thì không cần ai nhớ khoá. */
const steps = {
  /* ── ① Ba vệt quét ── */
  eyes: {
    hits: 0,
    got: new Set(),
    async enter() {
      world.setMap('flat');
      world.setControls({ rotate: false, zoom: false });
      setTint(null);
      showSim(false);
      await world.panTo({ ...FACE_OPEN, ms: 0 });
      busy = true;
      objective({ ic: '🛰️', h: t('s1_h'), p: t('s1_p'), n: 0, total: SWATHS.length });
      await say('comet', t('s1_say1'));
      hideSay();
      buildScan();
      $('scan').classList.add('show');
      busy = false;
    },
    async pick(ev) {
      if (busy || ev.type !== 'marker') return;
      const s = SWATHS.find(x => x.id === ev.id);
      if (!s || this.got.has(s.id)) return;
      busy = true;
      this.got.add(s.id);
      this.hits++;
      world.markDone(s.id);
      const row = $('scan-rows').querySelector(`[data-row="${s.id}"]`);
      if (row) row.classList.add('ok');
      ST.progress(this.hits, SWATHS.length);
      sfx('beep', 900 + this.hits * 150);
      await showCard({
        ic: s.ic, cc: '#5fd3ff', cbg: 'rgba(10,30,52,.96)',
        nm: t('sw_' + s.id + '_n'),
        fact: t('sw_' + s.id + '_f'),
        sub: t('sw_' + s.id + '_t'),
        tag: t('tag_scan')
      });
      /* Ba câu phản hồi KHÁC NHAU theo lượt chạm, viết literal chứ không ghép
         `t('s1_hit' + n)` — phép kiểm i18n quét `t("khoá")` dạng CHỮ, ghép động là
         ba khoá này bị báo "khai mà không dùng" và lỗi đó im lặng. */
      const line = this.hits === 1 ? t('s1_hit1') : this.hits === 2 ? t('s1_hit2') : t('s1_hit3');
      $('scan-hint').textContent = line;
      busy = false;
      if (this.hits >= SWATHS.length) {
        sfx('ready');
        await say('byte', t('s1_done'));
        hideSay();
        await finishStep('eyes');
      }
    },
    outro() {
      $('scan').classList.remove('show');
      world.clearMarkers();
    }
  },

  /* ── ② Băng sóng ── */
  bands: {
    band: null,
    asked: false,
    async enter() {
      world.setMap('flat');
      setTint(null);
      showSim(false);
      await world.panTo({ lat: 20, lon: 15, dist: 3.0, ms: 900 });
      busy = true;
      objective({ ic: '🌈', h: t('s2_h'), p: t('s2_p'), n: 0, total: 0 });
      await say('comet', t('s2_say1'));
      hideSay();
      buildBand();
      $('band').classList.add('show');
      busy = false;
    },
    async onBand(b) {
      if (busy || this.asked) return;
      this.band = b;
      paintBand();
      setTint(b === 'false' ? 'false' : null);
      showSim(b === 'false');
      sfx('pickup');
      if (b !== 'false') return;      // còn phải gạt sang màu giả mới đi tiếp
      busy = true;
      this.asked = true;
      await say('byte', t('s2_say2'));
      hideSay();
      $('band').classList.remove('show');
      buildAsk({
        k: t('s2_ask_k'), q: t('s2_q'),
        opts: [
          { id: 'red',  ic: '🍁', tx: t('s2_o1') },
          { id: 'nir',  ic: '📡', tx: t('s2_o2') },
          { id: 'bug',  ic: '🐞', tx: t('s2_o3') }
        ],
        onPick: (p) => this.onAnswer(p)
      });
      $('ask').classList.add('show');
      busy = false;
    },
    /* ⚠️ ĐOÁN SAI KHÔNG PHẠT — cả hai nhánh đều hé lộ đáp án đúng kèm lý do. Đây là
       màn HỌC, không phải bài kiểm tra; phạt ở đây là dạy trẻ đừng đoán. */
    async onAnswer(pick) {
      if (busy) return;
      busy = true;
      $('ask').classList.remove('show');
      sfx(pick === 'nir' ? 'ready' : 'nope');
      await say(pick === 'nir' ? 'comet' : 'byte', pick === 'nir' ? t('s2_ok') : t('s2_no'));
      await say('byte', t('s2_water'));
      hideSay();
      await showCard({
        ic: '🌈', cc: '#c084fc', cbg: 'rgba(26,12,40,.96)',
        nm: t('s2_cn'), fact: t('s2_cf'), sub: t('s2_cs'), tag: t('s2_ct')
      });
      busy = false;
      await finishStep('bands');
    },
    outro() {
      $('band').classList.remove('show');
      $('ask').classList.remove('show');
      setTint(null);
      showSim(false);
    }
  },

  /* ── ③ Đốm sáng ban đêm ── */
  night: {
    placed: 0,
    async enter() {
      world.setMap('flat');
      await world.panTo({ lat: 40, lon: 0, dist: 3.2, ms: 900 });
      setTint('dark');
      busy = true;
      objective({ ic: '🌃', h: t('s3_h'), p: t('s3_p'), n: 0, total: GLOWS.length });
      await say('comet', t('s3_say1'));
      hideSay();
      buildNight();
      $('night').classList.add('show');
      busy = false;
    },
    async onPlace() {
      this.placed++;
      ST.progress(this.placed, GLOWS.length);
      sfx('pickup');
      $('night-hint').textContent = t('s3_hint');
      if (this.placed < GLOWS.length) return;
      sfx('ready');
      await showCard({
        ic: '🌃', cc: '#ffcf6b', cbg: 'rgba(30,22,6,.96)',
        nm: t('s3_cn'), fact: t('s3_cf'), sub: t('s3_cs'), tag: t('s3_ct')
      });
      await say('byte', t('s3_done'));
      hideSay();
      await finishStep('night');
    },
    outro() {
      $('night').classList.remove('show');
      world.clearMarkers();
      setTint(null);
    }
  },

  /* ── ④ Năm mẹo ── */
  read: {
    seen: 0,
    async enter() {
      world.setMap('flat');
      setTint(null);
      await world.panTo({ lat: 30, lon: 10, dist: 3.2, ms: 900 });
      busy = true;
      objective({ ic: '🔎', h: t('s4_h'), p: t('s4_p'), n: 0, total: TIPS.length });
      await say('comet', t('s4_say1'));
      hideSay();
      buildTips();
      $('tips').classList.add('show');
      busy = false;
    },
    /** Mỗi mẹo làm một việc KHÁC NHAU trên chính tấm ảnh đang mở — đó là điều tách
        chặng này khỏi một bảng câu đố năm câu. */
    async openTip(i) {
      if (busy || i !== this.seen) return;
      busy = true;
      this.seen = i + 1;
      sfx('beep', 820 + i * 90);
      if (i === 0) { $('scale').classList.add('show'); }
      if (i === 1) { world.showGrid(true); }
      if (i === 2) { setTint('false'); showSim(true); }
      if (i === 3) { setTint(null); showSim(false); world.showGrid(false); $('compass').classList.add('show'); }
      if (i === 4) { $('compass').classList.remove('show'); $('scale').classList.remove('show'); }
      ST.progress(this.seen, TIPS.length);
      paintTips();
      busy = false;
      if (this.seen < TIPS.length) return;
      await showCard({
        ic: '🔎', cc: '#5fd3ff', cbg: 'rgba(8,26,44,.96)',
        nm: t('s4_cn'), fact: t('s4_cf'), sub: t('s4_ct'), tag: t('s4_ct')
      });
      await say('comet', t('s4_done'));
      hideSay();
      await finishStep('read');
    },
    outro() {
      $('tips').classList.remove('show');
      $('scale').classList.remove('show');
      $('compass').classList.remove('show');
      world.showGrid(false);
      setTint(null);
      showSim(false);
    }
  },

  /* ── ⑤ Báo cáo ── */
  report: {
    sent: false,
    async enter() {
      world.setMap('flat');
      setTint(null);
      await world.panTo({ ...FACE_OPEN, ms: 900 });
      busy = true;
      objective({ ic: '📡', h: t('s5_h'), p: t('s5_p'), n: 0, total: 0 });
      await say('comet', t('s5_say1'));
      hideSay();
      buildReport();
      $('report').classList.add('show');
      busy = false;
    },
    async onSend() {
      if (busy || this.sent) return;
      this.sent = true;
      busy = true;
      $('report-send').disabled = true;
      sfx('fanfare');
      await say('comet', t('s5_done'));
      hideSay();
      busy = false;
      await finishStep('report');
    },
    outro() { $('report').classList.remove('show'); }
  }
};

$('report-send').addEventListener('click', () => steps.report.onSend());

RUN = AstroQMission.create({
  mission: 'orbit',
  stepIds: STEP_IDS,
  steps: steps,
  stepsEl: $('steps'),
  /* Số tạm cho tới khi server trả số thật — khớp số entry của
     `learningdata/astronomy/orbit_codex.json`. `check_pages` [3c] đối chiếu. */
  codexTotal: 4,
  t: t,
  toast: ST.toast,
  onBalance: ST.paintBalance,
  onWin: ST.showWin,
  onStepDone: ST.afterStep
});
ST.attach(RUN);

async function finishStep(id) { return RUN.finish(id); }

/* ───────────────────── Ngôn ngữ ───────────────────── */
function applyLang(lang) {
  if (lang === 'en' || lang === 'vi') LANG = lang;
  document.documentElement.lang = LANG;
  document.title = t('title');
  AstroQ.applyTexts(t);
  AstroQ.markLangButtons(LANG);
  ST.applyLang();
  $('load-sub').textContent = $('load-sub').dataset.fail ? t('load_fail') : t('load_sub');
  $('sim').textContent = t('s2_sim');
  /* ⚠️ ĐỔI NGÔN NGỮ GIỮA MỘT CHẶNG: chỉ vẽ lại NHÃN, KHÔNG dựng lại bảng —
     `build*()` sinh markup mới nên mọi ô đã kích hoạt / thẻ đã xếp biến mất và trẻ
     phải làm lại từ đầu chỉ vì bấm EN. Mỗi bảng vì thế có một nhánh riêng ở đây. */
  if ($('scan').classList.contains('show')) {
    $('scan-k').textContent = t('s1_k');
    $('scan-rows').querySelectorAll('.mo-row').forEach(r => {
      r.querySelector('.tx').textContent = t('sw_' + r.getAttribute('data-row') + '_t');
    });
    document.querySelectorAll('.mo-swath').forEach(m => {
      m.setAttribute('aria-label', t('sw_' + m.dataset.id + '_n'));
    });
    const n = steps.eyes.hits;
    $('scan-hint').textContent = n === 0 ? t('s1_hint')
      : n === 1 ? t('s1_hit1') : n === 2 ? t('s1_hit2') : t('s1_hit3');
  }
  if ($('band').classList.contains('show')) {
    $('band-k').textContent = t('s2_k');
    $('band-hint').textContent = t('s2_hint');
    $('band-switch').querySelectorAll('.mo-bandbtn').forEach(b => {
      const k = b.getAttribute('data-band');
      b.querySelector('.nm').textContent = t('s2_' + k + '_n');
      b.querySelector('.tx').textContent = t('s2_' + k + '_t');
    });
  }
  if ($('night').classList.contains('show')) {
    $('night-k').textContent = t('s3_k');
    $('night-hint').textContent = t('s3_hint');
    /* Nhãn của cả thẻ CHƯA xếp lẫn đốm sáng ĐÃ xếp — đọc lại từ dữ liệu chứ không
       từ DOM: chữ cũ nằm trong DOM chính là thứ đang cần thay. */
    $('night-tray').querySelectorAll('.me-gem').forEach(el => {
      el.querySelector('.tx').textContent = t('g_' + el.getAttribute('data-want'));
    });
    document.querySelectorAll('.mo-glow').forEach(m => {
      m.setAttribute('aria-label', t('g_' + m.dataset.id));
    });
  }
  if ($('tips').classList.contains('show')) {
    $('tips-k').textContent = t('s4_k');
    $('tips-rail').querySelectorAll('.mo-tip').forEach((b, i) => {
      b.setAttribute('aria-label', t(TIPS[i] + '_n'));
    });
    paintTips();
  }
  if ($('report').classList.contains('show')) {
    buildReport();
    if (steps.report.sent) $('report-send').disabled = true;
  }
}

/* ───────────────────── Khởi động ───────────────────── */
ST.paintBalance();
ST.paintMute();
Economy.onAsteroidsChange(ST.paintBalance);
applyLang(LANG);
AstroQ.initLang(applyLang);
RUN.paint();

(async function boot() {
  try {
    world = AstroQEarth2D.create($('stage'), { reduced });
  } catch (e) {
    $('load-sub').dataset.fail = '1';
    $('load-sub').textContent = t('load_fail');
    $('load').querySelector('.ring').style.display = 'none';
    console.warn('[AstroQ] Không dựng được cảnh:', e && e.message);
    return;
  }
  world.onPick(ev => RUN.pick(ev));
  world.start();
  $('load').classList.add('gone');

  /* Bề mặt điều khiển cho test tự động. Chỉ ĐIỀU KHIỂN, KHÔNG cấp thưởng — thưởng
     vẫn do server quyết.
     ⚠️ Gán TRƯỚC `await RUN.enter()`: chặng ① chờ trẻ bấm "OK", nên gán sau thì
        `window.__mission` không tồn tại cho tới khi có người bấm.
     ⚠️ Các hàm CỐ Ý KHÔNG trả Promise — `page.evaluate` của Playwright tự chờ
        promise được trả về, mà bên trong lại chờ một cú bấm → test treo vĩnh viễn
        thay vì báo hỏng. */
  window.__mission = {
    get step()   { return RUN.step; },
    get done()   { return RUN.done; },
    get reward() { return RUN.reward; },
    get busy()   { return busy; },
    pick: (ev) => { RUN.pick(ev); return true; },
    say:  () => ST.sayNext(),
    win:  () => ST.win(),
    get autoLeft() { return ST.autoLeft; },
    get askOpen()  { return ST.askOpen; },
    askNext: () => ST.askNext(),
    askStop: () => ST.askStop(),
    /** Số vệt quét đã chạm ở chặng ①. */
    get scanned() { return steps.eyes.hits; },
    /** Gạt băng sóng ở chặng ②; `'true'` | `'false'`. */
    band: (b) => { steps.bands.onBand(b); return true; },
    /** Trả lời câu đố chặng ②. Phải gọi được CẢ nhánh sai — "đoán sai không phạt"
        là một luật của thiết kế, mà luật nào không có phép kiểm thì sớm muộn có
        người "sửa" nó đi. */
    answer: (p) => { steps.bands.onAnswer(p); return true; },
    /** Số đốm sáng đã nhận dạng ở chặng ③. */
    get placed() { return steps.night.placed; },
    /** Mở mẹo thứ `i` (0-based) ở chặng ④. */
    tip: (i) => { steps.read.openTip(i); return true; },
    get tips() { return steps.read.seen; },
    get tipTotal() { return TIPS.length; },
    /** Gửi báo cáo ở chặng ⑤. */
    send: () => { steps.report.onSend(); return true; },
    get badges() { return RUN.reward.badges; },
    world
  };

  ST.resumeSteps();
  await RUN.enter();
})();
</script>
</body>
