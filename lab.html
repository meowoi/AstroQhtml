<!-- ⚠️ CỐ Ý KHÔNG nạp js/firebase-auth.js (SDK 64,2 KB gzip): phiên bản đầu của
     Phòng Nghiên Cứu KHÔNG ghi gì lên server, nên nó không cần token. Lý do đầy
     đủ ở docs/proposals/2026-08-12-… mục 5: `POST /me/progress` trả 400 với
     `reason` lạ (Wallet không có mục nào cho `lab`), và mẫu codex thì gắn với
     BƯỚC NHIỆM VỤ. Lab là chỗ chơi tự do, không phải chỗ kiếm Thiên thạch tím.
     ⚠️ `GET /billing/catalog` là route CÔNG KHAI nên không cần token — nạp
     js/api.js bằng import ĐỘNG lúc cần, không đặt thẻ <script>. -->
</head>
<body>

<div class="nebula"></div>
<div class="starfield"></div>

<div class="wrap">
  <header class="hub-top">
    <button class="back-btn" id="back" type="button"><span>&lt;</span> <span data-i18n="back">Về Trung Tâm Điều Hướng</span></button>
    <span class="hub-tag">[ RESEARCH_LAB ]</span>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="vi">VI</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <!-- ══ LƯỚI THẺ ══ -->
  <section id="grid-view">
    <div class="hero">
      <h1 data-i18n="h1">Phòng Nghiên Cứu</h1>
      <p class="hero-sub" data-i18n="sub">Tự tay làm thí nghiệm rồi tự tìm ra câu trả lời.</p>
    </div>
    <!-- ⚠️ Dải nhắc PHẢI THẤY ĐƯỢC: một trạng thái khác hẳn bản thật mà không nói ra
         thì chính người thử sẽ kết luận sai về sản phẩm. Cùng lý do có `.env-badge`
         khi `?api=local`. Nó tự hiện/ẩn theo cờ, không phải gõ tay. -->
    <div class="lab-dev" id="lab-dev" hidden>
      <span aria-hidden="true">🔧</span>
      <span id="lab-dev-txt"></span>
      <a href="lab.html?unlock=0" id="lab-dev-off"></a>
    </div>
    <div class="lgrid" id="lgrid"></div>
  </section>

  <!-- ══ MÀN THÍ NGHIỆM ══ -->
  <section class="exp" id="exp-view" hidden>
    <button class="pbtn ghost" id="to-grid" type="button">
      <span>&lt;</span> <span data-i18n="ui_back_grid">Về Phòng Nghiên Cứu</span>
    </button>

    <div class="exp-head">
      <span class="exp-name" id="exp-name"></span>
      <span class="exp-code" id="exp-code"></span>
    </div>

    <div class="stage"><canvas id="cv"></canvas></div>

    <!-- Chọn nơi (LAB-01 và LAB-03) -->
    <div class="exp-ctl" id="ctl-places" hidden>
      <span class="ctl-lbl" data-i18n="ui_pick_place">Chọn nơi:</span>
      <div class="places seg" id="places"></div>
    </div>

    <!-- Ô nhập cân nặng — chỉ LAB-03 dùng. ⚠️ `type="number"` + `inputmode` để bàn
         phím điện thoại mở đúng bàn số; `min/max` là lớp kẹp THỨ NHẤT, JS kẹp lần
         nữa vì thuộc tính HTML thì ai cũng sửa được bằng DevTools. -->
    <div class="exp-ctl" id="ctl-kg" hidden>
      <label class="ctl-lbl" for="kg" data-i18n="ui_your_kg">Cân nặng của em ở Trái Đất:</label>
      <span class="kg-wrap">
        <input id="kg" type="number" min="1" max="200" step="0.5" value="30"
               inputmode="decimal" aria-describedby="kg-unit" />
        <span class="kg-unit" id="kg-unit" data-i18n="ui_kg">kg</span>
      </span>
    </div>

    <!-- Comet đặt câu hỏi / giải thích. Vỏ box lấy từ css/mascot.css. -->
    <!-- ⚠️ `.aq-ava` là thẻ BỌC chứa <img>, KHÔNG gắn thẳng vào <img>: rule
         `.aq-ava img{width:100%}` của css/mascot.css chỉ với tới ảnh khi có lớp bọc.
         Bản đầu gắn vào chính <img> nên nền/viền khung avatar không bao quanh gì cả
         và ảnh đè lên góc box. Ba trang kia (`.me-say`/`.mi-say`/`.tour-bubble`) đều
         dùng lớp bọc — xem khối CÁCH DÙNG ở đầu css/mascot.css. -->
    <div class="aq-say lab-say" id="say" role="status" aria-live="polite">
      <span class="aq-ava"><img id="say-ava" src="ava/avam.png" alt="Comet" /></span>
      <div class="body">
        <span class="aq-nm" id="say-nm">Comet</span>
        <p class="line" id="say-txt"></p>
      </div>
    </div>

    <!-- Trẻ đoán TRƯỚC khi thấy kết quả — đoán sai KHÔNG phạt gì. -->
    <div class="guess" id="guess"></div>

    <div class="exp-ctl" id="ctl-run" hidden>
      <button class="pbtn" id="run" type="button" data-i18n="ui_drop">Thả!</button>
      <button class="pbtn ghost" id="again" type="button" data-i18n="ui_again">Làm lại</button>
      <!-- "Xem chậm" chỉ đổi nhịp XEM, không đổi kết quả nào — nên nó an toàn về
           mặt nội dung, và nó là thứ trẻ cần để kịp nhìn vết đèn nháy. -->
      <button class="pbtn ghost" id="slow" type="button" data-i18n="ui_slow">Xem chậm</button>
    </div>

    <!-- Hai độ sâu lời giải thích -->
    <div class="more-wrap" id="more-wrap" hidden>
      <button class="more-btn" id="more-btn" type="button">
        <span data-i18n="ui_more">Tìm hiểu thêm</span> <span aria-hidden="true">›</span>
      </button>
      <div class="more-box" id="more-box" hidden></div>
    </div>

    <div class="finding" id="finding" hidden>
      <span class="fi-ic" aria-hidden="true">🔎</span>
      <span>
        <span class="fi-h" id="fi-h">PHÁT HIỆN CỦA EM</span>
        <span class="fi-t" id="fi-t"></span>
      </span>
    </div>

    <div class="srcs" id="srcs"></div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var $ = AstroQ.$;
  var LANG = AstroQ.getLang();
  var LAB = window.AstroQLab;

  var VI = {
    back:"Về Trung Tâm Điều Hướng",
    h1:"Phòng Nghiên Cứu",
    sub:"Tự tay làm thí nghiệm rồi tự tìm ra câu trả lời.",
    dev_note:"CHẾ ĐỘ THỬ — đang mở cả thẻ trả phí. Đây không phải thứ trẻ nhìn thấy.",
    dev_off:"Tắt chế độ thử"
  };
  var EN = {
    back:"Back to Navigation Hub",
    h1:"Research Lab",
    sub:"Run the experiment yourself and find the answer yourself.",
    dev_note:"TEST MODE — paid cards are open. This is not what a child sees.",
    dev_off:"Turn test mode off"
  };
  /* Khoá giao diện của lab nằm ở js/lab-catalog.js (một chỗ khai) — hai từ điển
     trên chỉ giữ phần RIÊNG của trang này. `t()` tra lab trước, rồi mới tới đây. */
  function t(k){
    var v = LAB.text(k, LANG);
    if (v !== k) return v;
    var d = (LANG === "en") ? EN : VI;
    return (d[k] != null) ? d[k] : k;
  }

  /* ══════════════════ CHẾ ĐỘ THỬ ══════════════════
     `?unlock=1` cho MỞ các thẻ trả phí để chủ dự án chơi thử; `?unlock=0` tắt.
     Nhớ trong `sessionStorage` nên tải lại trang không phải gõ lại, và đóng tab là
     hết — đúng khuôn `?api=prod|local` · `?onboard=1` · `?restart=1` · `?step=`
     mà dự án đã dùng, và cùng lối `sessionStorage` của lời nhắc xoay ngang.

     ⚠️⚠️ ĐÂY KHÔNG PHẢI MỘT LỖ HỔNG THANH TOÁN, VÀ CŨNG KHÔNG PHẢI LỚP BẢO VỆ.
        Nội dung của lab nằm HẾT trong `js/lab-catalog.js` gửi tới máy khách, nên ai
        mở DevTools cũng chơi được LAB-02/03 dù không có cờ này — cờ chỉ làm việc đó
        tiện hơn. Nghĩa là hàng rào `pro` của lab hôm nay là một LỜI NÓI THẬT về việc
        "cái này thuộc gói nào", KHÔNG phải một cái khoá. Muốn nó thành khoá thật thì
        nội dung phải chuyển sang server sau một phép kiểm token — một việc backend
        riêng, chưa làm. Ghi ra đây để không ai tưởng nó đã được bảo vệ.

     ⚠️ Cờ CHỈ mở thẻ `pro`, KHÔNG mở thẻ `soon`: mấy thẻ đó chưa có nội dung nên
        mở ra là một màn trống — đúng cái bẫy `soon`/`pro` mà js/locks.js sinh ra để
        tránh. */
  var UNLOCK_KEY = "astroq-lab-unlock";
  (function readFlag(){
    try{
      if (/[?&]unlock=1/.test(location.search)) sessionStorage.setItem(UNLOCK_KEY, "1");
      if (/[?&]unlock=0/.test(location.search)) sessionStorage.removeItem(UNLOCK_KEY);
    }catch(e){}
  })();
  function devUnlock(){
    try{ return sessionStorage.getItem(UNLOCK_KEY) === "1"; }catch(e){ return false; }
  }

  var view = null;          // null = lưới, hoặc id thẻ đang mở
  var scene = null;         // AstroQLabDrop
  var place = "earth";
  var guessed = false;

  /* ══════════════════ LƯỚI THẺ ══════════════════ */
  function cardState(c){
    if (!c.lock) return "free";
    var st = AstroQLocks.state(c.lock);      // "soon" | "pro"
    // Chế độ thử: mở thẻ `pro`, giữ nguyên thẻ `soon` (chúng chưa có nội dung).
    if (st === "pro" && devUnlock()) return "free";
    return st;
  }

  function renderGrid(){
    var dev = $("lab-dev");
    dev.hidden = !devUnlock();
    if (devUnlock()){
      $("lab-dev-txt").textContent = t("dev_note");
      $("lab-dev-off").textContent = t("dev_off");
    }
    var host = $("lgrid");
    host.innerHTML = "";
    LAB.CARDS.forEach(function(c){
      var st = cardState(c);
      var open = (st === "free");
      var b = document.createElement("button");
      b.type = "button";
      b.className = "lcard t-" + c.tone + (st === "soon" ? " soon" : "");
      b.setAttribute("data-card", c.id);

      var tag = open ? "free" : (st === "pro" ? "pro" : "soon");
      var tagTxt = open ? t("ui_free_badge")
                 : (st === "pro" ? AstroQLocks.text("badge_pro", LANG)
                                 : t("ui_soon_badge"));
      b.innerHTML =
        '<span class="lc-top">' +
          '<span class="lc-ic" aria-hidden="true">' + c.ic + '</span>' +
          '<span class="lc-code">' + c.code + '</span>' +
        '</span>' +
        '<span class="lc-name">' + AstroQ.esc(t("t_" + c.id)) + '</span>' +
        '<span class="lc-desc">' + AstroQ.esc(t("d_" + c.id)) + '</span>' +
        '<span class="lc-tag ' + tag + '">' + AstroQ.esc(tagTxt) + '</span>';

      /* ⚠️ Thẻ bị khoá VẪN BẤM ĐƯỢC — nó mở hộp nói vì sao khoá. Nút `disabled`
         mới là ngõ cụt: trẻ bấm không ăn và chỉ tưởng mình bấm trượt (bài học
         #loader của explorer). Luật "nút bấm được thì phải có gì đó xảy ra"
         KHÔNG bị nới lỏng — có xảy ra thật, là cái hộp. */
      if (open) {
        b.addEventListener("click", function(){ openCard(c.id); });
      } else {
        AstroQLocks.wire(b, c.lock);
      }
      host.appendChild(b);
    });
  }

  /* ══════════════════ MÀN THÍ NGHIỆM ══════════════════ */
  function say(txt){ $("say-txt").textContent = txt; }

  function mascotFor(c){
    // Comet dẫn phần quan sát; Byte dẫn phần số liệu — khớp cách hai linh vật
    // đã được dùng ở mission-earth (Comet kể, Byte báo số).
    return (c.kind === "weight")
      ? { img:"ava/avab.png", nm:"Byte" }
      : { img:"ava/avam.png", nm:"Comet" };
  }

  function renderPlaces(c){
    var wrap = $("ctl-places");
    if (!c.places || c.places.length < 2){ wrap.hidden = true; return; }
    wrap.hidden = false;
    var host = $("places");
    host.innerHTML = "";
    c.places.forEach(function(pid){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = t("p_" + pid);
      b.className = (pid === place) ? "on" : "";
      b.addEventListener("click", function(){
        place = pid;
        renderPlaces(c);
        scene.setPlace(pid);
        afterPlace(c);
      });
      host.appendChild(b);
    });
  }

  function renderSrcs(c){
    var host = $("srcs");
    if (!c.src || !c.src.length){ host.innerHTML = ""; return; }
    var h = '<span class="src-h">' + AstroQ.esc(t("ui_source")) + '</span>';
    c.src.forEach(function(k){
      var s = LAB.SRC[k];
      if (!s) return;
      h += '<a href="' + s.url + '" target="_blank" rel="noopener">' + s.url + '</a>';
    });
    host.innerHTML = h;
  }

  function resetOutcome(){
    $("finding").hidden = true;
    $("more-wrap").hidden = true;
    $("more-box").hidden = true;
    guessed = false;
  }

  /* Sau khi hé lộ: câu giải thích ngắn + mở nút "Tìm hiểu thêm" + phát hiện.
     ⚠️ ĐỘ SÂU CHỈ QUYẾT CÁI MẶC ĐỊNH, KHÔNG KHOÁ GÌ. Bậc `senior` (trẻ khai 11+)
        thì phần dài mở sẵn; `junior` thì gấp lại và nút vẫn ở đó. Cả hai bậc đều
        lật được sang bản kia — máy đoán sai tuổi thì trẻ sửa bằng một cú bấm.
        Xem `js/depth.js` (và vì sao KHÔNG suy bậc từ `level`). */
  function reveal(c, key){
    say(t(key));
    $("more-box").textContent = t("more_" + c.id);
    $("more-box").hidden = !(window.AstroQDepth && AstroQDepth.isSenior());
    $("more-btn").querySelector("span").textContent =
      $("more-box").hidden ? t("ui_more") : t("ui_less");
    $("more-wrap").hidden = false;
    $("fi-h").textContent = t("ui_finding").toUpperCase();
    $("fi-t").textContent = t("find_" + c.id);
    $("finding").hidden = false;
  }

  function renderGuess(c){
    var host = $("guess");
    host.innerHTML = "";
    if (guessed) return;
    var opts = [];
    if (c.kind === "drop")  opts = ["ui_guess_same","ui_guess_hammer","ui_guess_feather"];
    if (c.kind === "float") opts = ["ui_guess_fall","ui_guess_float"];
    opts.forEach(function(k){
      var b = document.createElement("button");
      b.type = "button"; b.className = "pbtn ghost";
      b.textContent = t(k);
      b.addEventListener("click", function(){
        /* ⚠️ ĐOÁN SAI KHÔNG PHẠT GÌ — không điểm, không đúng/sai, không đỏ.
           Đây là chỗ khám phá; cùng nguyên tắc "thả sai KHÔNG trừ điểm" của ba
           bảng kéo-thả ở mission-earth. */
        guessed = true;
        renderGuess(c);
        if (c.kind === "drop"){ $("ctl-run").hidden = false; say(t("q_tower")); }
        else if (c.kind === "float"){ reveal(c, "say_float"); }
      });
      host.appendChild(b);
    });
  }

  /* ⚠️ LAB-07 và LAB-08 có MỘT CÂU GIẢI THÍCH CHO TỪNG NẤC (`say_sky_noon`,
     `say_drops_salt`…), khác LAB-03 chỉ có một câu duy nhất. Gom về một hàm để chỗ
     gọi không phải nhớ thẻ nào thuộc loại nào. */
  function sayKeyFor(c, step){
    if (c.kind === "sky" || c.kind === "drops") return "say_" + c.id + "_" + step;
    if (c.kind === "weight") return "say_weigh";
    return "say_" + c.id;
  }

  function afterPlace(c){
    resetOutcome();
    if (c.kind === "drop"){
      $("ctl-run").hidden = !guessed;
      say(guessed ? t("q_tower") : t("q_tower"));
      renderGuess(c);
    } else if (c.kind === "weight" || c.kind === "sky" || c.kind === "drops"){
      // Không cần đoán: đổi một nấc là thấy ngay, và câu giải thích đổi theo nấc.
      reveal(c, sayKeyFor(c, place));
    }
  }

  function openCard(id){
    var c = LAB.card(id);
    if (!c || !c.kind) return;
    view = id;
    place = (c.places && c.places[0]) || "earth";

    $("grid-view").hidden = true;
    $("exp-view").hidden = false;
    $("exp-name").textContent = t("t_" + id);
    $("exp-code").textContent = c.code;

    var m = mascotFor(c);
    $("say-ava").src = m.img; $("say-ava").alt = m.nm; $("say-nm").textContent = m.nm;

    if (!scene) scene = AstroQLabDrop.create($("cv"));
    scene.setScene(c.kind, { place: place });
    scene.onDone(function(res){
      reveal(c, res.same ? "say_tower_moon" : "say_tower_earth");
    });

    resetOutcome();
    renderPlaces(c);
    renderSrcs(c);
    $("ctl-run").hidden = true;
    // "Thả!" và "Xem chậm" chỉ có nghĩa với cảnh CÓ CÚ RƠI. Để chúng hiện ở thẻ
    // khác là một nút bấm không làm gì — đúng cái ngõ cụt luật của dự án cấm.
    $("slow").hidden = (c.kind !== "drop");
    $("again").hidden = (c.kind !== "drop");
    $("ctl-kg").hidden = (c.kind !== "weight");

    if (c.kind === "drop")       { say(t("q_tower")); }
    else if (c.kind === "float") { say(t("q_float")); }
    else if (c.kind === "weight"){ say(t("q_weigh")); }
    else if (c.kind === "sky")   { say(t("q_sky")); }
    else if (c.kind === "drops") { say(t("q_drops")); }
    renderGuess(c);
    /* Ba thẻ này không có bước ĐOÁN: việc của trẻ là ĐỔI một thứ rồi xem đổi gì.
       Ép thêm một câu đố vào đó là biến khám phá thành bài kiểm tra. */
    if (c.kind === "weight" || c.kind === "sky" || c.kind === "drops")
      reveal(c, sayKeyFor(c, place));

    window.scrollTo({ top:0, behavior:"smooth" });
  }

  function toGrid(){
    view = null;
    $("exp-view").hidden = true;
    $("grid-view").hidden = false;
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  /* ══════════════════ Nối dây ══════════════════ */
  $("back").addEventListener("click", function(){ location.href = "dashboard.html"; });
  $("to-grid").addEventListener("click", toGrid);
  $("run").addEventListener("click", function(){ scene.drop(); });
  $("again").addEventListener("click", function(){
    resetOutcome(); guessed = true; scene.reset(); renderGuess(LAB.card(view));
  });
  /* ⚠️ Nghe `input` chứ không `change`: `change` chỉ nổ khi ô mất tiêu điểm, nên trẻ
     gõ số rồi ngồi nhìn mà cảnh không đổi — đọc ra như trang bị treo.
     ⚠️ Ô TRỐNG thì GIỮ NGUYÊN cảnh, đừng nhảy về 30: trẻ xoá để gõ số khác, mà mỗi
     ký tự xoá lại vẽ lại một con số nó không hề nhập là một cảnh nhảy loạn. */
  $("kg").addEventListener("input", function(){
    var raw = $("kg").value.trim();
    if (raw === "") return;
    var kg = scene.setKg(raw);
    var c = LAB.card(view);
    if (c) reveal(c, sayKeyFor(c, place));
    return kg;
  });
  /* Rời ô mới sửa lại giá trị hiển thị cho khớp thứ đã KẸP — sửa ngay lúc đang gõ
     thì "1" thành "1" rồi "10" không gõ được nữa. */
  $("kg").addEventListener("blur", function(){
    var kg = scene.setKg($("kg").value);
    $("kg").value = String(kg).replace(".", ",") === String(kg) ? kg : kg;
  });

  $("slow").addEventListener("click", function(){
    var on = scene.toggleSlow();
    $("slow").textContent = on ? t("ui_slow_off") : t("ui_slow");
    $("slow").classList.toggle("on", on);
    resetOutcome();
    var c = LAB.card(view);
    guessed = true; renderGuess(c);           // đã đoán rồi thì đừng hỏi lại
  });
  $("more-btn").addEventListener("click", function(){
    var box = $("more-box");
    box.hidden = !box.hidden;
    $("more-btn").querySelector("span").textContent = box.hidden ? t("ui_more") : t("ui_less");
  });
  window.addEventListener("resize", function(){ if (scene) scene.resize(); });

  function applyLang(lang){
    LANG = lang;
    /* ⚠️ `applyTexts` nhận một HÀM, không phải từ điển (xem js/ui-common.js).
       Truyền `t` của trang này thì mọi khoá `data-i18n` đều tra được — kể cả khoá
       khai ở js/lab-catalog.js (ui_drop · ui_more · ui_back_grid…), vì `t()` tra
       lab trước rồi mới tới hai từ điển riêng ở đây. */
    AstroQ.applyTexts(t);
    // Chữ do JS sinh phải vẽ lại — applyTexts không với tới nó.
    renderGrid();
    if (view){
      var c = LAB.card(view);
      $("exp-name").textContent = t("t_" + view);
      renderPlaces(c); renderSrcs(c); renderGuess(c);
      $("fi-h").textContent = t("ui_finding").toUpperCase();
      $("fi-t").textContent = t("find_" + view);
      $("more-box").textContent = t("more_" + view);
      $("more-btn").querySelector("span").textContent =
        $("more-box").hidden ? t("ui_more") : t("ui_less");
      if (scene) scene.resize();          // nhãn trong cảnh cũng đổi ngôn ngữ
    }
    $("run").textContent = t("ui_drop");
    $("again").textContent = t("ui_again");
    $("slow").textContent = (scene && scene.isSlow()) ? t("ui_slow_off") : t("ui_slow");
  }

  applyLang(LANG);
  AstroQ.initLang(applyLang);

  /* ⚠️ TRƯỚC ĐÂY chỗ này gọi `GET /billing/catalog` để biết đã mở bán chưa, rồi
     truyền vào `AstroQLocks.setSaleOpen()`. Bỏ hẳn 12/08/2026: lời văn của thẻ trả
     phí nay là bản CHÍNH THỨC (coi như đã mở bán), nên không còn ai đọc cờ đó —
     giữ lời gọi lại là một vòng mạng không làm gì, đúng bài học `missionsShared()`.
     Nhờ vậy trang này không gọi API nào cả. */
})();
</script>
