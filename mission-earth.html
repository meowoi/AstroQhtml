<script>
/* CANH GIỜ NẠP CẢNH 3D — đặt ở script CỔ ĐIỂN, cố ý không nằm trong module.
   `boot()` đã bắt lỗi của `createEarthWorld`, nhưng nếu **chính module không nạp
   được** thì `boot()` không bao giờ chạy và màn chờ quay mãi mà không nói gì.
   Hai trường hợp thật:
     · mở trang bằng `file://` — trình duyệt chặn ES module vì CORS (origin `null`),
       trang này BẮT BUỘC phải chạy qua http (`python -m http.server`), y như
       explorer.html;
     · ảnh Trái Đất (`img/earth/*`) không tải được.
   Thà nói thẳng "không nạp được" còn hơn để trẻ ngồi nhìn vòng xoay. */
(function () {
  var WAIT_MS = 12000;
  setTimeout(function () {
    if (window.__mission) return;                 // đã dựng xong, không phải lỗi
    var load = document.getElementById('load');
    if (!load || load.classList.contains('gone')) return;
    var sub = document.getElementById('load-sub');
    if (sub) {
      sub.dataset.fail = '1';
      sub.textContent = (localStorage.getItem('astroq-lang') === 'en')
        ? 'Could not load the 3D library. Check your connection and reload. ' +
          'Note: this page must be served over http, not opened as a file.'
        : 'Không nạp được thư viện 3D. Kiểm tra kết nối mạng rồi tải lại trang nhé. ' +
          'Lưu ý: trang này phải mở qua http, không mở trực tiếp từ file.';
    }
    var ring = load.querySelector('.ring');
    if (ring) ring.style.display = 'none';
  }, WAIT_MS);
})();
</script>

  if (era) { st.classList.add('era-' + era); ov.classList.add('era-' + era); }
}
/** Độ dày khói (1 = đen kịt, 0 = trong). Giá trị ĐỘNG nên đặt qua biến CSS. */
function setSmog(v) {
  const el = $('smog');
  const n = Math.max(0, Math.min(1, v));
  el.style.setProperty('--smog', String(n));
  el.classList.toggle('drift', n > 0 && !reduced);
}

/* ───────────────────── Bàn tay hướng dẫn ───────────────────── */
function hand(kind) {
  const el = $('hand');
  el.className = 'me-hand' + (kind ? ' show ' + kind : '');
  if (kind === 'drag') { el.style.left = '50%'; el.style.top = '58%'; }
  if (kind === 'zoom') { el.style.left = '50%'; el.style.top = '52%'; }
}
function handOff() { $('hand').className = 'me-hand'; handId = null; }

/* Chỉ bàn tay 👆 vào MỘT marker cụ thể (thêm 02/08/2026, `004`).
   ⚠️ Đây là thứ THAY CHO `hand('drag')`/`hand('zoom')` đã bỏ: bước ① không dạy thao
      tác nào nữa, bàn tay chỉ nói "chỗ này".
   ⚠️ Dùng `world.screenOf` chứ không tự chiếu lại lat/lon: `#stage` là
      `position:fixed;inset:0` nên toạ độ khung nhìn CHÍNH LÀ toạ độ của nó, và nhờ đi
      qua đúng hàm cảnh đang dùng thì bàn tay không bao giờ lệch khỏi marker thật.
      Marker ngoài khung → `visible:false` → tắt bàn tay, không chỉ ra ngoài màn hình. */
let handId = null;                       // đốm bàn tay ĐANG chỉ vào; null = đang tắt
function handAt(id) {
  const at = world.screenOf('marker', id);
  if (!at || !at.visible) return handOff();
  const el = $('hand');
  el.style.left = (at.x - 19) + 'px';
  el.style.top = (at.y + 16) + 'px';   // dưới đốm — ngón tay 👆 chỉ NGƯỢC LÊN vào nó
  el.className = 'me-hand show tap';
  handId = id;
}

/* Marker chưa chạm TIẾP THEO. `null` = xong hết.
   ⚠️⚠️ ĐI THEO ĐỐM GẦN NHẤT, KHÔNG THEO THỨ TỰ KHAI BÁO — LỖI THẬT ĐÃ SỬA 03/08/2026.
      Chủ dự án chơi thật và báo: *"click sang điểm sáng khác rồi mà bàn tay vẫn ở chỗ
      cũ"*. Nguyên nhân là HAI LUẬT ĐÚNG NHƯNG NGƯỢC NHAU nằm cạnh nhau:
        · thiết kế cho **chạm đốm nào trước cũng được** (`004`: ép thứ tự là tạo ra cú
          chạm SAI ở một bước cả thiết kế đang cố làm cho không thể sai);
        · nhưng bàn tay lại chỉ vào đốm ĐẦU TIÊN CHƯA CHẠM **theo thứ tự khai báo**.
      Nên nếu trẻ chạm từ giữa ra, đốm số 0 (`namerica`) cứ chưa chạm mãi và bàn tay
      **đứng nguyên một chỗ suốt nhiều cú chạm liền**. Tái hiện được: chạm 5 đốm liên
      tiếp mà tay vẫn ở `(340, 233)` chỉ vào `namerica`, cách đó 7px, không nhích một
      pixel. Trẻ đọc ra thành "bấm không ăn".
   ⚠️ VÌ SAO "GẦN NHẤT" LÀ ĐÁP ÁN, không phải "đốm kế tiếp trong danh sách": đốm vừa
      chạm đã `done`, nên đốm gần nhất **luôn là một đốm khác** → bàn tay CHẮC CHẮN dời
      chỗ sau mỗi cú chạm. Nó còn dời tới chỗ ngay cạnh nơi trẻ đang nhìn, nên đọc ra
      như một mạch đi tiếp chứ không như một cú nhảy sang đầu bản đồ.
   ⚠️ Và nó làm CÚ LƯỚT BẢN ĐỒ ngắn hơn (`focusMarker` dùng chung `nx` này) — cùng bài
      học đã ghi ở `LIFE_ORDER`: một cú lướt 149° dài gấp đôi mọi cú lướt khác của cả
      nhiệm vụ thì bản thân nó là một lỗi.
   ⚠️ ĐO KHOẢNG CÁCH BẰNG lat/lon, KHÔNG bằng px màn hình. Bản đồ là equirectangular
      nên px theo trục ngang tỉ lệ ĐÚNG với `dlon` và trục dọc tỉ lệ đúng với `dlat`
      (cùng một hệ số), tức Euclid trên (dlon, dlat) **là** khoảng cách màn hình sai
      khác một hằng số. Lợi thế: không phụ thuộc khung nhìn hiện tại, nên kết quả không
      đổi giữa lúc bản đồ đang lướt — mà `focusMarker` thì được gọi ngay sau đó.
   ⚠️ `dlon` PHẢI GÓI VỀ ±180. Không gói thì `oceania` (lon 135) và `namerica` (lon
      −100) đo ra 235° trong khi đường thật qua Thái Bình Dương chỉ 125°.
   `fromId` rỗng (lúc vào bước) → giữ nguyên đốm đầu danh sách, đúng như trước. */
function nextLeft(list, gotIds, fromId) {
  const left = list.filter(p => !gotIds.has(p.id));
  if (!left.length) return null;
  const from = fromId ? list.find(p => p.id === fromId) : null;
  if (!from) return left[0];
  const dlon = (a, b) => {
    let d = Math.abs(a - b) % 360;
    return d > 180 ? 360 - d : d;
  };
  const dist = p => Math.hypot(dlon(p.lon, from.lon), p.lat - from.lat);
  return left.reduce((best, p) => (dist(p) < dist(best) ? p : best), left[0]);
}

/* ĐƯA MARKER KẾ TIẾP VÀO KHUNG — chỉ khi nó ĐANG Ở NGOÀI KHUNG (02/08/2026, `005`).
   ⚠️ VÌ SAO CẦN: bảy châu lục trải ~234° kinh độ. Đo được ở sàn phóng `ZOOM_MIN` = 1
      — bề ngang nhìn thấy = 360 × vpW / max(vpW, 2·vpH):
        · 1440×900   → 288°  (cả 7 châu lục nằm trong khung, KHÔNG lướt lần nào)
        · 2560×1080  → 360°  (toàn bộ bản đồ)
        · 390×844    → **83°** — không đời nào đủ cho 7 châu lục.
      Tức là trên điện thoại dọc, "mọi marker phải trong khung ngay lúc `enter()`"
      là điều KHÔNG THỂ đạt được bằng cách chọn khung nhìn. Mà `004` đã bỏ hết cú
      kéo, nên trẻ không có cách nào tự đi tìm → **kẹt cứng vĩnh viễn**, đúng cái
      bẫy dự án đã trả giá một lần ở bản 3D.
   ⚠️ VÌ SAO "CHỈ KHI Ở NGOÀI KHUNG": trên máy tính cả 7 đã thấy hết, lướt bản đồ ở
      đó là chuyển động trẻ không yêu cầu và không hiểu vì sao xảy ra.
   ⚠️ ĐÂY KHÔNG PHẢI CÚ KÉO QUAY LẠI. Trẻ không kéo gì cả — máy quét của tàu tự dời
      tầm nhìn sang mục tiêu kế tiếp, y như `panTo` giữa các bước. Luật "0 cú kéo"
      của `004`/`005` nói về THAO TÁC CỦA TRẺ, không cấm cảnh tự dịch chuyển.
   ⚠️⚠️ DÙNG `world.centerOn`, KHÔNG DÙNG `world.panTo`. `panTo` nhận thẳng
      `facing.lon`, mà nó chỉ trùng tâm khung khi `zoom = 1`; `centerOn` nhận kinh độ
      muốn đặt vào GIỮA rồi tự quy đổi. Xem `centerOn` trong `js/earth2d.js`.
   ⚠️ `dist` PHẢI TRUYỀN VÀO, đừng gán cứng 4.4: mỗi bước có mức phóng riêng
      (`scan` 4,4 · `life` 3,1) và lướt bản đồ mà đồng thời đổi mức phóng là hai
      chuyển động chồng lên nhau ở đúng lúc trẻ đang dõi theo một mục tiêu. */
/* Marker có THẬT SỰ bấm được không — không chỉ "có nằm trong khung".
   ⚠️ SINH RA TỪ MỘT LỖI CHỦ DỰ ÁN GẶP KHI CHƠI THẬT (02/08/2026): *"Nam Cực bị đè
      sau popup hội thoại của Comet, trẻ không thể tự tìm."* Nam Cực ở lat −72 nên
      chiếu xuống gần ĐÁY khung, mà box thoại `.me-say` và các bảng `.me-board` cũng
      neo ở đáy — marker nằm trong khung nhưng **nằm DƯỚI một lớp khác**.
      `screenOf().visible` chỉ biết chuyện giao với khung, không biết chuyện bị che.
   ⚠️ `document.elementFromPoint` là phép đo THẬT: nó trả về đúng phần tử sẽ nhận cú
      bấm. Dự án đã trả giá một lần cho bài học này ở `explorer.html` — `#loader` mờ
      tới `opacity:0,02` mà vẫn NUỐT mọi cú bấm trong 0,8 giây, và "có CSS" hay "có
      focus" đều không chứng minh được người dùng thao tác được. */
function markerHittable(id) {
  const at = world.screenOf('marker', id);
  if (!at || !at.visible) return false;
  const top = document.elementFromPoint(Math.round(at.x), Math.round(at.y));
  return !!(top && (top.dataset.id === id || top.closest('.e2-mk[data-id="' + id + '"]')));
}

async function focusMarker(id, lat, lon, dist) {
  if (markerHittable(id)) return;
  await world.centerOn({ lat: lat, lon: lon, dist: dist, ms: reduced ? 0 : 850 });
}

/* Báo bước xong lên server: `js/mission-engine.js` lo (`RUN.finish` tự gọi).
   Client CHỈ gửi {mission, step} — không có con số thưởng nào ở client. */

/* ══════════════════════════ CÁC BƯỚC ══════════════════════════
   Mỗi bước là một object độc lập: enter() dựng cảnh + mục tiêu, pick() nhận cú
   chạm vào cảnh 3D, tick() chạy mỗi khung nếu cần theo dõi liên tục. */

const steps = {

  /* ── 1. Bề mặt Trái Đất: bảy châu lục, rồi biển hay đất nhiều hơn? ──────────
     Hai nhịp trong MỘT bước, cùng một arc "bề mặt hành tinh này có gì":
       (a) chạm 7 châu lục  → mỗi cái sáng lên + hiện tên + một câu
       (b) đoán nước/đất    → hé lộ 71% / 29%
     Tiến độ đếm 7 + 1 = 8 để dãy chấm không nhảy hụt ở nhịp cuối. */
  scan: {
    hits: 0,
    gotIds: new Set(),
    asked: false,
    async enter() {
      this.hits = 0;
      this.gotIds = new Set();
      this.asked = false;
      /* ⚠️ MỘT HÌNH DUY NHẤT CHO CẢ NHIỆM VỤ — bản đồ phẳng, không đổi lần nào (`004`).
         Trước 02/08/2026 bước này mở màn bằng ảnh QUẢ CẦU rồi ĐỔI sang bản đồ phẳng
         ngay giữa bước, sau câu thoại đầu. Đó là cú đổi hình tệ nhất của cả nhiệm vụ:
         trẻ vừa thấy Trái Đất tròn, nghe một câu, rồi hành tinh dẹt ra thành hình chữ
         nhật TRƯỚC KHI kịp làm gì. Cộng hai cú đổi ở bước 2 và bước 5 là 3 lần.
         Lý do cũ ("phẳng tối hơn quả cầu 4,7 lần") đã ĐO LẠI VÀ SAI ĐỊA CHỈ — xem khối
         chú thích ở `FACE_OPEN`. Tóm tắt: thủ phạm là KHUNG NHÌN, không phải loại bản
         đồ; đặt khung vào FACE_OPEN đưa 26,8 → 69,3 mà không đụng một byte asset nào.
         ⚠️ Không có cú kéo nào trong bước này, nên `setControls` tắt CẢ zoom. */
      world.setMap('flat');
      world.showGrid(true);
      world.setControls({ rotate: false, zoom: false });
      /* Hành tinh ĐỨNG YÊN: chuyển động duy nhất trên màn hình nên là chuyển động do
         TRẺ tạo ra. Trên bản đồ phẳng `setSpin` còn kéo cả khung ảnh trượt ngang
         (`paint()` lấy `px` từ `facing.lon`), tức là bản đồ tự bò đi trong lúc trẻ đọc. */
      world.setSpin(0);
      /* ⚠️ MỞ MÀN VẪN LÀ `FACE_OPEN` PHÓNG GẦN — GIỮ NGUYÊN, VÀ ĐÂY LÀ CHỖ ĐÃ ĐO.
         `FACE_OPEN` (tâm 30, 35) ở `dist:2,6` được `004` chọn VÌ NỘI DUNG (Đại Tây Dương ·
         châu Phi · Ả Rập · Ấn Độ Dương · Himalaya · dải mây) VÀ vì độ sáng: 82,7 so
         với 87,0 của ảnh quả cầu như nó từng chạy.
         ⚠️ Bản đầu của lượt `005` mở thẳng ở sàn phóng `dist:4,4` cho đủ 7 châu lục —
            và `smoke_mission_earth` bắt ngay: độ sáng cảnh MỞ MÀN tụt còn **47,7**
            (ngưỡng 70). Lùi hết cỡ là thấy trọn bản đồ, mà bản đồ thì phần lớn là đại
            dương — đo được nước 13,8 vs đất 101,1 TRÊN CÙNG BỨC ẢNH. Tức "thấy đủ 7
            châu lục" và "cảnh đầu tiên phải sáng" là hai yêu cầu chống nhau nếu ép
            vào MỘT khung nhìn.
         Cách thoát: **hai nhịp**. Mở màn gần và sáng, Comet nói "mình trải phẳng nó
         ra thành bản đồ", RỒI camera mới lùi ra — cú lùi trở thành phần thưởng của
         câu thoại chứ không phải một khung nhìn tối om từ giây đầu. */
      await world.centerOn({ ...FACE_OPEN, dist: 2.6, ms: reduced ? 0 : 1400 });
      objective({ ic: '🗺️', h: t('s1_h'), p: t('s1_p'), n: 0, total: CONTINENTS.length + 1 });

      /* ⚠️ KHÔNG CÒN `hand('zoom')` VÀ `hand('drag')` (bỏ 02/08/2026, `004`).
         Chủ dự án chốt: "không có hành động hay hướng dẫn co kéo gì hết". Bàn tay giờ
         chỉ làm MỘT việc — chỉ vào châu lục kế tiếp. Không dạy thao tác, chỉ chỉ chỗ.
         ⚠️ Câu mở đầu nói ra việc "trải phẳng Trái Đất thành bản đồ" vì trẻ vừa rời
         QUẢ CẦU 3D ở `explorer.html` (nhịp 0 của `005`). Không nói thì cú đổi hình
         giữa hai trang từ trên trời rơi xuống — đúng lỗi mà `004` đã đi sửa. */
      await say('comet', t('s1_say1'));
      /* CÚ LÙI RA — nhịp thứ hai của cảnh mở màn (xem khối chú thích ngay trên).
         ⚠️ `centerOn` chứ không `panTo`: trên bản đồ phẳng `facing.lon` KHÔNG rơi vào
            tâm khung (lệch 36° ở 1440×900). Đo được với `centerOn({lon:17})`: cả 7
            châu lục nằm trong khung ở 1440×900 · 1900×985 · 2560×1080. Riêng điện
            thoại dọc thì bất khả thi (chỉ thấy 83° kinh độ) — `focusMarker` lo. */
      await world.centerOn({ lat: 0, lon: 17, dist: 4.4, ms: reduced ? 0 : 1100 });
      world.addMarkers(CONTINENTS.map(p => ({
        id: p.id, lat: p.lat, lon: p.lon,
        rgb: '95,240,255', color: 0xbdf5ff
      })));
      await say('comet', t('s1_say2'));
      hideSay();
      /* ⚠️ PHẢI `focusMarker` NGAY LÚC VÀO BƯỚC, không chỉ sau mỗi cú chạm. Trên điện
         thoại dọc châu lục đầu tiên (Bắc Mỹ, lon −100) nằm NGOÀI khung ở khung nhìn
         mở màn, nên `handAt` không có gì để chỉ và trẻ mở bước ra thấy một tấm bản đồ
         không có dấu hiệu nào. `smoke_mission_earth` mục [10] bắt đúng chuyện này. */
      await focusMarker(CONTINENTS[0].id, 0, CONTINENTS[0].lon, 4.4);
      handAt(CONTINENTS[0].id);
      /* ⚠️ LỜI NHẮC 9 GIÂY GIỮ LẠI LÀM BẢO HIỂM. Bỏ nó đi là đặt cược rằng khung
         nhìn sẽ không bao giờ đổi nữa. Câu chữ không bảo trẻ kéo, chỉ nhắc còn chỗ
         chưa chạm và bàn tay đang chỉ vào đó. */
      if (!reduced) {
        this._tid = setTimeout(() => {
          if (this.hits < CONTINENTS.length && RUN.done.indexOf('scan') < 0) toast(t('s1_hint'));
        }, 9000);
      }
    },
    async pick(ev) {
      if (ev.type !== 'marker' || busy) return;
      const p = CONTINENTS.find(x => x.id === ev.id);
      if (!p || !world.markDone(ev.id)) return;
      clearTimeout(this._tid);
      handOff();
      this.gotIds.add(p.id);
      this.hits++;
      // Cao dần theo số châu lục đã quét — trẻ nghe là biết mình đang tiến tới
      sfx('beep', 900 + this.hits * 70);
      progress(this.hits, CONTINENTS.length + 1);
      /* Thẻ nội dung — dùng lại đúng `showCard` của bước `life`/`timeline`, không
         dựng hộp thoại thứ hai. Tên châu lục là phần trẻ phải đọc được rõ nhất. */
      busy = true;
      await showCard({
        ic: p.ic, nm: p.nm[LANG] || p.nm.vi, fact: p.fact[LANG] || p.fact.vi,
        tag: t('s1_card'), cc: '#38bdf8', cbg: 'rgba(56,189,248,.28)'
      });
      const nx = nextLeft(CONTINENTS, this.gotIds, p.id);   // `p.id` = đốm vừa chạm
      if (nx) {
        /* ⚠️ `busy` PHẢI CÒN BẬT SUỐT CÚ LƯỚT BẢN ĐỒ, đừng hạ ngay sau `showCard`.
           Hai lý do, và lý do đầu mới là lý do thật:
             · một cú chạm rơi vào giữa lúc bản đồ đang trượt là chạm vào chỗ khác với
               chỗ trẻ nhìn thấy — đúng loại lỗi "mục tiêu chạy khỏi con trỏ" mà `004`
               đã đi sửa một lần;
             · `busy` cũng là thứ bộ smoke chờ. Hạ sớm thì nó đo vị trí marker GIỮA
               LÚC cú lướt còn đang chạy và báo "ngoài khung" — bản đầu của tôi làm
               đúng như vậy và mục [10] báo hỏng 4 châu lục. */
        await focusMarker(nx.id, 0, nx.lon, 4.4);
        handAt(nx.id);
        busy = false;
        return;
      }
      busy = false;
      await this.ask();
    },
    /* NHỊP (b): câu đố "biển hay đất nhiều hơn?".
       ⚠️ KHÔNG có trạng thái thua — cả hai nhánh đều hé lộ rồi đi tiếp. Xem lý do
          đầy đủ ở khối chú thích `ASK_ANSWER`. */
    async ask() {
      if (this.asked) return;
      this.asked = true;
      world.clearMarkers();
      await say('comet', t('s1_ask_say'));
      hideSay();
      buildAsk({

  /* ── 2. Lịch sử 4,54 tỷ năm hình thành Trái Đất ──────────────
     Bước ĐỌC-XEM, không phải bước đố: không có cách nào làm sai, chỉ có đi đúng thứ

     "hành tinh này ngày xưa trông khác hẳn" mới có chỗ bám. */
  timeline: {
    seen: 0,
    async enter() {
      this.seen = 0;
      /* ⚠️ KHAI MAP TƯỜNG MINH. `setMap` là trạng thái THỪA HƯỞNG: không khai thì
         bước này nhận map của bước trước, mà bước trước đổi lúc nào cũng được.
         ⚠️ CHÚ THÍCH CŨ Ở ĐÂY NÓI "quả cầu đúng cho bước này" — ĐÃ SAI TỪ `004`
            (một hình cho cả nhiệm vụ) và sai hẳn từ `005` (0 lần `setMap('globe')`).
            Chú thích lạc hậu là thứ dự án đã trả giá thật, nên sửa chứ không để. */
      world.setMap('flat');
      world.setControls({ rotate: false, zoom: false });
      world.setSpin(0);
      /* ⚠️ KHÔNG PHÓNG TO Ở BƯỚC NÀY (bỏ `panTo({dist:3.4})` ngày 02/08/2026).
         Chủ dự án chơi thật và hỏi đúng câu phải hỏi: *"sao hình ảnh Trái Đất lại cần
         zoom trước nhiệm vụ dòng thời gian? không zoom có vấn đề gì không?"* — Không.
         Bước này KHÔNG có gì trên bản đồ để nhìn gần: mọi thứ nó dạy nằm ở thanh mốc
         và bảng chữ dưới đáy, còn hành tinh chỉ đổi TÔNG MÀU (`setEra`) — mà đổi tông
         thì nhìn xa còn rõ hơn nhìn gần. Cú phóng ấy vì thế là chuyển động không mang
         thông tin, đúng loại "cảnh tự dịch chuyển mà trẻ không hiểu vì sao" mà `004`
         đã đi bỏ ở bước ①. Giữ nguyên khung của bước trước là cảnh liền mạch. */
      objective({ ic: '🕰️', h: t('tl_h'), p: t('tl_p'), n: 0, total: ERAS.length });
      $('time-fig').hidden = true;          // chưa mở mốc nào thì chưa có tranh nào
      buildTimeline();
      /* Tải trước tranh của mốc ĐẦU TIÊN ngay khi vào bước — Comet còn đang nói xong
         một câu dài, tức có sẵn vài giây đường mạng rỗi trước cú bấm đầu tiên. Không
         có dòng này thì mốc ① cũng trễ đúng như mốc ②, chỉ khó thấy hơn vì lúc đó chưa
         có tranh nào để so. Xem khối chú thích ở `preloadEra`. */
      preloadEra(0);
      await say('comet', t('tl_say1'));
      hideSay();
      $('time').classList.add('show');
    },
    /**
     * Mở một mốc. Ba nhánh:
     *   · mốc kế tiếp        → xem, tính tiến độ, mở mốc sau
     *   · mốc ĐÃ xem         → cho xem lại (đây là bài học, đọc lại là chuyện tốt)
     *     nhưng KHÔNG tính tiến độ lần nữa
     *   · mốc còn ở phía sau → nhắc đi theo thứ tự
     */
    async openEra(i) {
      if (busy || i < 0 || i >= ERAS.length) return;
      const e = ERAS[i];
      if (i > this.seen) { sfx('nope'); toast(t('tl_locked')); return; }
      setEra(e.era);
      paintEraBody(e);
      if (i < this.seen) { paintTimeline(this.seen, i); return; }

      busy = true;
      sfx('beep', 820 + i * 90);
      this.seen = i + 1;
      progress(this.seen, ERAS.length);
      /* `cur = -1` → vòng sáng "now" nhảy sang mốc KẾ TIẾP, không đứng lại ở mốc vừa
         xem (mốc đó đã có màu xanh "ok"). Trẻ luôn nhìn thấy chỗ bấm tiếp theo. */
      paintTimeline(this.seen, -1);
      /* Viên nham thạch trao ĐÚNG lúc hành tinh đang đỏ rực, không phải cuối bước:
         thẻ ghi "một mảnh vỏ Trái Đất thời còn là dung nham" mà nền sau nó đã là
         Trái Đất xanh thì câu đó mất nghĩa. */
      if (e.card === 'rock') {
        await showCard({
          ic: '🪨', nm: t('rock_nm'), fact: t('rock_fact'), tag: t('rock_got'),
          cc: '#fb923c', cbg: 'rgba(251,146,60,.28)'
        });
      }
      busy = false;
      /* ⚠️ MỐC CUỐI PHẢI CHỜ TRẺ BẤM, ĐỪNG GỌI `finishStep` Ở ĐÂY. Gọi thẳng là bảng bị
         `outro()` gỡ đi ngay khi chữ vừa hiện ra — xem ghi chú ở `#time-ok`. */
      if (this.seen >= ERAS.length) {
        const ok = $('time-ok');
        ok.textContent = t('card_ok');
        ok.hidden = false;
        ok.focus();                        // để đường bàn phím không phải Tab đi tìm
      }
    },
    /** Trẻ đã đọc xong mốc cuối và tự bấm. Đây là đường DUY NHẤT ra khỏi bước ②. */
    async onDone() {
      if (busy || this.seen < ERAS.length) return;
      busy = true;
      $('time-ok').hidden = true;
      busy = false;
      await finishStep('timeline');
    },
    async outro() {
      $('time-ok').hidden = true;
      setEra(null);                        // trả hành tinh về màu thật
      $('time').classList.remove('show');
      await say('comet', t('tl_say2'));
      hideSay();
    }
  },

  /* ── 3. Mặt Trời và ba vùng khí hậu ─────────────────────────────────────────

       (a) hành tinh chìm vào bóng tối → trẻ tìm và chạm ngôi sao → nó bùng cháy
       (b) ba vùng khí hậu: xích đạo · ôn đới · cực — và VÌ SAO chúng khác nhau
     Nhịp (a) là bản cũ của cả bước, giữ nguyên vì đó là khoảnh khắc mạnh nhất và là
     lý do bước này mang id `sun`. Nhịp (b) là bài học mới.

     ⛔ KHÔNG CÒN `.e2-terminator` (bỏ hẳn, `005` mục 2). Bản trước bật gradient vùng
        tối ở đúng đây rồi tắt lại ở cuối `outro()`. Chủ dự án chơi thật và bác bằng
        ảnh chụp: nó trông như một BỨC TƯỜNG ĐEN, không như ranh giới ngày/đêm. Bài
        học ngày/đêm đã chuyển sang quả cầu 3D ở `explorer.html` — nơi ánh sáng là
        `PointLight` gắn vào Mặt Trời THẬT trong cảnh. Đừng dựng lại ở đây. */
  sun: {
    got: new Set(),
    async enter() {
      this.got = new Set();
      /* ⚠️ KHAI MAP TƯỜNG MINH dù cả 7 bước nay đều `flat` (`004`) — `setMap` là
         trạng thái THỪA HƯỞNG, không khai thì bước này nhận map của bước trước và
         bước trước đổi lúc nào cũng được. Đây đúng là chỗ bước ⑥ ⑦ từng để hở. */
      world.setMap('flat');
      world.setControls({ rotate: false, zoom: false });
      /* ⚠️ `dist:4,4` (sàn phóng) CHỨ KHÔNG PHẢI 5,2 NHƯ TRƯỚC. `probe_map_cover.py`
         đo được `dist:5,2` là cấu hình HỞ NHIỀU NHẤT của cả nhiệm vụ (zoom 0,846 < 1
         → lớp nhỏ hơn khung → dải đen ở cả hai trục, 602px bên phải trên khung
         1900×985). `ZOOM_MIN` nay là 1 nên 5,2 chỉ còn là 4,4 viết vòng — khai thẳng
         4,4 để con số trong mã đúng bằng thứ đang chạy.
         `lat:0` + `lon:18` để cả ba vùng khí hậu (lat 48 · 2 · −72, lon ~16–20) nằm
         trong khung ở MỌI cỡ màn — xem khối chú thích của `ZONES`.
         ⚠️ `centerOn` chứ không `panTo`: trên bản đồ phẳng `facing.lon` không rơi vào
            tâm khung (lệch 36° ở 1440×900). Xem `centerOn` trong `js/earth2d.js`. */
      await world.centerOn({ lat: 0, lon: 18, dist: 4.4, ms: reduced ? 0 : 1500 });
      /* MẤT NĂNG LƯỢNG: cả hành tinh chìm vào bóng tối TRƯỚC, rồi Comet mới hỏi
         "ngôi sao đâu?". Chỉ khi vừa thấy sáng ở bước trước thì lúc tối đi mới thành
         một khoảnh khắc. Đây là `.e2-night` (tối CẢ ảnh) — khác hẳn vùng tối vắt
         ngang bản đồ đã bị bác. */
      /* ══ NHỊP (a): TRẺ TỰ ĐOÁN → RỒI MỚI TẮT MẶT TRỜI ══════════════════════════
         Viết lại 02/08/2026 theo chủ dự án. Hai bản trước đều hỏng ở cùng một chỗ:
           · bản 1 — bắt trẻ ĐI TÌM và chạm nút Mặt Trời. Nút `.e2-sun` neo `top:9%;
             right:8%` của khung, mà bản đồ đã lùi hết cỡ và phủ kín, nên ngôi sao
             nằm lẫn vào chính bức ảnh Trái Đất → **không tìm được**, đúng cái bẫy
             bước `rotation` bản 3D đã mắc.
           · bản 2 — bỏ việc đi tìm, Mặt Trời tự cháy. Nhưng lời thoại nói *"ngôi sao
             của chúng ta đang lên kìa"* trong khi **không có vật thể nào hiện ra** →
             trẻ hiểu Mặt Trời nằm trên Trái Đất.
         ⚠️ GỐC CỦA CẢ HAI LÀ MỘT: cú tối/sáng **không có nguyên nhân nào trong tay
            trẻ**, nên lời thoại buộc phải bịa ra một nguyên nhân nhìn thấy được.
         Cách chữa: cho trẻ TỰ TẠO RA nguyên nhân. Bản đồ đang sáng → Comet hỏi *"nếu
         Mặt Trời tắt đi thì sao?"* → trẻ đoán → **cú đoán đó chính là thứ làm màn hình
         tối đi**. Từ đó tối/sáng là hệ quả của một câu hỏi, không phải hiệu ứng rơi
         từ trên trời xuống.
         ⚠️ CẢ BA LỰA CHỌN ĐỀU ĐÚNG — cố ý. Mặt Trời làm cả ba việc cùng lúc, nên
            không có đáp án sai, và chính điều đó là bài học. */
      objective({ ic: '☀️', h: t('s2b_h'), p: t('s2b_p'), n: 0, total: ZONES.length });
      await say('comet', t('s2_say1'));
      hideSay();
      buildAsk({
        k: t('s2_ask_k'), q: t('s2_ask_q'),

      await say('comet', t('s2_ans'));
      /* Ba vai trò — nội dung chủ dự án đưa. Cố ý là LỜI THOẠI chứ không phải ba thẻ:
         bước này còn ba thẻ vùng khí hậu ở nhịp (b), sáu thẻ liên tiếp là quá dài. */
      await say('comet', t('s2_role_heat'));
      await say('comet', t('s2_role_plant'));
      await say('comet', t('s2_role_rain'));
      hideSay();
      sfx('ignite');
      await world.igniteSun(reduced ? 0 : 1700);
      await say('comet', t('s2_say2'));
      hideSay();
      world.addMarkers(ZONES.map(z => ({
        id: z.id, lat: z.lat, lon: z.lon, rgb: '255,207,107', color: 0xffcf6b
      })));
      await say('comet', t('s2b_say1'));
      hideSay();
      busy = false;
      await focusMarker(ZONES[0].id, ZONES[0].lat, ZONES[0].lon, 4.4);
      handAt(ZONES[0].id);
    },
    async pick(ev) {
      if (busy) return;
      if (ev.type !== 'marker') return;
      const z = ZONES.find(x => x.id === ev.id);
      if (!z || !world.markDone(ev.id)) return;
      handOff();
      this.got.add(z.id);
      sfx('beep', 900 + this.got.size * 110);
      progress(this.got.size, ZONES.length);
      busy = true;
      await showCard({
        ic: z.ic, nm: z.nm[LANG] || z.nm.vi, fact: z.fact[LANG] || z.fact.vi,
        tag: t('s2b_card'), cc: z.cc, cbg: z.cbg
      });
      if (this.got.size >= ZONES.length) { busy = false; await finishStep('sun'); return; }
      const nx = nextLeft(ZONES, this.got, z.id);            // cùng lý do như bước ①
      if (nx) {
        // `busy` còn bật suốt cú lướt — lý do ghi ở bước ①.
        await focusMarker(nx.id, nx.lat, nx.lon, 4.4);
        handAt(nx.id);
      }
      busy = false;
    },
    async outro() {
      handOff();
      world.clearMarkers();
      /* ⛔ CÂU KẾT KHÔNG ĐƯỢC NÓI "VÌ GẦN MẶT TRỜI HƠN" — xem khối chú thích `ZONES`.
         Nguyên nhân là GÓC CHIẾU, và đó chính là câu NASA đã đối chiếu. */
      await say('comet', t('s2b_say2'));
      hideSay();
    }
  },

  /* ── 4. Sự sống ở khắp nơi — lát cắt Trái Đất ─────────────────────────────────
     ⚠️ ĐỔI LÊN TRƯỚC `energy` NGÀY 03/08/2026 (trước đó là bước ⑤) — lý do đầy đủ ghi

     cột lát cắt trả lời nó bằng chính bốn nơi trẻ vừa bay tới. */
  life: {
    got: new Set(),
    cur: null,           // nơi đang được hỏi; `null` = đang hé lộ hoặc đã xong
    lastHit: null,       // cú đoán vừa rồi đúng chưa; `null` = chưa đoán lần nào
    async enter() {
      this.got = new Set();
      this.cur = null;
      this.lastHit = null;
      /* ⚠️ BƯỚC NÀY PHẢI DÙNG BẢN ĐỒ PHẲNG (chỉ cảnh 2D có `setMap`). Đây là
         bước DUY NHẤT khẳng định vị trí thật — 4 vùng sinh học neo vào lat/lon

      if (world.setMap) world.setMap('flat');
      world.setControls({ rotate: false, zoom: false });
      await world.panTo({ dist: 3.1, ms: reduced ? 0 : 1500 });
      objective({ ic: '🛸', h: t('s4_h'), p: t('s4_p'), n: 0, total: 4 });
      world.addMarkers(BIOMES.map(b => ({ id: b.id, lat: b.lat, lon: b.lon,
                                          rgb: b.rgb, color: b.color })));
      await say('byte', t('s4_say1'));
      hideSay();
      /* ⚠️ CÙNG CƠ CHẾ VỚI BƯỚC ① — VÀ Ở ĐÂY NÓ CHỮA MỘT LỖI CÓ SẴN (02/08/2026).
         4 vùng nằm ở lon −62 · −42 · 20 · 87 (trải 149°) và lat −75 … 28, trong khi

      buildXsec(r => this.onRung(r));

      await this.askNext();

    /** Bay tới nơi kế tiếp trong `LIFE_ORDER` rồi mở bốn nấc cho trẻ đoán. */
    async askNext() {
      const b = BIOMES.find(x => x.id === LIFE_ORDER[this.got.size]);
      if (!b) return;
      this.cur = b;
      busy = true;
      await focusMarker(b.id, b.lat, b.lon, 3.1);
      $('xsec-q').textContent = t('xsec_q').replace('{nm}', b.nm[LANG] || b.nm.vi);
      $('xsec-hint').textContent = '';

      setRungs(true);
      busy = false;
    },

        của nơi đó rồi đi tiếp — khác nhau đúng một câu chữ. Xem `xsec_ok`/`xsec_near`. */
    async onRung(rank) {
      if (busy || !this.cur) return;
      const b = this.cur;
      this.cur = null;
      busy = true;
      setRungs(false);
      placeChip(b);
      const hit = rank === b.rank;
      this.lastHit = hit;
      $('xsec-hint').textContent = hit ? t('xsec_ok') : t('xsec_near');
      sfx(hit ? 'ready' : 'pickup');
      /* ⛔ HAI THỨ ĐÃ BỎ Ở BƯỚC NÀY, ĐỪNG DỰNG LẠI CÁI NÀO.
         ① DRONE QUÉT (bỏ 02/08/2026) — chủ dự án chơi thật và hỏi đúng câu phải hỏi:
            *"tự dưng đến nhiệm vụ drone quét mẫu làm gì? nếu để khám phá các vùng thì
            đã có 7 châu lục rồi."* Bước ① nay đã là một chuyến đi khắp bề mặt, nên một
            chuyến thứ hai kèm hoạt cảnh 1,5 giây là lặp lại cùng việc bằng cỗ máy to hơn.
         ② CHẠM MARKER ĐỂ MỞ THẺ (bỏ cùng ngày, sau khi đếm ngân sách khuôn) — "chạm dấu
            hiệu trên bản đồ" đã dùng ở ① và ③, nên ở đây là lần thứ 3, vượt luật `002`.
            ⚠️ Marker VẪN GIỮ và camera VẪN BAY TỚI: trẻ phải nhìn thấy nơi đó nằm đâu
               trên ảnh vệ tinh thì câu hỏi độ cao mới có căn cứ. Chỉ có cú BẤM là dời
               xuống cột. Đây cũng là lý do bước này không còn hàm `pick()`. */
      world.setSpin(0);
      world.markDone(b.id);
      this.got.add(b.id);
      progress(this.got.size, 4);
      await showCard({
        ic: b.ic, nm: b.nm[LANG] || b.nm.vi, fact: b.fact[LANG] || b.fact.vi,
        sub: b.alt[LANG] || b.alt.vi,
        tag: t('s4_card'), cc: b.cc, cbg: b.cbg
      });
      if (this.got.size >= 4) { busy = false; await finishStep('life'); return; }
      /* `busy` còn bật suốt cú lướt — cùng lý do đã ghi ở bước ①: một cú bấm rơi vào
         giữa lúc bản đồ đang trượt là bấm vào chỗ khác với chỗ trẻ nhìn thấy. */
      busy = false;
      await this.askNext();
    },
    async outro() {
      world.setSpin(0);
      $('xsec').classList.remove('show');
      world.clearMarkers();
      await say('byte', t('s4_say2'));
      hideSay();
    }
  },

  /* ── 5. Kích hoạt năng lượng sạch ─────────────────────────────────────────────
     ⚠️ ĐỔI XUỐNG SAU `life` NGÀY 03/08/2026 (trước đó là bước ④) — lý do đầy đủ ghi ở
        `STEP_IDS`. Cái được: bước này và `eco` nay đứng LIỀN NHAU, nên câu *"nhưng đổi
        được ba nhà máy thôi thì chưa đủ đâu"* của `eco` nối thẳng vào việc trẻ vừa làm.
     Đặt NGAY SAU bước lát cắt sự sống là có chủ ý: trẻ vừa tự tay dựng nên bằng chứng
     "nấc nào cũng có sinh vật sống", nên ba cột khói phủ đen bản đồ ngay sau đó là một
     lời đe doạ có ĐỊA CHỈ — nó đang phủ lên đúng cái vừa được chứng minh là quý. */
  energy: {
    placed: new Set(),
    async enter() {
      this.placed = new Set();
      /* ⚠️ KHAI MAP TƯỜNG MINH. `setMap` là trạng thái THỪA HƯỞNG: không khai thì
         bước này nhận map của bước trước, mà bước trước đổi lúc nào cũng được.
         ⚠️ CHÚ THÍCH CŨ Ở ĐÂY NÓI "quả cầu đúng cho bước này" — ĐÃ SAI TỪ `004`
            (một hình cho cả nhiệm vụ) và sai hẳn từ `005` (0 lần `setMap('globe')`).
            Chú thích lạc hậu là thứ dự án đã trả giá thật, nên sửa chứ không để. */
      world.setMap('flat');
      world.setControls({ rotate: false, zoom: false });
      world.setSpin(0);
      /* Lùi về sàn phóng và căn giữa ba nhà máy (lon 15 · 20 · 60 → tâm ~32): cả ba
         phải cùng nằm trên màn hình VỚI khay thẻ, không thì không kéo-thả được. */
      await world.centerOn({ lat: 20, lon: 32, dist: 4.4, ms: reduced ? 0 : 1300 });
      /* Khói xuất hiện TRƯỚC khi Byte nói, y như bước Mặt Trời tắt đèn trước khi
         Comet hỏi: thấy vấn đề rồi mới nghe kể về vấn đề. */
      setSmog(1);
      objective({ ic: '🔋', h: t('ce_h'), p: t('ce_p'), n: 0, total: ENERGY.length });
      buildEnergy();                       // dựng nhà máy TRƯỚC để Byte có cái mà chỉ
      await say('byte', t('ce_say1'));
      hideSay();
      $('energy').classList.add('show');
    },
    async onPlace(id) {
      if (this.placed.has(id)) return;
      this.placed.add(id);
      const n = this.placed.size;
      progress(n, ENERGY.length);
      // Khói mỏng đi theo TỪNG nguồn, không đợi đủ 3: trẻ thấy ngay việc mình vừa làm
      // có tác dụng, mà vẫn còn khói nên biết là chưa xong.
      setSmog(1 - n / ENERGY.length);
      toast(t('ce_swap').replace('{n}', n));
      if (n >= ENERGY.length) await finishStep('energy');
    },
    async outro() {
      $('energy').classList.remove('show');
      setSmog(0);
      world.clearMarkers();                // dọn ba nhà máy khỏi bản đồ
      sfx('ready');
      await say('byte', t('ce_say2'));
      hideSay();
    }
  },

  /* ── 6. Eco-Hero: NÊN / KHÔNG NÊN làm ────────────────────────
     Bước DUY NHẤT của nhiệm vụ nói về việc trẻ làm ngoài đời, không phải trong tàu.
     ⚠️ PHẢI ĐỨNG NGAY SAU `energy`, VÀ TỪ 03/08/2026 THÌ NÓ ĐỨNG ĐÚNG CHỖ. Câu mở
        `ec_say1` là *"Nhưng đổi được ba nhà máy thôi thì CHƯA ĐỦ đâu…"* — nó nối trực
        tiếp vào việc trẻ vừa làm ở `energy`. Trước lượt này bước `life` chen vào giữa
        hai bước đó, tức trẻ nghe một câu bị cắt làm hai bởi một bài học khác; chủ dự án
        chơi thật và bắt đúng chỗ đó. Ai dời `life` trở lại giữa hai bước này thì phải
        viết lại `ec_say1` trước.
     Nhờ đứng liền `energy`, câu "vậy mình giữ Trái Đất thế nào?" là KẾT LUẬN của việc
     vừa làm, không phải một bài đạo đức gắn vào. */
  eco: {
    sorted: 0,
    async enter() {
      this.sorted = 0;
      world.setMap('flat');
      world.setControls({ rotate: false, zoom: false });
      world.setSpin(0);
      await world.panTo({ dist: 4.0, ms: reduced ? 0 : 1300 });
      objective({ ic: '🌱', h: t('ec_h'), p: t('ec_p'), n: 0, total: ECO.length });
      await say('byte', t('ec_say1'));
      hideSay();
      buildEco();
      $('eco').classList.add('show');
    },
    async onSort() {
      this.sorted++;
      progress(this.sorted, ECO.length);
      if (this.sorted >= ECO.length) await finishStep('eco');
    },
    async outro() {
      $('eco').classList.remove('show');
      sfx('ready');
      await say('comet', t('ec_say2'));
      hideSay();
    },
    /* Thẻ huy hiệu chỉ hiện khi SERVER báo vừa mở `eco-warrior`. `afterReport()`
       là móc chạy SAU khi máy chủ đã trả lời (xem `js/mission-engine.js`) — gộp vào
       `outro()` thì lúc đó `RUN.reward.badges` còn rỗng. Chưa đăng nhập / mất mạng
       thì bỏ qua: nói "đã mở huy hiệu" trong lúc việc còn nằm trong hàng chờ là bịa. */
    async afterReport() {
      if (RUN.reward.badges.indexOf('eco-warrior') < 0) return;
      sfx('fanfare');
      await showCard({
        ic: badgeIcon('eco-warrior'), nm: badgeName('eco-warrior'),
        fact: t('ec_badge_fact'), tag: t('ec_badge_got'),
        cc: '#4ade80', cbg: 'rgba(74,222,128,.28)'
      });
    }
  },

  /* ── 7. Đóng dấu Hồ Sơ Trái Đất ──────────────────────────────────────────────
     ⛔ KHÔNG CÒN KÉO 3 VIÊN NGỌC (bỏ 02/08/2026). Chủ dự án chơi thật: *"bỏ nhiệm vụ
        kéo viên ngọc đi, không logic."* — Đúng. "Ngọc Mặt Trời · Ngọc Giọt Nước ·
        Ngọc Khí Quyển" là ba vật thể **bịa ra**, không có trong bất cứ thứ gì nhiệm
        vụ vừa dạy; và "Mạch Năng Lượng Sự Sống" cũng vậy. Cả nhiệm vụ đứng trên một
        bức ảnh vệ tinh THẬT với toạ độ THẬT, rồi bước cuối lại bắt trẻ lắp đồ chơi
        khoa học viễn tưởng — đó là chỗ duy nhất câu chuyện tự phản bội chính nó.
     Thay bằng thứ có nghĩa và trẻ đã có sẵn: **hồ sơ** mà nó vừa điền đầy suốt 6 bước.
     ⚠️ ID BƯỚC GIỮ NGUYÊN `core` — đó là khoá trong DynamoDB. Đổi id là người chơi cũ
        mất tiến độ, và `check_pages` [3c] đòi `STEP_IDS` khớp `Missions.All`. Bước này
        không mang mẫu codex nào và không móc huy hiệu nào (đã grep `mission:earth`
        trong `Services/`), nên đổi VIỆC bên trong là an toàn tuyệt đối, 0 đồng backend. */
  core: {
    stamped: false,
    async enter() {
      this.stamped = false;
      world.setMap('flat');
      world.setControls({ rotate: false, zoom: false });
      objective({ ic: '🗂️', h: t('s5_h'), p: t('s5_p'), n: 0, total: 1 });
      buildFile();
      await say('comet', t('s5_say1'));
      hideSay();
      $('core').classList.add('show');
    },
    async onStamp() {
      if (this.stamped) return;
      this.stamped = true;
      progress(1, 1);
      sfx('ready');
      await finishStep('core');
    },
    async outro() {
      $('core').classList.remove('show');
      await world.shield(reduced ? 0 : 1600);
      await say('comet', t('s5_say2'));
      hideSay();
    }
  }
};

/* ───────────────────── Dựng trình điều phối ─────────────────────
   Phải đặt SAU `const steps` (nó là giá trị truyền vào, không hoisting được).
   `showWin` thì hoisting được vì là khai báo hàm, nên truyền thẳng ở đây được.
   `codexTotal` chỉ là số DỰ PHÒNG cho tới khi server trả số thật — nó hiện màn tổng
   kết khi mất mạng.
   ⚠️ PHẢI KHỚP SỐ ENTRY TRONG `learningdata/astronomy/earth_codex.json`. Ngày
      02/08/2026 bỏ bước `rotation` làm entry đó mất, số này còn 9 và màn tổng kết
      ghi **"8/9 mẫu dữ liệu"** — tức nói với trẻ rằng nó bỏ sót một mẫu KHÔNG TỒN
      TẠI, ở đúng màn khen thưởng. `check_pages` [3c] không bắt được (nó soi văn bản);
      chỉ `smoke_mission_earth` chơi thật tới màn tổng kết mới thấy. */
RUN = AstroQMission.create({
  mission: 'earth',
  stepIds: STEP_IDS,
  steps: steps,
  stepsEl: $('steps'),
  codexTotal: 8,
  t: t,
  toast: ST.toast,
  onBalance: ST.paintBalance,
  onWin: ST.showWin,
  onStepDone: ST.afterStep
});
/* Vỏ cần `RUN` để đọc phần thưởng, mở chặng kế và vẽ lại hộp hỏi khi đổi ngôn ngữ. */
ST.attach(RUN);

/* ───────────────────── Bước 2: dòng thời gian ───────────────────── */
function buildTimeline() {
  $('time-k').textContent = t('tl_k');
  $('time-rail').innerHTML = ERAS.map((e, i) =>
    `<button type="button" class="me-era-node hit" data-era="${i}"` +
    ` aria-label="${esc(t('era_' + e.id + '_y'))} — ${esc(t('era_' + e.id + '_n'))}">` +
    `<span class="dot" aria-hidden="true">${e.ic}</span>` +
    `<span class="yr">${esc(t('era_' + e.id + '_y'))}</span>` +
    `<span class="nm">${esc(t('era_' + e.id + '_n'))}</span></button>`).join('');
  $('time-rail').querySelectorAll('.me-era-node').forEach(b => {
    b.addEventListener('click', () => steps.timeline.openEra(Number(b.getAttribute('data-era'))));
  });
  /* Gắn MỘT LẦN ở đây chứ không trong `openEra` — gắn trong đó là mỗi lần mở mốc lại
     thêm một listener, và tới mốc cuối thì một cú bấm chạy `onDone` năm lần. */
  $('time-ok').onclick = () => steps.timeline.onDone();
  paintTimeline(0, -1);
  $('time-h').textContent = '—';
  $('time-p').textContent = '';
  paintEraGhost();
}

/* Khối GIỮ CHỖ: cả 5 cặp tiêu đề+đoạn xếp chồng trong cùng một ô grid với khối chữ
   thật, nên ô đó luôn cao bằng câu DÀI NHẤT ở đúng bề rộng hiện tại → bảng không
   nhảy khi trẻ chuyển giữa hai mốc. Xem khối chú thích ở `#time-ghost` trong HTML.
   ⚠️ Dùng `<h3>`/`<p>` y như khối thật để CSS (`.me-time .era-body h3|p`) áp cùng
      cỡ chữ và cùng `line-height` — khác một pixel là phép giữ chỗ sai một pixel.
   ⚠️ Gọi lại trong `applyLang`: câu tiếng Anh dài khác câu tiếng Việt. */
function paintEraGhost() {
  $('time-ghost').innerHTML = ERAS.map(e =>
    '<div><h3>' + esc(e.ic + '  ' + t('era_' + e.id + '_n')) + '</h3>' +
    '<p>' + esc(t('era_' + e.id + '_p')) + '</p></div>').join('');
}
/** @param seen số mốc đã xem · @param cur mốc đang mở (để tô sáng) */
function paintTimeline(seen, cur) {
  $('time-rail').querySelectorAll('.me-era-node').forEach((b, i) => {
    b.classList.toggle('ok', i < seen);
    b.classList.toggle('now', i === (cur >= 0 ? cur : seen));
    // Mốc còn ở phía sau thì khoá hẳn — kể cả bàn phím, để Tab không nhảy vào chỗ
    // bấm là bị mắng "đi theo thứ tự nhé".
    b.disabled = i > seen;
  });
}
function paintEraBody(e) {
  $('time-h').textContent = e.ic + '  ' + t('era_' + e.id + '_n');
  $('time-p').textContent = t('era_' + e.id + '_p');
  paintEraImg(e);
}

/* Bề rộng ô ảnh khai cho trình duyệt — MỘT bản sao dùng cho cả `<source>` trong HTML,
   `paintEraImg` và `preloadEra`. Ba chỗ gõ lại ba lần là ba chỗ sớm muộn lệch, mà lệch
   ở đây nghĩa là bản tải trước KHÁC bản đem hiện → tải hai lần, đúng hại thứ mà việc
   tải trước sinh ra để chữa. */
const ERA_SIZES = '(max-width: 784px) calc(100vw - 24px), 700px';

/** Tên hai bản `srcset` của một mốc. */
function eraSrcset(img, ext) {
  const base = 'img/era/' + img;
  return base + '-700.' + ext + ' 700w, ' + base + '-1120.' + ext + ' 1120w';
}

/* ⚠️⚠️ TẢI TRƯỚC ẢNH MỐC KẾ TIẾP — SỬA MỘT LỖI THẬT (03/08/2026).
   Chủ dự án chơi thật và báo: *"mốc 4,4 tỷ năm khi click vào không ra ảnh tương ứng
   luôn, bị trễ nhiều"*. Hai nguyên nhân cộng lại, và cả hai đều nằm ở đây:
     ① Ảnh chỉ bắt đầu tải Ở ĐÚNG LÚC trẻ bấm (`loading="lazy"` + gán `src` trong
        `paintEraImg`). Bản `-700.webp` nặng 26–50 KB, tức trên mạng vừa phải là vài
        trăm ms, trên mạng kém là vài giây.
     ② Nặng hơn ①: trong lúc chờ, thẻ `<img>` **vẫn hiện khung ảnh CŨ** — trình duyệt
        giữ khung đã vẽ cho tới khi ảnh mới decode xong. Nên trẻ bấm mốc "đại dương"
        mà vẫn thấy tranh dung nham của mốc trước: không phải "chậm", mà là **hiện sai
        thông tin**, đúng loại lỗi dự án đã đặt lên đầu (`.e2-terminator`, thẻ Amazon
        giữa đại dương).
   Chữa ①: mở mốc nào thì tải trước ảnh của MỐC KẾ TIẾP — trẻ còn đang đọc mấy dòng
   chữ, và đó chính là khoảng thời gian đường mạng đang rỗi. Không tải trước cả 5 (mạng
   kém thì 5 ảnh cùng lúc là tranh băng thông của chính ảnh đang cần).
   Chữa ②: `.era-wait` che ảnh cho tới khi ảnh ĐÚNG về tới máy — thà thấy ô trống còn
   hơn thấy tranh của mốc khác. Ô trống vẫn giữ đúng chỗ (`aspect-ratio` trên `.era-fig`)
   nên bảng không nhảy.
   ⚠️ `srcset`+`sizes` PHẢI GIỐNG HỆT thẻ thật, không được chỉ tải `-700`: trình duyệt
      chọn bản theo `sizes`, khai khác là màn DPR2 tải trước bản 700 rồi lại đi tải bản
      1120 — tốn gấp đôi thay vì tiết kiệm. */
function preloadEra(i) {
  const e = ERAS[i];
  if (!e || !e.img) return;
  const im = new Image();
  im.decoding = 'async';
  im.sizes = ERA_SIZES;
  /* AVIF chỉ đúng khi trình duyệt đọc được AVIF, mà `new Image()` không có `<picture>`
     để chọn giúp. Nên tải trước bản WEBP — được hỗ trợ ở mọi trình duyệt trang này
     nhắm tới, và là bản mà nhánh cuối của `<picture>` cũng dùng. Máy đọc được AVIF thì
     lượt tải trước này thành vô ích chứ không thành sai; đổi lấy 0 dòng phát hiện định
     dạng, và bản AVIF nhỏ hơn nên phần thiệt cũng nhỏ hơn. */
  im.srcset = eraSrcset(e.img, 'webp');
  im.src = 'img/era/' + e.img + '-700.webp';
}

/* Ảnh minh hoạ của mốc đang xem. `img` = tên file gốc; mốc nào không khai `img` thì
   KHÔNG có tranh — xem lý do ở `const ERAS`.
   ⚠️ `alt` PHẢI đổi theo ngôn ngữ và phải nói rõ đây là TRANH DỰNG: trình đọc màn hình
      là chỗ duy nhất nhãn "MINH HOẠ" ở góc ảnh không với tới được.
   ⚠️ Đặt `srcset` TRƯỚC `img.src`: gán `src` trước thì trình duyệt có thể bắt đầu tải
      bản mặc định rồi mới thấy `<source>`, tức tải hai lần trên đúng nhóm mạng yếu mà
      cả việc này sinh ra để phục vụ. */
let eraImgSeq = 0;                     // chống đua: chỉ lượt MỚI NHẤT được mở ảnh ra
function paintEraImg(e) {
  const fig = $('time-fig');
  if (!e.img) { fig.hidden = true; return; }
  const im = $('time-img');
  /* Khoá ảnh lại NGAY, trước khi đổi `srcset` — đổi trước rồi mới che thì có một
     khung hình lộ ra tranh cũ. */
  fig.classList.add('era-wait');
  const seq = ++eraImgSeq;
  $('time-avif').srcset = eraSrcset(e.img, 'avif');
  $('time-webp').srcset = eraSrcset(e.img, 'webp');
  im.sizes = ERA_SIZES;
  im.src = 'img/era/' + e.img + '-700.webp';   // nhánh cuối cho trình duyệt không đọc <source>
  im.alt = t('era_alt').replace('{n}', t('era_' + e.id + '_n'));
  $('time-illus').textContent = t('era_illus');
  fig.hidden = false;
  /* Ảnh đã nằm trong cache (nhờ `preloadEra`) thì `complete` đã true ngay ở đây —
     không có một khung hình nào bị che, cú bấm cảm giác tức thì.
     ⚠️ Ảnh LỖI (`onerror`) cũng phải mở khoá: `.era-wait` mãi là một ô trống vĩnh
        viễn, tức mất tranh mà còn mất cả lời giải thích vì sao. */
  const reveal = () => { if (seq === eraImgSeq) fig.classList.remove('era-wait'); };
  if (im.complete && im.naturalWidth) reveal();
  else { im.onload = reveal; im.onerror = reveal; }
  preloadEra(ERAS.indexOf(e) + 1);     // mốc kế tiếp — trẻ đang đọc, mạng đang rỗi
}

/* ───────────────────── Bước 5: năng lượng sạch ───────────────────── */
/* ⚠️ BA Ô THẢ NẰM TRÊN BẢN ĐỒ, KHÔNG NẰM TRONG BẢNG. Chúng là marker của cảnh
   (`world.addMarkers` với `zone`), nên `paint()` lo vị trí + chống-phóng cho chúng —
   xem cảnh báo ở `addMarkers` trong `js/earth2d.js`. `#energy-slots` vì thế bỏ trống;
   bảng ở đáy chỉ còn khay thẻ và dòng nhắc. */
function buildEnergy() {
  $('energy-k').textContent = t('ce_k');
  $('energy-hint').textContent = t('ce_hint');
  $('energy-slots').innerHTML = '';
  world.addMarkers(STACKS.map(st => ({
    id: st.id, zone: st.id, lat: st.lat, lon: st.lon,
    cls: 'e2-stack', label: t('ce_stack'),
    html: '<span class="puff" aria-hidden="true">💨</span>' +
          '<span class="ic" aria-hidden="true">🏭</span>'
  })));
  $('energy-tray').innerHTML = ENERGY.map(g =>
    `<button type="button" class="me-gem wide hit" data-want="${g.slot}">` +
    `<span class="ic" aria-hidden="true">${g.ic}</span>` +
    `<span class="tx">${esc(t('ce_' + g.id))}</span></button>`).join('');

  dragDrop({
    items: Array.from($('energy-tray').querySelectorAll('.me-gem')),
    zones: Array.from(document.querySelectorAll('.e2-stack')),
    wide: true,
    onHit(el, z) {
      z.classList.add('ok');
      // Nhà máy thành trạm điện sạch: đổi luôn cái emoji, không chỉ đổi màu viền
      z.querySelector('.ic').textContent = el.querySelector('.ic').textContent;
      el.classList.add('used');
      steps.energy.onPlace(el.getAttribute('data-want'));
    },
    onMiss() { nudge('energy-hint', 'ce_wrong', 'ce_hint'); }
  });
}

/* ───────────────────── Bước 7: Eco-Hero ─────────────────────
   Hai rổ nhận NHIỀU thẻ, nên `canDrop` luôn true — khác hẳn ô ngọc/ống khói (mỗi ô
   một thẻ). Đó chính là chỗ duy nhất ba bước khác nhau về luật thả. */
function buildEco() {
  $('eco-k').textContent = t('ec_k');
  $('eco-good').textContent = t('ec_good');
  $('eco-bad').textContent = t('ec_bad');
  $('eco-hint').textContent = t('ec_hint');
  $('eco-good-drop').innerHTML = '';
  $('eco-bad-drop').innerHTML = '';
  $('eco-deck').innerHTML = ECO.map(c =>
    `<button type="button" class="me-gem wide hit" data-card="${c.id}" data-want="${c.b}">` +
    `<span class="ic" aria-hidden="true">${c.ic}</span>` +
    `<span class="tx">${esc(t('eco_' + c.id))}</span></button>`).join('');

  dragDrop({
    items: Array.from($('eco-deck').querySelectorAll('.me-gem')),
    zones: Array.from($('eco').querySelectorAll('.me-bucket')),
    wide: true,
    canDrop: () => true,
    onHit(el, z) {
      const chip = document.createElement('span');
      chip.className = 'me-chip';
      chip.innerHTML = el.innerHTML;
      // Giữ id trên chip để `applyLang` dịch lại được thẻ đã xếp (xem ghi chú ở đó)
      chip.setAttribute('data-card', el.getAttribute('data-card'));
      z.querySelector('.drop').appendChild(chip);
      el.classList.add('used');
      steps.eco.onSort();
    },
    onMiss() { nudge('eco-hint', 'ec_wrong', 'ec_hint'); }

}

/* ───────────────────── Bước 8: bảng 3 ô ngọc ───────────────────── */
/* ───────────────────── Bước 7: đóng dấu Hồ Sơ Trái Đất ─────────────────────
   ⚠️ BA DÒNG HỒ SƠ PHẢI LÀ BA THỨ NHIỆM VỤ ĐÃ THẬT SỰ DẠY, không phải ba câu hay ho.
      Đối chiếu: nước 71% ← bước ① (câu đố, nguồn NASA) · nhiệt độ theo góc chiếu ←
      bước ③ (ba vùng khí hậu, nguồn NASA) · khí quyển có oxy ← nhịp 0 ở `explorer.html`
      + mốc "ngày nay" của bước ②. Thêm một dòng không có bước nào dạy là biến màn tổng
      kết thành chỗ nhồi kiến thức mới — đúng lúc trẻ tưởng đã xong.
   ⚠️ MỘT CÚ BẤM, KHÔNG PHẢI MỘT CÂU ĐỐ. Đây là chỗ CHỐT, không phải chỗ kiểm tra: bắt
      trẻ trả lời đúng mới cho về là dựng một cửa chặn ngay trước màn thưởng. */
/* ══ BƯỚC ④ · LÁT CẮT TRÁI ĐẤT ══════════════════════════════════════════════
   ⚠️⚠️ ĐÂY LÀ KHUÔN TƯƠNG TÁC THỨ SÁU, VÀ NÓ CỐ Ý KHÔNG DÙNG LẠI HAI ENGINE CÓ SẴN.
      `docs/decisions/002` cấm dùng một khuôn quá 2 lần trong một nhiệm vụ. Đếm được
      bằng `grep` trên chính file này: `dragDrop(` **2 lần** (④ energy · ⑥ eco) và
      `buildAsk(` **2 lần** (① scan · ③ sun). Cả hai ĐÃ ĐẦY.
      · Cài bằng `dragDrop()` → `profile_builder` lần thứ 3.
      · Cài bằng `buildAsk()` → câu đố lần thứ 3.
      Nên phải là mã riêng. Cái giá là ~90 dòng không dùng lại được; cái được là bước
      này không đọc ra như bước thứ ba của cùng một trò.
   ⚠️ VÌ SAO NÓ KHÔNG PHẢI LÀ MỘT CÂU ĐỐ 4 LỰA CHỌN TRÁ HÌNH: câu đố hỏi xong là vứt
      câu hỏi đi. Ở đây mỗi lượt để lại một con chip trên cột, và **cái cột dựng dần
      lên mới là thứ mang bài học** — xong 4 lượt thì chính nó là bằng chứng cho tiêu
      đề bước ("Sự sống ở khắp nơi"). Thứ trẻ tạo ra là một biểu đồ, không phải điểm số.
   ⚠️ `RUNGS` vẽ TRÊN xuống DƯỚI (nấc 1 cao nhất). Đường mực nước biển chèn giữa nấc 3
      và 4 — đó là mốc DUY NHẤT trên cột có ý nghĩa vật lý, và nó là thứ làm cho nấc 4
      ("dưới mặt nước") đọc ra được. */
function buildXsec(onPick) {
  $('xsec-k').textContent = t('xsec_k');
  $('xsec-q').textContent = '';
  $('xsec-hint').textContent = '';
  $('xsec-col').innerHTML = RUNGS.map(r =>
    `<button type="button" class="xsec-rung hit" data-rank="${r}" disabled>` +
      `<span class="lb">${esc(t('rung_' + r))}</span>` +
      `<span class="chips" data-chips="${r}"></span>` +
    `</button>` +
    (r === 3 ? `<div class="xsec-sea" aria-hidden="true"><span>${esc(t('xsec_sea'))}</span></div>` : '')
  ).join('');

  const col = $('xsec-col');
  col.onclick = ev => {
    const b = ev.target.closest('.xsec-rung');
    if (b && !b.disabled) onPick(Number(b.dataset.rank));
  };
  /* Mũi tên đi giữa các nấc. Tab vẫn vào được từng nút (chúng là `<button>` thật), nhưng
     một cái cột thì mũi tên mới là thứ tay tự tìm tới — và bốn nút cùng một nhóm mà bắt
     Tab bốn lần là đang bắt bàn phím trả giá cho một bố cục vốn dành cho chuột. */
  col.onkeydown = ev => {
    if (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown') return;
    const list = Array.from(col.querySelectorAll('.xsec-rung:not([disabled])'));
    const i = list.indexOf(document.activeElement);
    if (i < 0) return;
    ev.preventDefault();
    const nx = list[(i + (ev.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length];
    if (nx) nx.focus();
  };
}

/** Mở/khoá cả bốn nấc. Khoá trong lúc đang hé lộ để một cú bấm lỡ tay không rơi vào
    câu hỏi kế tiếp — cùng lý do với cờ `busy` ở các bước chạm marker. */
function setRungs(on) {
  $('xsec-col').querySelectorAll('.xsec-rung').forEach(b => { b.disabled = !on; });
}

/** Thả con chip của một nơi vào ĐÚNG nấc của nó — dù trẻ đoán nấc nào. */
function placeChip(b) {
  const box = $('xsec-col').querySelector('[data-chips="' + b.rank + '"]');
  if (!box) return;
  const c = document.createElement('span');
  c.className = 'xsec-chip';
  c.style.setProperty('--cc', b.cc);
  c.innerHTML = `<span aria-hidden="true">${b.ic}</span> ${esc(b.nm[LANG] || b.nm.vi)}`;
  box.appendChild(c);
}

function buildFile() {
  $('core-k').textContent = t('s5_k');
  $('core-hint').textContent = '';
  $('core-slots').innerHTML = ['water', 'heat', 'air'].map(k =>
    `<div class="me-fileline"><span class="tick" aria-hidden="true">✓</span>` +
    `<span class="tx">${esc(t('file_' + k))}</span></div>`).join('');
  $('core-tray').innerHTML =
    `<button type="button" class="me-stamp hit" id="core-stamp">${esc(t('s5_stamp'))}</button>`;
  $('core-stamp').addEventListener('click', () => {
    $('core-stamp').disabled = true;      // `onStamp` có await → khoá ngay, không bấm chồng
    steps.core.onStamp();
  });
}

/* Tên ngắn cho `RUN.finish` — 8 bước bên trên đều gọi `finishStep('id')`.
   Toàn bộ trình tự (outro → báo server → afterReport → bước kế) và lý do KHÔNG
   được đảo thứ tự ấy nằm ở `js/mission-engine.js`. */
async function finishStep(id) { return RUN.finish(id); }

/* ───────────────────── Ngôn ngữ ───────────────────── */
function applyLang(lang) {
  if (lang === 'en' || lang === 'vi') LANG = lang;
  document.documentElement.lang = LANG;
  document.title = t('title');
  AstroQ.applyTexts(t);
  AstroQ.markLangButtons(LANG);
  /* Vỏ tự vẽ lại phần của nó (header, nhãn mục tiêu, nút thẻ, màn tổng kết, hộp
     hỏi) — trang chỉ còn lo mấy cái BẢNG nội dung của riêng nó ở dưới. */
  ST.applyLang();
  $('load-sub').textContent = $('load-sub').dataset.fail ? t('load_fail') : t('load_sub');
  /* ĐỔI NGÔN NGỮ GIỮA MỘT BƯỚC KÉO-THẢ: chỉ vẽ lại NHÃN, KHÔNG dựng lại bảng —
     `build*()` sinh markup mới nên mọi ô đã kích hoạt / thẻ đã xếp biến mất và trẻ
     phải làm lại từ đầu chỉ vì bấm EN. Vì thế mỗi bảng có một nhánh riêng ở đây, và
     mỗi lần thêm chữ vào bảng thì phải thêm vào đúng nhánh của nó. */
  if ($('core').classList.contains('show')) {
    /* Bước ⑦ nay chỉ có chữ tĩnh + một cái nút, không có ô nào đã kích hoạt để mất —
       nên ở đây dựng lại được cả bảng. Nhưng phải GIỮ trạng thái đã đóng dấu, không
       thì đổi ngôn ngữ giữa chừng là nút sống lại và trẻ đóng dấu được hai lần. */
    const done = steps.core.stamped;
    buildFile();
    if (done) $('core-stamp').disabled = true;
  }
  if ($('time').classList.contains('show')) {
    $('time-k').textContent = t('tl_k');
    $('time-rail').querySelectorAll('.me-era-node').forEach((b, i) => {
      const e = ERAS[i];
      b.querySelector('.yr').textContent = t('era_' + e.id + '_y');
      b.querySelector('.nm').textContent = t('era_' + e.id + '_n');
      b.setAttribute('aria-label', t('era_' + e.id + '_y') + ' — ' + t('era_' + e.id + '_n'));
    });
    // Nhãn MINH HOẠ + `alt` cũng phải dịch theo, không thì đổi EN xong nhãn đứng
    // nguyên tiếng Việt ngay giữa một bức tranh.
    if (!$('time-fig').hidden) {
      const _e = ERAS[Math.max(0, steps.timeline.seen - 1)];
      if (_e) paintEraImg(_e);
    }
    // Mốc đang mở: dịch lại đúng cái đó, không nhảy về mốc đầu
    const cur = ERAS[Math.max(0, steps.timeline.seen - 1)];
    if (steps.timeline.seen > 0) paintEraBody(cur);
    /* ⚠️ KHỐI GIỮ CHỖ PHẢI DỰNG LẠI THEO NGÔN NGỮ MỚI. Câu tiếng Anh dài khác câu
       tiếng Việt, nên bỏ dòng này là sau khi bấm EN cả 5 mốc lại lệch nhau y như
       trước — đúng cái lỗi vừa đi sửa, chỉ ẩn sau một cú bấm VI/EN. */
    paintEraGhost();
  }
  /* ⚠️⚠️ BƯỚC ④ PHẢI CÓ NHÁNH NÀY — VÀ NÓ ĐƯỢC THÊM VÌ VỪA BẮT ĐÚNG LỖI CÙNG HỌ Ở
     BƯỚC ⑤ (nhãn ống khói không đổi theo ngôn ngữ). Cột lát cắt **sống suốt cả bước**
     (khác cái thẻ, vốn tạm thời và phải bấm OK mới đóng), nên thiếu nhánh này thì đổi
     VI/EN giữa bước ④ để lại một cột tiếng Việt trong một trang tiếng Anh.
     ⚠️ DỊCH TẠI CHỖ, ĐỪNG DỰNG LẠI `innerHTML`: dựng lại là mất trạng thái `disabled`
        của bốn nấc và mất cả tiêu điểm bàn phím — trẻ đang dùng bàn phím thì cú Enter
        kế tiếp rơi vào `<body>`. */
  if ($('xsec').classList.contains('show')) {
    $('xsec-k').textContent = t('xsec_k');
    $('xsec-col').querySelectorAll('.xsec-rung').forEach(b => {
      b.querySelector('.lb').textContent = t('rung_' + b.dataset.rank);
    });
    const _sea = $('xsec-col').querySelector('.xsec-sea span');
    if (_sea) _sea.textContent = t('xsec_sea');
    /* Chip đã thả: tên nơi cũng phải dịch. Đọc lại từ `got` chứ không từ DOM — tên cũ
       nằm trong DOM chính là thứ đang cần thay. */
    BIOMES.forEach(b => {
      if (!steps.life.got.has(b.id)) return;
      const c = $('xsec-col').querySelector('[data-chips="' + b.rank + '"] .xsec-chip');
      if (c) c.innerHTML = `<span aria-hidden="true">${b.ic}</span> ` +
                           esc(b.nm[LANG] || b.nm.vi);
    });
    const _cur = steps.life.cur;
    $('xsec-q').textContent = _cur
      ? t('xsec_q').replace('{nm}', _cur.nm[LANG] || _cur.nm.vi) : '';
    /* Câu phản hồi cũng giữ bằng CỜ chứ không bằng chuỗi — giữ chuỗi thì đổi ngôn ngữ
       giữa lúc nó đang hiện là nó đứng lại ở tiếng cũ. Cùng bài học với `errKey` của
       form waitlist ở trang chủ. */
    if (steps.life.lastHit !== null) {
      $('xsec-hint').textContent = steps.life.lastHit ? t('xsec_ok') : t('xsec_near');
    }
  }
  if ($('energy').classList.contains('show')) {
    $('energy-k').textContent = t('ce_k');
    $('energy-hint').textContent = t('ce_hint');
    /* ⚠️ DÒ `.e2-stack`, KHÔNG PHẢI `#energy-slots .me-stack` — LỖI THẬT ĐÃ SỬA
       02/08/2026. Ba ống khói đã dời lên BẢN ĐỒ thành marker của cảnh, `#energy-slots`
       nay luôn rỗng (xem `buildEnergy`), nên vòng lặp cũ chạy 0 lần và **đổi VI/EN
       giữa bước ⑤ không đổi được nhãn ống khói nào**. Lỗi im lặng tuyệt đối: không
       ngoại lệ, không console, chỉ là một việc lặng lẽ không xảy ra.
       ⚠️ Ống khói mang nhãn ở `aria-label` chứ không có phần tử `.lb` — bên trong nó
          chỉ có emoji `aria-hidden`. Gọi `.querySelector('.lb').textContent` ở đây là
          `TypeError` ngay lần đổi ngôn ngữ đầu tiên. */
    document.querySelectorAll('.e2-mk.e2-stack').forEach(z => {
      // Ống khói ĐÃ thay thì nhãn là tên nguồn sạch, chưa thay thì là "ỐNG KHÓI"
      const g = z.classList.contains('ok')
        ? ENERGY.find(x => x.slot === z.getAttribute('data-zone')) : null;
      z.setAttribute('aria-label', g ? t('ce_' + g.id) : t('ce_stack'));
    });
    $('energy-tray').querySelectorAll('.me-gem').forEach(el => {
      const g = ENERGY.find(x => x.slot === el.getAttribute('data-want'));
      if (g) el.querySelector('.tx').textContent = t('ce_' + g.id);
    });
  }
  if ($('eco').classList.contains('show')) {
    $('eco-k').textContent = t('ec_k');
    $('eco-good').textContent = t('ec_good');
    $('eco-bad').textContent = t('ec_bad');
    $('eco-hint').textContent = t('ec_hint');
    $('eco-deck').querySelectorAll('.me-gem').forEach(el => {
      el.querySelector('.tx').textContent = t('eco_' + el.getAttribute('data-card'));
    });
    /* Thẻ đã xếp vào rổ cũng phải dịch. Chip được tạo bằng `innerHTML` của thẻ nên
       không còn `data-card` — dò lại theo THỨ TỰ xếp trong từng rổ thì sai (thứ tự do
       trẻ quyết), nên gắn luôn id vào chip lúc tạo. */
    $('eco').querySelectorAll('.me-chip').forEach(chip => {
      const id = chip.getAttribute('data-card');
      if (id) chip.querySelector('.tx').textContent = t('eco_' + id);
    });
  }
}

RUN.paint();

/* ───────────────── VÀO CHƠI TIẾP TỪ BƯỚC CÒN DỞ ─────────────────
   Vào từ Sảnh Nhiệm Vụ (nút "Tiếp tục nhiệm vụ") hay từ modal cổng lộ trình ở
   `explorer.html` thì phải mở đúng bước đang dở, KHÔNG bắt chơi lại từ bước ①.

   ⚠️ ĐỌC CACHE, KHÔNG GỌI API — và đó là bắt buộc, không phải tối ưu: trang này
      **cố ý không nạp** `js/firebase-auth.js` (`check_pages` mục [3b] canh chuyện
      đó) nên nó KHÔNG có token để hỏi `GET /me/missions`. Trang có token
      (`missions.html`, `dashboard.html`) ghi cache; ở đây chỉ đọc. Đúng khuôn
      `astroq-route-gate` mà `explorer.html` đang dùng. Luật vẫn ở server: cache chỉ
      chứa **id bước**, không chứa một con số thưởng nào.

   ⚠️ CHƯA ĐỌC ĐƯỢC SERVER LẦN NÀO (`known:false`) → MỞ TỪ BƯỚC ①. Đoán bằng bản
      sao trong máy là chuyện dự án đã cố ý không làm cho nhiệm vụ; thà chơi lại một
      bước còn hơn bỏ qua một bước trẻ chưa từng học.
   ⚠️ Xong cả nhiệm vụ → cũng từ bước ①: đó là lượt "Chơi lại" mà `missions.html`
      đang mời (nhãn `replay`), không phải lượt tiếp tục.
   `?restart=1` để xem lại cả nhiệm vụ từ đầu mà không phải xoá tiến độ thật.

   ⚠️ `?step=<id>` — CÂY CHẶNG (`mission-tree.html`) MỞ ĐÚNG MỘT CHẶNG. Trẻ chạm vào
      một chặng cụ thể thì phải vào đúng chặng đó, kể cả khi đó là chặng cũ nó muốn
      chơi lại. `RUN.openAt()` KẸP lại theo số bước đã xong, nên gõ tay một chặng chưa
      mở vào thanh URL cũng không vượt được — địa chỉ là thứ ai cũng sửa được. */
/* ⚠️ CHỈ CÒN MỘT CẢNH: 2D. three.js và `js/earth3d.js` đã bỏ hẳn ngày 31/07/2026,
   sau khi bản 2D đạt 154/154 trên ĐÚNG bộ kiểm thử của bản 3D — và so cả danh sách
   nhãn: không phép kiểm nào chỉ có ở một bên. Cờ `?scene=2d|3d` là giàn giáo của
   giai đoạn hai-engine-song-song, tháo cùng lúc.
   Đo được: đường tải đầu 308 KB → 71 KB, và `unpkg.com` biến mất khỏi luồng
   onboarding mà MỌI phi hành gia mới bắt buộc đi qua. */
(async function boot() {
  try {
    world = AstroQEarth2D.create($('stage'), { reduced });
  } catch (e) {
    $('load-sub').dataset.fail = '1';
    $('load-sub').textContent = t('load_fail');
    $('load').querySelector('.ring').style.display = 'none';
    console.warn('[AstroQ] Không dựng được cảnh:', e && e.message);
    return;
  }
  world.onPick(ev => RUN.pick(ev));
  world.start();

  // Vòng theo dõi liên tục cho bước cần đo góc (bước 3)
  setInterval(() => RUN.tick(), 120);

  $('load').classList.add('gone');

  /* Bề mặt điều khiển cho test tự động đi qua từng bước mà không phải bấm đúng
     pixel. Chỉ là điều khiển, KHÔNG cấp thưởng — thưởng vẫn do server quyết.
     ⚠️ Gán TRƯỚC `await steps.scan.enter()`: bước 1 chờ trẻ bấm "Tiếp tục" nên
     nếu gán sau thì `window.__mission` không tồn tại cho tới khi có người bấm. */
  window.__mission = {
    get step() { return RUN.step; },
    get done() { return RUN.done; },
    get reward() { return RUN.reward; },
    /* Mọi bước có hoạt cảnh đều chặn cú chạm mới trong lúc nó chạy (`busy`). Test
       phải đọc được cờ này, không thì nó bấm lượt thứ hai lúc còn bị chặn rồi báo
       hỏng oan. (Chú thích cũ ghi "bước 4 · drone đang bay" — con drone đã bỏ
       02/08/2026 và số hiệu bước đã đổi 03/08/2026.) */
    get busy() { return busy; },
    /* ⚠️ Cố ý KHÔNG trả Promise ra ngoài. `page.evaluate` của Playwright TỰ CHỜ
       promise nào được trả về, mà `pick()` bên trong lại chờ trẻ bấm "Tiếp tục" →
       script test treo vĩnh viễn thay vì báo hỏng. Gọi rồi thôi; test tự chờ
       trạng thái nó cần bằng `wait_for_function`. */
    pick: (ev) => { RUN.pick(ev); return true; },
    tick: () => { RUN.tick(); return true; },
    say: () => ST.sayNext(),
    /** Mở thẳng màn tổng kết — để test đường về tự động khỏi phải chơi hết 7 bước.
        ⚠️ KHÔNG trả Promise (cùng lý do như `pick`): `showWin` là async, mà
           `page.evaluate` tự chờ promise được trả về. */
    win: () => ST.win(),
    /* Bảng "dự đoán của phi hành gia" — nay có ở HAI bước: ① (nước hay đất) và
       ③ (nếu Mặt Trời tắt thì sao). Định tuyến theo bước ĐANG chạy thay vì gắn cứng
       `steps.scan`: gắn cứng thì bộ test gọi ở bước ③ sẽ âm thầm bấm vào bước ①.
       Cùng quy tắc KHÔNG trả Promise.
       ⚠️ Ở bước ① test phải gọi được cả nhánh ĐOÁN SAI — "đoán sai không phạt" là một
          luật của thiết kế, mà luật nào không có phép kiểm thì sớm muộn có người
          "sửa" nó đi. Ở bước ③ thì không có nhánh sai: cả ba lựa chọn đều đúng. */
    answer: (pick) => {
      const st = steps[RUN.step];
      if (st && st.onAnswer) st.onAnswer(pick);
      return true;
    },
    /** Số châu lục đã chạm ở bước ① — test chờ số này thay vì đoán theo thời gian. */
    get scanned() { return steps.scan.hits; },
    /** Số vùng khí hậu đã chạm ở bước ③ (nhịp b). */
    get zones() { return steps.sun.got.size; },
    /* Đốm bàn tay 👆 ĐANG chỉ vào; `null` = tay đang tắt.
       ⚠️ THÊM 03/08/2026 CÙNG LÚC SỬA LỖI "bàn tay vẫn ở chỗ cũ". Không có bề mặt này
          thì phép kiểm chỉ đo được *có bàn tay hay không*, chứ không đo được nó chỉ vào
          ĐÚNG đốm nào — mà lỗi vừa sửa là bàn tay hiện rõ ràng, chỉ là chỉ sai chỗ. Một
          lỗi mà bộ đo không có cách nào hỏi tới thì nó sẽ quay lại. */
    get handTarget() { return handId; },
    /* ⚠️ BƯỚC ④ KHÔNG CÒN LÁI ĐƯỢC BẰNG `pick()` — nó không còn nhận cú chạm marker
       nào (xem `steps.life.onRung`). Test phải chọn NẤC. Cùng quy tắc: KHÔNG trả Promise.
       ⚠️ Phải gọi được CẢ nhánh đoán sai: "đoán sai không phạt" là một luật của thiết
          kế, mà luật nào không có phép kiểm thì sớm muộn có người "sửa" nó đi. */
    rung: (rank) => { steps.life.onRung(rank); return true; },
    /** Nấc ĐÚNG của nơi đang được hỏi — test đoán sai bằng cách chọn nấc khác số này. */
    get rungWanted() { return steps.life.cur ? steps.life.cur.rank : null; },
    /** Số nơi đã xếp lên lát cắt ở bước ④. */
    get placed() { return steps.life.got.size; },
    /** Giây còn lại của đường về tự động; `null` = đã tắt đếm. */
    get autoLeft() { return ST.autoLeft; },
    /** Hộp "tiếp hay dừng" đang mở hay không, và hai lựa chọn của nó. Chỉ là
        ĐIỀU KHIỂN cho test — không cấp thưởng, không bỏ qua bước nào. */
    get askOpen() { return ST.askOpen; },
    askNext: () => ST.askNext(),
    askStop: () => ST.askStop(),
    /* ⚠️ ĐỔI TỪ `fill(slot)` SANG `stamp()` 02/08/2026 — bước ⑦ không còn kéo ngọc
       vào ô mà chỉ còn MỘT cú đóng dấu. Giữ tên cũ là để lại một bề mặt test nói
       về cơ chế không còn tồn tại. Cùng quy tắc: KHÔNG trả Promise. */
    stamp: () => { steps.core.onStamp(); return true; },
    /* Ba bước thêm 29/07/2026. Cùng quy tắc với `pick`/`fill`: KHÔNG trả Promise —
       `openEra` có thể chờ thẻ nham thạch (3,4s hoặc tới khi trẻ bấm), `page.evaluate`
       tự chờ promise được trả về nên script test sẽ treo thay vì báo hỏng. */
    era: (i) => { steps.timeline.openEra(i); return true; },
    /* ⚠️ MỐC CUỐI KHÔNG CÒN TỰ CHỐT BƯỚC — test phải bấm nút như trẻ. Cùng quy tắc:
       KHÔNG trả Promise (`onDone` có await `finishStep`). */
    eraDone: () => { steps.timeline.onDone(); return true; },
    /** Số mốc đã xem — test chờ `eras === 5` thay vì đoán theo thời gian.
        ⚠️ ĐỌC TỪ `ERAS.length`, ĐỪNG GÁN CỨNG số 5 trong script test: bước này đã
           đi từ 4 lên 5 mốc một lần rồi (`005`), và bài học "gán cứng con số mà nơi
           khác mới là nguồn sự thật" đã lặp lại đủ nhiều lần trong dự án này. */
    get eras() { return steps.timeline.seen; },
    get eraTotal() { return ERAS.length; },
    place: (id) => { steps.energy.onPlace(id); return true; },
    /** Độ dày khói còn lại (1 → 0). Bằng 0 là bước năng lượng sạch đã xong. */
    get smog() { return Number($('smog').style.getPropertyValue('--smog') || 0); },
    sort: () => { steps.eco.onSort(); return true; },
    get sorted() { return steps.eco.sorted; },
    /** Huy hiệu SERVER báo vừa mở trong lượt này — test đối chiếu với Missions.cs. */
    get badges() { return RUN.reward.badges; },
    world
  };

  ST.resumeSteps();
  await RUN.enter();
})();
</script>
